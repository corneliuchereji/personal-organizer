function fmtDLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return fmtDLocal(d)}

function parseNLDate(str){
  if(!str)return null;
  const s=str.toLowerCase().trim();
  const fmt=d=>fmtDLocal(d);
  const base=parseD(TODAY);
  const add=n=>{const d=new Date(base);d.setDate(d.getDate()+n);return fmt(d)};
  if(s==='today'||s==='azi')return TODAY;
  if(s==='tomorrow'||s==='maine')return add(1);
  if(s==='yesterday')return add(-1);
  const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const dm=s.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
  if(dm){const di=DAYS.indexOf(dm[1]);const cur=base.getDay();let diff=di-cur;if(diff<=0)diff+=7;return add(diff)}
  const inm=s.match(/in\s+(\d+)\s+days?/);if(inm)return add(parseInt(inm[1]));
  const iso=s.match(/(\d{4}-\d{2}-\d{2})/);if(iso)return iso[1];
  const MNAMES=['january','february','march','april','may','june','july','august','september','october','november','december'];
  for(let i=0;i<MNAMES.length;i++){
    const m=s.match(new RegExp('(\\d{1,2})\\s+'+MNAMES[i]+'|'+MNAMES[i]+'\\s+(\\d{1,2})'));
    if(m){const day=parseInt(m[1]||m[2]);return base.getFullYear()+'-'+String(i+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
  }
  const dmy=s.match(/(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{4}))?/);
  if(dmy)return(dmy[3]||String(base.getFullYear()))+'-'+dmy[2].padStart(2,'0')+'-'+dmy[1].padStart(2,'0');
  return null;
}

function parseNLTime(str){
  if(!str)return'09';
  const m=str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);if(!m)return'09';
  let h=parseInt(m[1]);
  if((m[3]||'').toLowerCase()==='pm'&&h<12)h+=12;
  if((m[3]||'').toLowerCase()==='am'&&h===12)h=0;
  const mm=m[2]||'00';
  return String(h).padStart(2,'0')+':'+mm.padStart(2,'0');
}

function findTask(q){const ql=q.toLowerCase();return S.tasks.find(t=>t.name.toLowerCase().includes(ql))}
function findSport(q){const ql=q.toLowerCase();return(S.sportEvents||[]).find(e=>e.name.toLowerCase().includes(ql))}
async function fetchRealSportEvent(query){
  // Map common sport names to TheSportsDB league IDs
  const SPORT_IDS={
    'motogp':'motogp',f1:'4370',motogp:'4558',
    'formula 1':'4370','formula1':'4370',
    'champions league':'4480','ucl':'4480',
    'serie a':'4331','bundesliga':'4332',
    'tour de france':'4479','tdf':'4479',
  };
  const q=query.toLowerCase();
  let leagueId=null;
  for(const[k,v] of Object.entries(SPORT_IDS)){
    if(q.includes(k)){leagueId=v;break;}
  }
  if(!leagueId)return null;
  try{
    const r=await fetch('/api/sports/next/'+leagueId);
    const d=await r.json();
    const evs=d.events||d.event||[];
    if(!evs.length)return null;
    const ev=evs[0];
    return{
      name: ev.strEvent||ev.strLeague,
      date: ev.dateEvent,
      time: (ev.strTime||'14:00').slice(0,5),
      notes: (ev.strVenue||'')+(ev.strCountry?' · '+ev.strCountry:''),
      sport: leagueId==='4370'?'f1':leagueId==='4558'?'motogp':leagueId==='4480'?'ucl':leagueId==='4331'?'seriea':leagueId==='4332'?'bundesliga':'other'
    };
  }catch(e){return null;}
}

function guessGroup(t){const s=t.toLowerCase();if(/car|vehicle|tire|insurance|fuel/.test(s))return'g_car';if(/work|meeting|deadline|office|project|client/.test(s))return'g_work';if(/bill|invoice|electric|water|gas|internet|rent|payment/.test(s))return'g_home';if(/gym|run|sport|race|match|training/.test(s))return'g_sport';return'g_pers'}
function guessPriority(t){const s=t.toLowerCase();if(/urgent|asap|critical/.test(s))return'very';if(/important|high/.test(s))return'high';if(/low|minor/.test(s))return'low';return'normal'}
function guessSport(t){const s=t.toLowerCase();if(/f1|formula|grand.?prix|\bgp\b/.test(s))return'f1';if(/motogp|moto.?gp/.test(s))return'motogp';if(/tour.de.france|tdf/.test(s))return'tdf';if(/giro/.test(s))return'giro';if(/champions|ucl/.test(s))return'ucl';if(/serie.?a|milan|inter|juve/.test(s))return'seriea';if(/bundesliga/.test(s))return'bundesliga';if(/wec|endurance|le.?mans/.test(s))return'wec';if(/snooker/.test(s))return'snooker';if(/romania/.test(s))return'romania';return'other'}

function processChat(raw){
  // Strip polite filler at the start in any language
  let clean=raw.trim().replace(/^(?:please|can you|could you|would you|te rog|va rog|poti|i want you to|i'd like you to|i would like you to)\s+/i,'');
  const txt=clean.toLowerCase();

  // ── CLEAR ALL ──
  if(/(?:remove|delete|clear)\s+all\s+tasks?/.test(txt)){const n=S.tasks.length;S.tasks=[];saveState();renderAll();return'🗑️ Removed all '+n+' tasks.'}
  if(/(?:remove|delete|clear)\s+all\s+(?:sport|event|competition)/.test(txt)){const n=(S.sportEvents||[]).length;S.sportEvents=[];saveState();renderAll();return'🗑️ Removed all '+n+' sport events.'}

  // ── DELETE ──
  const delM=txt.match(/^(?:delete|remove|sterge|elimina)\s+(?:task\s+|event\s+)?["']?(.+?)["']?\s*$/);
  if(delM&&!/\ball\b/.test(txt)){
    const t=findTask(delM[1]);if(t){S.tasks=S.tasks.filter(x=>x.id!==t.id);saveState();renderAll();return'🗑️ Deleted: <b>'+escHtml(t.name)+'</b>'}
    const se=findSport(delM[1]);if(se){S.sportEvents=(S.sportEvents||[]).filter(x=>x.id!==se.id);saveState();renderAll();return'🗑️ Deleted: <b>'+escHtml(se.name)+'</b>'}
    return'❌ Could not find "'+escHtml(delM[1])+'"'
  }

  // ── MARK DONE ──
  const doneM=txt.match(/^(?:mark\s+)?(?:done|completed?|gata|rezolvat)\s+["']?(.+?)["']?\s*$/);
  if(doneM){const t=findTask(doneM[1]);if(t){t.done=!t.done;saveState();renderAll();return'✅ Marked <b>'+escHtml(t.name)+'</b> as '+(t.done?'done':'not done')}return'❌ Could not find that task.'}

  // ── POSTPONE ──
  const postM=txt.match(/^postpone\s+["']?(.+?)["']?(?:\s+by\s+(\d+)\s+days?)?\s*$/);
  if(postM){const t=findTask(postM[1]);if(t){const n=parseInt(postM[2])||1;t.date=addDays(t.date,n);saveState();renderAll();return'⏩ Postponed <b>'+escHtml(t.name)+'</b> by '+n+' day(s) → '+t.date}return'❌ Could not find that task.'}

  // ── QUERY ──
  if(/what.*(?:today|schedule)|show.*today|today.*event|list.*task|ce am azi/.test(txt)){const evs=eventsOnDay(TODAY);if(!evs.length)return'📅 Nothing today ('+TODAY+').';return'📅 Today:<br>'+evs.map(e=>'• '+fmtTime(e.time)+' <b>'+escHtml(e.name)+'</b>').join('<br>')}
  if(/how many|cate/.test(txt))return'📋 '+S.tasks.filter(t=>!t.done).length+' active tasks · '+(S.sportEvents||[]).length+' sport events.';

  // ── HELP ──
  if(/^help/.test(txt))return'What I can do:<br>• <em>add task dentist tomorrow at 10am</em><br>• <em>please add an event on 06.08.2026 at 19:00 named "Joi - cantare"</em><br>• <em>add sport F1 Belgian GP on July 26 at 16:00</em><br>• <em>delete dentist</em><br>• <em>mark done dentist</em><br>• <em>postpone dentist by 2 days</em><br>• <em>remove all tasks</em><br>• <em>what do I have today?</em>';

  // ── DETECT ADD INTENT ──
  const isAddI=/^(?:add|new|create|schedule|set|adauga|pune|creeaza)\b/i.test(clean);
  const isSportI=/\b(?:f1|formula|grand.?prix|\bgp\b|motogp|tour.de.france|giro|champions.league|ucl|serie.?a|bundesliga|wec|snooker|roubaix|nurburgring)\b/i.test(raw);

  if(!isAddI&&!isSportI)return'❓ I didn\'t understand that. Type <em>help</em> to see what I can do, or use the <b>+ Add event</b> button.';

  // ── EXTRACT NAME from "named X" or "called X" or quoted string ──
  let forcedName=null;
  const namedM=clean.match(/\bnamed?\s+[""]([^"""]+)[""]|\bcalled?\s+[""]([^"""]+)[""]|[""]([^"""]+)[""]/);
  if(namedM){
    forcedName=(namedM[1]||namedM[2]||namedM[3]).trim();
    // Remove the named/called + quoted part from clean so it doesn't pollute date/time parsing
    clean=clean.replace(namedM[0],'').trim();
  }
  // Also handle straight quotes
  const sqM=!forcedName&&clean.match(/\bnamed?\s+"([^"]+)"|\bcalled?\s+"([^"]+)"|"([^"]+)"/);
  if(sqM){
    forcedName=(sqM[1]||sqM[2]||sqM[3]).trim();
    clean=clean.replace(sqM[0],'').trim();
  }

  // ── EXTRACT TIME ──
  const tmM=clean.match(/\bat\s+(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)\b/i)
         ||clean.match(/\bora\s+(\d{1,2}(?::\d{2})?)\b/i);
  const time=tmM?parseNLTime(tmM[1]):(isSportI?'14':'09');
  if(tmM)clean=clean.replace(tmM[0],'').trim();

  // ── EXTRACT DATE ──
  // Order matters: most specific first
  let date=TODAY;
  const yr=parseD(TODAY).getFullYear();
  const datePatterns=[
    // ISO: 2026-08-06
    {r:/\b(\d{4})-(\d{2})-(\d{2})\b/,       f:m=>m[1]+'-'+m[2]+'-'+m[3]},
    // DD.MM.YYYY or DD/MM/YYYY or DD-MM-YYYY
    {r:/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})\b/, f:m=>m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')},
    // DD.MM (no year)
    {r:/\b(\d{1,2})[.\/-](\d{1,2})\b/,       f:m=>yr+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')},
    // tomorrow / maine
    {r:/\b(?:tomorrow|maine)\b/i,              f:()=>addDays(TODAY,1)},
    // today / azi
    {r:/\b(?:today|azi)\b/i,                   f:()=>TODAY},
    // next Monday / weekday name
    {r:/\b(?:next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday|luni|marti|miercuri|joi|vineri|sambata|duminica)\b/i,
      f:m=>{const DAYS={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,duminica:0,luni:1,marti:2,miercuri:3,joi:4,vineri:5,sambata:6};
            const di=DAYS[m[1].toLowerCase()];const base=parseD(TODAY);
            let diff=di-base.getDay();if(diff<=0)diff+=7;return addDays(TODAY,diff)}},
    // July 26 / 26 July
    {r:/\b(?:on\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|ianuarie|februarie|martie|aprilie|mai|iunie|iulie|august|septembrie|octombrie|noiembrie|decembrie)\s+(\d{1,2})\b/i,
      f:m=>{const MI={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,ianuarie:1,februarie:2,martie:3,aprilie:4,mai:5,iunie:6,iulie:7,august:8,septembrie:9,octombrie:10,noiembrie:11,decembrie:12};
            const mo=MI[m[1].toLowerCase()];return yr+'-'+String(mo).padStart(2,'0')+'-'+String(parseInt(m[2])).padStart(2,'0')}},
    {r:/\b(\d{1,2})\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/i,
      f:m=>{const MI={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
            const mo=MI[m[2].toLowerCase()];return yr+'-'+String(mo).padStart(2,'0')+'-'+String(parseInt(m[1])).padStart(2,'0')}},
    // in N days
    {r:/\bin\s+(\d+)\s+days?\b/i,             f:m=>addDays(TODAY,parseInt(m[1]))},
  ];
  for(const p of datePatterns){
    const m=clean.match(p.r);
    if(m){date=p.f(m);clean=clean.replace(m[0],'').trim();break;}
  }

  // ── CLEAN UP REMAINING TEXT TO GET THE NAME ──
  let name=forcedName;
  if(!name){
    // Strip trigger words and filler
    clean=clean
      .replace(/^(?:please|add|new|create|schedule|set|a|an|the|event|task|reminder|appointment|sport|adauga|pune|eveniment|sarcina|memento)\s+/gi,'')
      .replace(/\b(?:on|for|at|named?|called?)\b/gi,'')
      .replace(/[-–,;:]+$/,'').replace(/^[-–,;:]+/,'')
      .replace(/\s+/g,' ').trim();
    name=clean;
  }

  if(!name)return'❓ What should I call this event? Try: <em>add task dentist tomorrow at 10am</em>';

  // ── SAVE ──
  if(isSportI&&!(/^(?:add|new|create)\s+task/i.test(raw))){
    if(!S.sportEvents)S.sportEvents=[];
    const sport=guessSport(raw);
    S.sportEvents.push({id:uid(),name,date,time,sport,notes:'',color:SPORT_COLORS[sport]||'#94a3b8'});
    saveState();renderAll();
    return'✅ Sport event added: <b>'+escHtml(name)+'</b><br>📅 '+date+' at '+time+':00';
  } else {
    S.tasks.push({id:uid(),name,date,time,freq:'none',priority:guessPriority(raw),group:guessGroup(name),notes:'',done:false});
    saveState();renderAll();
    return'✅ Task added: <b>'+escHtml(name)+'</b><br>📅 '+(date===TODAY?'today':date)+' at '+time+':00';
  }
}

async function sendChat(){
  const inp=document.getElementById('chatIn');
  const text=(inp.value||'').trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  addChatMsg(text,'u');
  // Uses the SAME server-side parser as the Telegram bot, so a sentence
  // typed here behaves identically to one sent to the bot. The old local
  // parser understood far less, and the two could disagree.
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const d=await r.json();
    if(d.error){ addChatMsg('\u26a0\ufe0f '+escHtml(d.error),'b'); return; }
    addChatMsg(d.reply,'b');
    await loadFromServer(); renderAll();   // the command may have changed data
  }catch(e){
    // Offline or unreachable: fall back to the local parser so the chat
    // still does something rather than failing silently.
    addChatMsg(processChat(text),'b');
  }
}

// ─── GIVING TRACKER ──────────────────────────────────────
// Records what came in and what you gave, and works out the share due for
// each month. The running balance carries across months, so a month where
// you gave extra isn't forgotten the moment it ends.
let _tithe=null, _titheMonth=null;

function money(v, cur){
  const n=Math.abs(+v||0);
  return (v<0?'-':'')+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(cur||'');
}
function monthLabel(m){
  const [y,mo]=String(m).split('-').map(Number);
  return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function shiftTitheMonth(n){
  const [y,m]=_titheMonth.split('-').map(Number);
  const d=new Date(y, m-1+n, 1);
  _titheMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  loadTithe();
}
async function openTithe(){
  _titheMonth=_titheMonth||TODAY.slice(0,7);
  showModal('Giving',
    '<div id="titheBody" style="font-size:12px;color:var(--txt3)"><i class="ti ti-loader-2"></i> Loading\u2026</div>',
    '<button class="btn sm" onclick="titheSettings()"><i class="ti ti-settings"></i></button>'+
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Done</button>');
  loadTithe();
}
async function loadTithe(){
  try{
    _tithe=await (await fetch('/api/tithe?month='+encodeURIComponent(_titheMonth))).json();
    renderTithe();
  }catch(e){
    const el=document.getElementById('titheBody');
    if(el) el.innerHTML='<span style="color:var(--red)">Could not load.</span>';
  }
}
function renderTithe(){
  const el=document.getElementById('titheBody'); if(!el||!_tithe) return;
  const t=_tithe, cur=t.currency;
  const target = t.due + Math.max(0, -t.carry);     // this month's share plus anything owed from before
  const pct = target>0 ? Math.min(100, Math.round(t.given/target*100)) : (t.given>0?100:0);
  const owing = t.outstanding;
  const carry = t.carry;
  el.classList.add('tithe-dialog');
  const remaining = t.outstanding;
  const settled = Math.abs(remaining) < 0.005;
  const ahead = remaining < -0.005;
  // Headline shows what is LEFT, not what was due: seeing the full amount
  // after giving it in full read as though nothing had been paid.
  const headline = settled ? '0.00 '+cur : money(Math.abs(remaining), cur);
  el.innerHTML=
    '<div class="th-nav">'+
      '<button class="btn ghost ico sm" onclick="shiftTitheMonth(-1)"><i class="ti ti-chevron-left"></i></button>'+
      '<b>'+escHtml(monthLabel(t.month))+'</b>'+
      '<button class="btn ghost ico sm" onclick="shiftTitheMonth(1)"><i class="ti ti-chevron-right"></i></button>'+
    '</div>'+
    '<div class="th-head">'+
      '<div class="th-due'+(settled?' done':ahead?' ahead':'')+'">'+
        '<small>'+t.percent+'% of '+money(t.income,cur)+' = '+money(t.due,cur)+'</small>'+
        '<b>'+(settled?'\u2713':headline)+'</b>'+
        '<span>'+(settled?'all given \u2014 nothing left':(ahead?'given ahead':'left to give'))+'</span>'+
      '</div>'+
      '<div class="th-bar"><span style="width:'+pct+'%"></span></div>'+
      '<div class="th-line"><span>Due this month</span><b>'+money(t.due,cur)+'</b></div>'+
      '<div class="th-line"><span>Given</span><b>'+money(t.given,cur)+'</b></div>'+
      (Math.abs(carry)>0.005
        ? '<div class="th-line"><span>'+(carry>0?'Brought forward (ahead)':'Brought forward (owed)')+'</span><b>'+
          money(Math.abs(carry),cur)+'</b></div>'
        : '')+
      '<div class="th-line total'+(settled?'':(ahead?' ahead':' owe'))+'"><span>'+
        (settled?'Settled':(ahead?'Ahead by':'Still to give'))+'</span><b>'+
        (settled?'\u2713':money(Math.abs(remaining),cur))+'</b></div>'+
    '</div>'+
    '<div class="th-add">'+
      '<input id="thAmt" type="number" step="0.01" min="0" placeholder="Amount" inputmode="decimal">'+
      '<input id="thNote" placeholder="Note (optional)">'+
      '<input id="thDate" type="date" value="'+(_titheMonth===TODAY.slice(0,7)?TODAY:_titheMonth+'-01')+'">'+
    '</div>'+
    '<div class="th-btns">'+
      '<button class="btn sm" onclick="addTithe(\'income\')"><i class="ti ti-plus"></i> Income</button>'+
      '<button class="btn sm acc" onclick="addTithe(\'given\')"><i class="ti ti-heart"></i> Given</button>'+
    '</div>'+
    '<div id="thErr" style="font-size:11px;color:var(--red);margin-top:5px"></div>'+
    '<div class="th-list">'+
      (t.entries.length ? t.entries.map(e=>
        '<div class="th-row '+e.type+'">'+
          '<i class="ti '+(e.type==='income'?'ti-wallet':'ti-heart')+'"></i>'+
          '<span class="th-main"><b>'+money(e.amount,cur)+'</b>'+
            '<small>'+escHtml(e.date)+(e.note?' \u00b7 '+escHtml(e.note):'')+'</small></span>'+
          '<button class="btn ghost ico sm" onclick="delTithe(\''+e.id+'\')" aria-label="Delete"><i class="ti ti-x"></i></button>'+
        '</div>').join('')
        : '<div class="th-empty">Nothing recorded for this month yet.</div>')+
    '</div>';
}
async function addTithe(type){
  const amt=document.getElementById('thAmt').value;
  const note=document.getElementById('thNote').value;
  const date=document.getElementById('thDate').value;
  const err=document.getElementById('thErr');
  if(!(parseFloat(amt)>0)){ err.textContent='Enter an amount first.'; return; }
  try{
    const r=await (await fetch('/api/tithe/entry',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,amount:amt,note,date})})).json();
    if(r.error){ err.textContent=r.error; return; }
    // Follow the entry to its own month, or it would vanish from view.
    if(date && date.slice(0,7)!==_titheMonth) _titheMonth=date.slice(0,7);
    loadTithe();
  }catch(e){ err.textContent='Could not save.'; }
}
async function delTithe(id){
  try{ await fetch('/api/tithe/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadTithe(); }
  catch(e){}
}
function titheSettings(){
  const t=_tithe||{percent:10,currency:'RON'};
  showModal('Giving settings',
    '<div style="display:flex;gap:8px">'+
      '<div class="field" style="flex:1;margin:0"><label>Share to give</label><input id="thPct" type="number" min="0" max="100" step="0.5" value="'+t.percent+'"></div>'+
      '<div class="field" style="flex:1;margin:0"><label>Currency</label><input id="thCur" value="'+escHtml(t.currency)+'"></div>'+
    '</div>',
    '<button class="btn" onclick="openTithe()">Cancel</button><span class="msp"></span>'+
    '<button class="btn acc" onclick="saveTitheSettings()">Save</button>');
}
async function saveTitheSettings(){
  const percent=document.getElementById('thPct').value, currency=document.getElementById('thCur').value;
  try{ await fetch('/api/tithe/settings',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({percent,currency})}); }catch(e){}
  openTithe();
}

// ─── LIFE TIMER ──────────────────────────────────────────
// Two ways of looking at the same instant: everything since you were born
// counted up in each unit, and the current year measured from your last
// birthday. Ticks every second while the dialog is open.
let _timerInt=null, _timerView='totals';

function birthDate(){
  const b = S.birthday || '1985-02-26T05:00';
  const d = new Date(b);
  return isNaN(d) ? new Date('1985-02-26T05:00') : d;
}

// Calendar-accurate breakdown: whole months and days rather than averages,
// so "7 months" means seven actual months, not 30-day blocks.
function calendarDiff(from, to){
  let y = to.getFullYear()-from.getFullYear();
  let m = to.getMonth()-from.getMonth();
  let d = to.getDate()-from.getDate();
  let h = to.getHours()-from.getHours();
  let mi = to.getMinutes()-from.getMinutes();
  let s = to.getSeconds()-from.getSeconds();
  if(s<0){ s+=60; mi--; }
  if(mi<0){ mi+=60; h--; }
  if(h<0){ h+=24; d--; }
  if(d<0){ const prev=new Date(to.getFullYear(), to.getMonth(), 0).getDate(); d+=prev; m--; }
  if(m<0){ m+=12; y--; }
  return {y,m,d,h,mi,s};
}
function lastBirthday(now, b){
  const t=new Date(now.getFullYear(), b.getMonth(), b.getDate(), b.getHours(), b.getMinutes(), b.getSeconds());
  if(t>now) t.setFullYear(t.getFullYear()-1);
  return t;
}
function nextBirthday(now, b){
  const t=new Date(now.getFullYear(), b.getMonth(), b.getDate(), b.getHours(), b.getMinutes(), b.getSeconds());
  if(t<=now) t.setFullYear(t.getFullYear()+1);
  return t;
}
function nfmt(n){ return Number(n).toLocaleString(); }
function ordinal(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function openLifeTimer(){
  showModal('Life timer',
    '<div id="timerBody"></div>',
    '<button class="btn sm" onclick="editBirthday()"><i class="ti ti-cake"></i> Birth date</button>'+
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Done</button>');
  renderLifeTimer();
  clearInterval(_timerInt);
  _timerInt=setInterval(()=>{
    // Stop by itself once the dialog is gone.
    if(!document.getElementById('timerBody')){ clearInterval(_timerInt); _timerInt=null; return; }
    renderLifeTimer();
  }, 1000);
}

function renderLifeTimer(){
  const el=document.getElementById('timerBody'); if(!el) return;
  const b=birthDate(), now=new Date();
  if(now<b){ el.innerHTML='<div style="font-size:12px;color:var(--red)">That birth date is in the future.</div>'; return; }
  const ms=now-b;
  const tabs='<div class="tmr-tabs">'+
      '<button class="tmr-tab'+(_timerView==='totals'?' on':'')+'" onclick="setTimerView(\'totals\')">Lifetime totals</button>'+
      '<button class="tmr-tab'+(_timerView==='year'?' on':'')+'" onclick="setTimerView(\'year\')">This year</button>'+
    '</div>';
  let body;
  if(_timerView==='totals'){
    const full=calendarDiff(b, now);
    const totalMonths=full.y*12+full.m;
    // Size each figure by its length: "41" and "1,313,102,871" can't share
    // a font size inside a fixed-width cell without wrapping or spilling.
    const cell=(v,l)=>{
      const txt=nfmt(v);
      const cls = txt.length>11 ? ' xs' : txt.length>8 ? ' sm' : '';
      return '<div class="tmr-cell"><b class="'+cls.trim()+'">'+txt+'</b><small>'+l+'</small></div>';
    };
    body='<div class="tmr-grid">'+
        cell(full.y,'years')+
        cell(totalMonths,'months')+
        cell(Math.floor(ms/86400000),'days')+
        cell(Math.floor(ms/3600000),'hours')+
        cell(Math.floor(ms/60000),'minutes')+
        cell(Math.floor(ms/1000),'seconds')+
      '</div>'+
      '<div class="tmr-note">Each figure is the whole span so far, counted in that unit.</div>';
  } else {
    const since=calendarDiff(lastBirthday(now,b), now);
    const nb=nextBirthday(now,b), to=calendarDiff(now, nb);
    const yearsOld=calendarDiff(b, now).y;
    const yearMs=nb-lastBirthday(now,b), pct=Math.min(100,Math.max(0,Math.round((now-lastBirthday(now,b))/yearMs*100)));
    const cell=(v,l)=>'<div class="tmr-cell"><b>'+nfmt(v)+'</b><small>'+l+'</small></div>';
    body='<div class="tmr-age"><b>'+yearsOld+'</b><span>years old</span></div>'+
      '<div class="tmr-sub">Since your last birthday</div>'+
      '<div class="tmr-grid four">'+
        cell(since.m,'months')+ cell(since.d,'days')+ cell(since.h,'hours')+ cell(since.mi,'minutes')+
      '</div>'+
      '<div class="tmr-bar"><span style="width:'+pct+'%"></span></div>'+
      '<div class="tmr-note">'+pct+'% through your '+ordinal(yearsOld+1)+' year \u00b7 next birthday in <b>'+
        (to.m?to.m+' months ':'')+to.d+' days '+to.h+'h '+to.mi+'m</b></div>';
  }
  el.innerHTML=tabs+body+
    '<div class="tmr-born">Born '+b.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+
      ' at '+String(b.getHours()).padStart(2,'0')+':'+String(b.getMinutes()).padStart(2,'0')+'</div>';
}
function setTimerView(v){ _timerView=v; renderLifeTimer(); }

function editBirthday(){
  const b=birthDate();
  const d=b.getFullYear()+'-'+String(b.getMonth()+1).padStart(2,'0')+'-'+String(b.getDate()).padStart(2,'0');
  const t=String(b.getHours()).padStart(2,'0')+':'+String(b.getMinutes()).padStart(2,'0');
  clearInterval(_timerInt); _timerInt=null;
  showModal('Birth date',
    '<div style="display:flex;gap:8px">'+
      '<div class="field" style="flex:1;margin:0"><label>Date</label><input type="date" id="bdDate" value="'+d+'"></div>'+
      '<div class="field" style="flex:1;margin:0"><label>Time</label><input type="time" id="bdTime" value="'+t+'"></div>'+
    '</div>'+
    '<div style="font-size:10px;color:var(--txt3);margin-top:8px">The time matters for the hour and minute counters.</div>',
    '<button class="btn" onclick="openLifeTimer()">Cancel</button><span class="msp"></span>'+
    '<button class="btn acc" onclick="saveBirthday()">Save</button>');
}
function saveBirthday(){
  const d=document.getElementById('bdDate').value, t=document.getElementById('bdTime').value||'00:00';
  if(d){ S.birthday=d+'T'+t; saveState(); }
  openLifeTimer();
}

// ─── BIBLE READING PLAN ──────────────────────────────────
// A reading POSITION rather than a dated schedule: chapters are listed one
// by one, the next session is suggested from wherever you stopped, and
// finishing Revelation rolls straight back into Genesis.
let _bible=null;
async function openBiblePlan(){
  showModal('Bible reading plan',
    '<div id="bibBody" style="font-size:12px;color:var(--txt3)"><i class="ti ti-loader-2"></i> Loading\u2026</div>',
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Done</button>');
  try{ _bible=await (await fetch('/api/bible/plan')).json(); renderBiblePlan(); }
  catch(e){ const el=document.getElementById('bibBody'); if(el) el.innerHTML='<span style="color:var(--red)">Could not load the plan.</span>'; }
}

function renderBiblePlan(opts){
  const keepScroll = opts && opts.keepScroll;
  // Ticking a chapter shouldn't yank the list back to the suggestion —
  // you're usually reading somewhere else when you tick something off.
  const prevList = document.getElementById('bibList');
  const prevTop = prevList ? prevList.scrollTop : null;
  const el=document.getElementById('bibBody'); if(!el) return;
  if(!_bible || !_bible.active){ el.classList.remove('bib-dialog'); el.innerHTML=biblePlanSetupHtml(); return; }
  el.classList.add('bib-dialog');
  const d=_bible;
  const pct=Math.round(d.chaptersRead/d.totalChapters*100);
  const s=d.suggestion;
  el.innerHTML=
    '<div class="bib-next">'+
      '<div class="bib-next-lbl">Next session \u00b7 at least '+d.versesPerDay+' verses</div>'+
      '<div class="bib-next-ref">'+escHtml(s.label)+'</div>'+
      '<div class="bib-next-sub">'+s.count+' chapter'+(s.count===1?'':'s')+' \u00b7 '+s.verses+' verses'+(s.wraps?' \u00b7 finishes the Bible and starts again':'')+'</div>'+
      '<div class="bib-next-acts">'+
        '<button class="btn sm acc" onclick="finishBibleSession()"><i class="ti ti-check"></i> Mark session read</button>'+
        '<a class="btn sm" href="'+s.url+'" target="_blank" rel="noopener"><i class="ti ti-book"></i> Open in T4T</a>'+
      '</div>'+
    '</div>'+
    '<div class="bib-top">'+
      '<div class="bib-stat"><b>'+d.chaptersRead+'</b><small>of '+d.totalChapters+' chapters</small></div>'+
      '<div class="bib-stat"><b>'+pct+'%</b><small>through</small></div>'+
      '<div class="bib-stat"><b>'+d.cycle+'</b><small>time through</small></div>'+
    '</div>'+
    '<div class="bib-bar"><span style="width:'+pct+'%"></span></div>'+
    '<div class="bib-sub">'+d.versesRead.toLocaleString()+' of '+d.totalVerses.toLocaleString()+' verses read</div>'+
    '<div class="bib-list" id="bibList">'+d.chapters.map(bibleRow).join('')+'</div>'+
    '<div style="display:flex;gap:6px;margin-top:10px">'+
      '<button class="btn sm" onclick="jumpBibleHere()"><i class="ti ti-target"></i> Where I am</button>'+
      '<span class="msp"></span>'+
      '<button class="btn sm" onclick="renderBiblePlanSetup()"><i class="ti ti-settings"></i> Change</button>'+
    '</div>';
  if(keepScroll && prevTop != null){
    // Set it once now and again after layout — a fresh list has no height
    // yet, so the first assignment alone gets clamped.
    const restore=()=>{ const l=document.getElementById('bibList'); if(l) l.scrollTop=prevTop; };
    restore();
    requestAnimationFrame(()=>{ restore(); requestAnimationFrame(restore); });
  } else {
    jumpBibleHere(true);
  }
}

function bibleRow(x){
  const cls='bib-row'+(x.read?' done':'')+(x.inSuggestion?' next':'');
  return '<label class="'+cls+'" data-i="'+x.i+'">'+
    '<input type="checkbox"'+(x.read?' checked':'')+' onchange="markBibleChapter('+x.i+',this.checked)">'+
    '<span class="vbox"></span>'+
    '<span class="bib-main"><b>'+escHtml(x.label)+'</b><small>'+x.verses+' verses</small></span>'+
    '<a class="bib-read" href="'+x.url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Read in T4T"><i class="ti ti-external-link"></i></a>'+
  '</label>';
}

function jumpBibleHere(instant){
  const list=document.getElementById('bibList'); if(!list||!_bible) return;
  const row=list.querySelector('.bib-row.next') || list.querySelector('[data-i="'+_bible.pos+'"]');
  if(!row) return;
  // Put the suggested reading just below the top edge, with a couple of
  // finished chapters visible above it for context. offsetTop is relative
  // to the scrolling container, so no extra maths is needed.
  // Measure with rectangles rather than offsetTop: offsetTop is relative to
  // the nearest POSITIONED ancestor, which isn't this list, so it produced
  // a scroll position that was quietly wrong.
  const go=()=>{
    const delta = row.getBoundingClientRect().top - list.getBoundingClientRect().top;
    list.scrollTo({ top: Math.max(0, list.scrollTop + delta - 70), behavior: instant?'auto':'smooth' });
  };
  go();
  // Run again on the next frame: immediately after render the rows may not
  // have their final heights yet, which threw the position off.
  requestAnimationFrame(go);
}

async function markBibleChapter(i, read){
  try{
    const r=await (await fetch('/api/bible/read',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({index:i,read})})).json();
    if(r.error) return;
    // Update the existing rows rather than rebuilding the list. Replacing
    // the HTML and restoring scrollTop can't work reliably: the browser
    // clamps the value until the new rows have been laid out, so the list
    // jumped to a different place (Chrome did, Safari didn't).
    _bible=r; updateBiblePlanInPlace(r);
  }catch(e){}
}

function updateBiblePlanInPlace(d){
  const pct=Math.round(d.chaptersRead/d.totalChapters*100);
  const s=d.suggestion;
  const set=(sel,val)=>{ const el=document.querySelector(sel); if(el) el.innerHTML=val; };
  set('.bib-next-ref', escHtml(s.label));
  set('.bib-next-sub', s.count+' chapter'+(s.count===1?'':'s')+' \u00b7 '+s.verses+' verses'+(s.wraps?' \u00b7 finishes the Bible and starts again':''));
  const open=document.querySelector('.bib-next-acts a'); if(open) open.href=s.url;
  const stats=document.querySelectorAll('.bib-top .bib-stat b');
  if(stats.length>=3){ stats[0].textContent=d.chaptersRead; stats[1].textContent=pct+'%'; stats[2].textContent=d.cycle; }
  const bar=document.querySelector('.bib-bar span'); if(bar) bar.style.width=pct+'%';
  set('.bib-sub', d.versesRead.toLocaleString()+' of '+d.totalVerses.toLocaleString()+' verses read');
  const list=document.getElementById('bibList'); if(!list) return;
  const byI=new Map(d.chapters.map(c=>[c.i,c]));
  list.querySelectorAll('.bib-row').forEach(row=>{
    const c=byI.get(+row.dataset.i); if(!c) return;
    row.classList.toggle('done', c.read);
    row.classList.toggle('next', c.inSuggestion);
    const cb=row.querySelector('input'); if(cb) cb.checked=c.read;
  });
}

async function finishBibleSession(){
  try{
    const r=await (await fetch('/api/bible/session',{method:'POST'})).json();
    if(r.error) return;
    _bible=r; renderBiblePlan();
    showToast('\u2705 Session marked read \u2014 next up: <b>'+escHtml(r.suggestion.label)+'</b>');
  }catch(e){}
}

function biblePlanSetupHtml(){
  const v=(_bible&&_bible.versesPerDay)||(_bible&&_bible.defaultVerses)||50;
  return '<div style="font-size:12px;color:var(--txt2);margin-bottom:10px">Read at your own pace. The app suggests the next chapters that add up to at least your target, and picks up wherever you stopped \u2014 including rolling from Revelation back into Genesis.</div>'+
    '<div class="field"><label>Verses per session (at least)</label><input id="bibVerses" type="number" min="5" max="300" value="'+v+'"></div>'+
    '<div style="display:flex;gap:6px;margin-top:8px">'+
      '<button class="btn sm acc" onclick="createBiblePlan()"><i class="ti ti-check"></i> '+((_bible&&_bible.active)?'Save':'Start reading')+'</button>'+
      ((_bible&&_bible.active)
        ? '<button class="btn sm" onclick="renderBiblePlan()">Cancel</button><span class="msp"></span>'+
          '<button class="btn sm" onclick="restartBiblePlan()"><i class="ti ti-rotate"></i> Start over</button>'+
          '<button class="btn sm red" onclick="deleteBiblePlan()"><i class="ti ti-trash"></i></button>'
        : '')+
    '</div>';
}
function renderBiblePlanSetup(){ const el=document.getElementById('bibBody'); if(el) el.innerHTML=biblePlanSetupHtml(); }

async function createBiblePlan(reset){
  const versesPerDay=parseInt((document.getElementById('bibVerses')||{}).value)||50;
  const el=document.getElementById('bibBody');
  el.innerHTML='<i class="ti ti-loader-2"></i> Saving\u2026';
  try{
    _bible=await (await fetch('/api/bible/plan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({versesPerDay,reset:!!reset})})).json();
    renderBiblePlan();
  }catch(e){ el.innerHTML='<span style="color:var(--red)">Could not save the plan.</span>'; }
}
function restartBiblePlan(){ if(confirm('Start again from Genesis 1?')) createBiblePlan(true); }
async function deleteBiblePlan(){
  try{ await fetch('/api/bible/plan/remove',{method:'POST'}); _bible={active:false}; renderBiblePlan(); }catch(e){}
}

// A short list of sites you want one tap away. They open in a new window
// rather than an iframe: most sites refuse to be framed, and a real tab
// keeps their own login and layout intact.
const WIDGETS_DEFAULT=[
  {id:'w_bible',name:'Bible reading plan', desc:'Tick off what you\u2019ve read', action:'bible', icon:'ti-book'},
  {id:'w_timer',name:'Life timer', desc:'How long you\u2019ve been here, counting', action:'timer', icon:'ti-hourglass'},

  {id:'w_fx',name:'Currency', desc:'BNR exchange rates and converter', action:'fx', icon:'ti-arrows-exchange'},

  {id:'w_r2r',  name:'Rome2Rio',   desc:'Trains, buses, flights, driving', url:'https://www.rome2rio.com/', icon:'ti-route'},
  {id:'w_windy',name:'Windy',      desc:'Weather radar and forecast maps', url:'https://www.windy.com/',    icon:'ti-wind'},
  {id:'w_maps', name:'Google Maps',desc:'Maps and live traffic',           url:'https://maps.google.com/',  icon:'ti-map-2'}
];
function getWidgets(){
  const saved = Array.isArray(S.widgets) ? S.widgets : null;
  if(!saved) return WIDGETS_DEFAULT.slice();
  // Built-in entries (the ones that open a dialog rather than a website)
  // must appear even for someone who saved a custom list before they
  // existed — otherwise a new feature is invisible to exactly the people
  // who use the launcher most.
  const builtIns = WIDGETS_DEFAULT.filter(w => w.action);
  const missing = builtIns.filter(b => !saved.some(x => x.id === b.id || x.action === b.action));
  return missing.length ? [...missing, ...saved] : saved;
}
function toggleWidgets(e){
  if(e) e.stopPropagation();
  const d=document.getElementById('wdrop');
  const open=d.classList.contains('open');
  if(open) return closeWidgets();
  const list=getWidgets();
  const tools=list.filter(w=>w.action), links=list.filter(w=>!w.action);
  const tile=w=>{
    const c=WIDGET_TINT[w.action]||'#8CA8FF';
    return '<button class="wtile" role="menuitem" style="--wt:'+c+'" onclick="openWidget(\''+w.id+'\')">'+
      '<span class="wtile-ic"><i class="ti '+(w.icon||'ti-apps')+'"></i></span>'+
      '<b>'+escHtml(w.name)+'</b><small>'+escHtml(widgetPeek(w)||w.desc||'')+'</small></button>';
  };
  const link=w=>'<button class="wlink" role="menuitem" onclick="openWidget(\''+w.id+'\')">'+
      '<span class="wlink-ic"><i class="ti '+(w.icon||'ti-external-link')+'"></i></span>'+
      '<span class="wlink-t"><b>'+escHtml(w.name)+'</b>'+(w.desc?'<small>'+escHtml(w.desc)+'</small>':'')+'</span>'+
      '<i class="ti ti-arrow-up-right wgo"></i></button>';
  d.innerHTML =
    '<div class="wpanel-head"><b>Widgets</b><button class="btn sm ghost" onclick="manageWidgets()"><i class="ti ti-adjustments"></i> Manage</button></div>'+
    (tools.length ? '<div class="wgrid">'+tools.map(tile).join('')+'</div>' : '')+
    (links.length ? '<div class="wsec">Links</div><div class="wlinks">'+links.map(link).join('')+'</div>' : '')+
    (!list.length ? '<div class="wempty">No widgets yet.</div>' : '');
  // Anchor it under the toolbar button.
  const b=document.getElementById('widgetsBtn').getBoundingClientRect();
  d.style.top=Math.max(8, b.bottom+8)+'px';
  // On a phone the panel spans the screen (8px gutters); on wider screens it
  // hangs under the button, kept inside the window.
  if(window.innerWidth<=600){ d.style.left='8px'; d.style.right='8px'; }
  else { d.style.left='auto'; d.style.right=Math.max(8, Math.min(window.innerWidth-b.right, window.innerWidth-380))+'px'; }
  d.classList.add('open');
  document.getElementById('widgetsBtn').setAttribute('aria-expanded','true');
}
function closeWidgets(){
  const d=document.getElementById('wdrop');
  if(d) d.classList.remove('open');
  const b=document.getElementById('widgetsBtn');
  if(b) b.setAttribute('aria-expanded','false');
}
document.addEventListener('click', e=>{
  const d=document.getElementById('wdrop');
  if(d && d.classList.contains('open') && !d.contains(e.target)) closeWidgets();
});
window.addEventListener('keydown', e=>{ if(e.key==='Escape') closeWidgets(); });

const WIDGET_ACTIONS={ bible: ()=>openBiblePlan(), timer: ()=>openLifeTimer(), tithe: ()=>openTithe(), concerts: ()=>openConcerts(),
  clocks: ()=>openClocks(), holidays: ()=>openHolidays(), shopping: ()=>openShopping(), fx: ()=>openFx(), remote: ()=>openRemote(), worship: ()=>openWorship(), plugs: ()=>openPlugs(), notes: ()=>openNotes(), verse: ()=>openVerse() };
// Each built-in widget's accent, used for its tile in the launcher.
const WIDGET_TINT={ bible:'#a78bfa', timer:'#38bdf8', tithe:'#34d399', concerts:'#f472b6', clocks:'#fbbf24', holidays:'#fb7185', shopping:'#4ade80', fx:'#22d3ee', remote:'#f59e0b', worship:'#fbbf24', plugs:'#a3e635', notes:'#facc15', verse:'#E2C08D' };
function openWidget(id){
  const w=getWidgets().find(x=>x.id===id);
  closeWidgets();
  if(!w) return;
  // Some widgets are built in and open a dialog here rather than a new tab.
  if(w.action && WIDGET_ACTIONS[w.action]) return WIDGET_ACTIONS[w.action]();
  if(!w.url) return;
  // noopener keeps the new tab from being able to touch this page.
  window.open(w.url, '_blank', 'noopener,noreferrer');
}

function manageWidgets(){
  closeWidgets();
  const list=getWidgets();
  showModal('Widgets',
    '<div style="font-size:11px;color:var(--txt3);margin-bottom:10px">Sites you want one tap away. They open in a new window.</div>'+
    '<div id="wlist">'+ (list.length ? list.map((w,i)=>
      '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'+
        '<i class="ti '+(w.icon||'ti-external-link')+'" style="color:var(--accent)"></i>'+
        '<span style="flex:1;min-width:0"><b style="font-size:13px">'+escHtml(w.name)+'</b>'+
          '<div style="font-size:10px;color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(w.url)+'</div></span>'+
        '<button class="btn sm red" onclick="delWidget('+i+')" aria-label="Remove"><i class="ti ti-trash"></i></button>'+

function saveWidgets(list){ S.widgets=list; saveState(); }
function addWidget(){
  const name=(document.getElementById('wName').value||'').trim();

  if(!name||!url){ err.textContent='Give it a name and a web address.'; return; }

  try{ new URL(url); }catch(e){ err.textContent='That doesn\u2019t look like a valid web address.'; return; }

function delWidget(i){

// ─── TRAVEL / LEAVE BY ───────────────────────────────────
// When an event has a location the server works out the drive from home and

async function refreshBiblePlan(){
  const el=document.getElementById('biblePlanInfo'); if(!el) return;
  const st=document.getElementById('bibStart');
  if(st && !st.value){ const d=new Date(); d.setDate(d.getDate()+1); st.value=d.toISOString().slice(0,10); }
  try{
    const d=await (await fetch('/api/bible/plan')).json();
    el.innerHTML = d.active
      ? '\u2705 Plan active \u2014 <b>'+d.days+' days</b>, '+escHtml(d.start)+' to '+escHtml(d.end)+' at '+escHtml(d.time)+'. <b>'+d.remaining+'</b> still to read.'
      : 'No plan yet. At a minimum of 50 verses a day the whole Bible takes about 481 days.';
  }catch(e){ el.textContent='Could not check the plan.'; }
}
async function makeBiblePlan(){
  const el=document.getElementById('biblePlanInfo');
  const versesPerDay=parseInt(document.getElementById('bibVerses').value)||50;
  const start=document.getElementById('bibStart').value;
  const time=document.getElementById('bibTime').value||'06:00';

  try{
    const d=await (await fetch('/api/bible/plan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({versesPerDay,start,time,reminder:'15'})})).json();
    if(d.error){ el.innerHTML='<span style="color:var(--red)">'+escHtml(d.error)+'</span>'; return; }
    el.innerHTML='\u2705 Created <b>'+d.days+' days</b> ('+d.avgVerses+' verses a day), '+escHtml(d.start)+' to '+escHtml(d.end)+'.';
    await loadFromServer(); renderAll();
  }catch(e){ el.innerHTML='<span style="color:var(--red)">Could not create the plan.</span>'; }

async function removeBiblePlan(){

const TRAVEL_MODES={
  drive:{label:'Drive',emoji:'\ud83d\ude97',manual:false},
  taxi:{label:'Taxi',emoji:'\ud83d\ude95',manual:false},
  bike:{label:'Bike',emoji:'\ud83d\udeb2',manual:false},
  walk:{label:'Walk',emoji:'\ud83d\udeb6',manual:false},
  transit:{label:'Bus / train',emoji:'\ud83d\ude8c',manual:true},
  custom:{label:'Other',emoji:'\u23f1',manual:true}
};
function onModeChange(){
  const mode=(document.querySelector('#fmode input:checked')||{}).value||'drive';
  // Bus and train can't be routed automatically, so ask for the time.
  document.getElementById('fminsWrap').style.display = TRAVEL_MODES[mode].manual ? 'block' : 'none';
  previewTravel();
}

async function previewTravel(force){
  const inp=document.getElementById('floc'), out=document.getElementById('travelInfo');
  if(!inp||!out) return;
  const place=(inp.value||'').trim();
  const mode=(document.querySelector('#fmode input:checked')||{}).value||'drive';
  const cfg=TRAVEL_MODES[mode];
  const t=document.getElementById('ft');
  if(!place){ out.textContent=''; return; }
  // Manual modes need no lookup — you supplied the duration.
  if(cfg.manual){
    const mins=parseInt((document.getElementById('fmins')||{}).value);
    if(!mins){ out.innerHTML='<span style="color:var(--txt3)">Enter how long the journey takes and the leave-by time follows.</span>'; return; }
    const leave=t?leaveTimeFor(t.value,mins):null;
    out.innerHTML=cfg.emoji+' '+reminderLabelTxt(mins)+' by '+cfg.label.toLowerCase()+(leave?' \u2014 leave by <b>'+leave+'</b>':'')+mapBtnHtml();
    return;
  }
  out.innerHTML='<i class="ti ti-loader-2"></i> Checking the journey\u2026';
  try{
    const from=(document.getElementById('ffrom')||{}).value||'';
    const d=await (await fetch('/api/travel?to='+encodeURIComponent(place)+'&mode='+mode+
      (from.trim()?'&from='+encodeURIComponent(from.trim()):'')+(force?'&force=1':''))).json();
    if(d.error){ out.innerHTML='<span style="color:var(--red)">'+escHtml(d.error)+'</span>'; return; }
    const leave=t? leaveTimeFor(t.value, d.mins) : null;
    out.innerHTML=cfg.emoji+' '+reminderLabelTxt(d.mins)+' by '+cfg.label.toLowerCase()+(d.km?' \u00b7 '+d.km+' km':'')+
      (d.estimated?' <span style="color:var(--yellow)">(estimated \u2014 router unavailable)</span>':'')+
      (d.derived?' <span style="color:var(--txt3)">(from road distance)</span>':'')+
      (d.trafficPct?' <span style="color:var(--txt3)">incl. +'+d.trafficPct+'% traffic</span>':'')+
      (d.precise===false||d.fromPrecise===false?' <span style="color:var(--yellow)">(town centre \u2014 add a street for accuracy)</span>':'')+
      (d.fromName&&d.fromPlace?' <span style="color:var(--txt3)">from '+escHtml(d.fromName)+'</span>':'')+
      (leave?' \u2014 leave by <b>'+leave+'</b>':'')+mapBtnHtml();
  }catch(e){ out.innerHTML='<span style="color:var(--red)">Could not check travel time.</span>'; }
}
// A live one-liner under a launcher tile, where there's something worth
// seeing at a glance; otherwise the tile shows its description.
function widgetPeek(w){
  try{
    if(w.action==='clocks' && (S.worldClocks||[]).length){
      return S.worldClocks.slice(0,2).map(c=>c.name+' '+clockTime(c.tz)).join(' · ');
    }
    if(w.action==='holidays' && _holNext){ return _holNext; }
    if(w.action==='notes' && _nt.st && _nt.st.pinSet){ return '🔒 '+(_nt.st.count||0)+' note'+(_nt.st.count===1?'':'s'); }
    if(w.action==='plugs' && _pl && Array.isArray(_pl.plugs) && _pl.plugs.length){ const on=_pl.plugs.filter(p=>p.on); const W=on.reduce((a,p)=>a+(p.watts||0),0); return on.length ? on.length+' on'+(W?' · '+plFmtW(W):'') : 'All off'; }
    if(w.action==='remote' && _rm && !_rm.error){ return !_rm.paired ? 'Not set up' : (_rm.online ? (_rm.host||'Laptop')+' online' : 'Laptop offline'); }
    if(w.action==='fx' && _fx && _fx.rates){ const f=S.fxFrom||'EUR', t=S.fxTo||'RON'; const v=fxRate(f,t); if(v) return '1 '+f+' = '+fxFmt(v)+' '+t; }
    if(w.action==='shopping' && _shop && _shop.lists){
      const L=_shop.lists, n=L.reduce((a,l)=>a+(l.open||0),0), next=L.find(l=>l.trip);
      return n ? n+' to buy'+(L.length>1?' on '+L.length+' lists':'')+(next?' \u00b7 next '+shopWhen(next.trip):'') : 'Nothing to buy';
    }
  }catch(e){}
  return '';
}

// ─── SHOPPING LIST ───────────────────────────────────────
// Several lists can live side by side — e.g. "today · Lidl" and "tomorrow ·
// Kaufland" — each with its own calendar event. Type several things at once
// ("lapte, 2 kg roșii, ouă x10"); what you buy often comes back as one-tap
// suggestions.
let _shop = null, _shopEdit = null, _shopPlan = false;
function shopWhen(t){
  if(!t) return '';
  const d = t.date===TODAY ? 'today' : t.date===fmtD(new Date(parseD(TODAY).getTime()+86400000)) ? 'tomorrow'
    : parseD(t.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  return d+' '+fmtTime(t.time);
}
function shopTabLabel(l){
  if(!l.trip) return 'Not scheduled';
  const when = shopWhen(l.trip).replace(/^\w/, c=>c.toUpperCase());
  return when + (l.trip.location ? ' · '+l.trip.location.split(',')[0] : '');
}
async function shopFetch(listId){
  try{ _shop = await (await fetch('/api/shopping'+(listId?'?list='+encodeURIComponent(listId):''))).json(); }
  catch(e){ _shop = _shop || { lists:[], items:[], usual:[], error:'Couldn’t reach the server.' }; }
}
async function shopOp(body){
  body = { list: _shop && _shop.current, ...body };
  let v;
  try{
    const r = await fetch('/api/shopping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    v = await r.json();
  }catch(e){ v = null; }
  if(v && !v.error){
    const touchesCalendar = (_shop && _shop.lists||[]).some(l=>l.trip) || (v.lists||[]).some(l=>l.trip);
    _shop = v;
    if(touchesCalendar){ await loadFromServer(); renderAll(); }
  }
  shopRender(v && v.error ? v.error : (!v ? 'No answer from the server — check your connection.' : ''));
}
async function openShopping(listId){
  if(document.getElementById('mapOv')) closeRouteMap();
  _shopEdit = null; _shopPlan = false;
  showModal('Shopping list',
    '<div id="shTabs" class="sh-tabs"></div>'+
    '<div class="sh-add"><input id="shIn" class="cc-input" placeholder="Add items — e.g. lapte, 2 kg roșii, ouă x10" autocomplete="off" enterkeyhint="done" onkeydown="if(event.key===\'Enter\'){event.preventDefault();shopAddTyped()}">'+
      '<button class="btn acc" onclick="shopAddTyped()" aria-label="Add"><i class="ti ti-plus"></i></button></div>'+
    '<div id="shBody" class="sh-body"><div class="cc-empty"><i class="ti ti-loader-2"></i> Loading…</div></div>',
    '<button class="btn sm" onclick="shopShare()"><i class="ti ti-share"></i> Share</button><span class="msp"></span><button class="btn acc" onclick="closeModal()">Done</button>');
  await shopFetch(listId);
  shopRender();
  setTimeout(()=>{ const i=document.getElementById('shIn'); if(i && matchMedia('(pointer:fine)').matches) i.focus(); }, 80);
}
async function shopSwitch(id){
  _shopEdit = null; _shopPlan = false;
  await shopFetch(id); shopRender();
}
function shopAddTyped(){
  const i = document.getElementById('shIn'); if(!i) return;
  const t = i.value.trim(); if(!t) return;
  i.value = '';
  shopOp({ op:'add', text:t });
  if(matchMedia('(pointer:coarse)').matches) i.blur(); else i.focus();
}
function shopToggle(id){
  const it = _shop && _shop.items.find(x=>x.id===id); if(!it) return;
  it.done = !it.done; shopRender();              // instant, then confirm with the server
  shopOp({ op:'toggle', id });
}
function shopRenderTabs(){
  const el = document.getElementById('shTabs'); if(!el || !_shop) return;
  const lists = _shop.lists||[];
  el.innerHTML = lists.map(l=>'<button class="sh-tab'+(l.id===_shop.current?' on':'')+'" onclick="shopSwitch(\''+l.id+'\')">'+
      '<i class="ti '+(l.trip?'ti-calendar-event':'ti-list')+'"></i>'+escHtml(shopTabLabel(l))+(l.open?'<b>'+l.open+'</b>':'')+'</button>').join('')+
    '<button class="sh-tab sh-tab-new" onclick="_shopPlan=false;shopOp({op:\'newList\'})"><i class="ti ti-plus"></i>New list</button>';
  const on = el.querySelector('.sh-tab.on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'nearest'});
}
function shopRender(msg){
  shopRenderTabs();
  const el = document.getElementById('shBody'); if(!el || !_shop) return;
  const S2 = _shop, items = S2.items||[];
  const open = items.filter(i=>!i.done), cart = items.filter(i=>i.done);
  let h = msg ? '<div class="cc-msg" style="color:var(--yellow)">'+escHtml(msg)+'</div>' : '';
  if((S2.usual||[]).length){
    h += '<div class="sh-usual"><span class="sh-usual-l">Usual</span>'+S2.usual.map(u=>
      '<button class="sh-chip" onclick="shopOp({op:\'add\',text:'+escHtml(JSON.stringify(u.name))+'})"><i class="ti ti-plus"></i>'+escHtml(u.name)+'</button>').join('')+'</div>';
  }
  if(items.length){
    const pct = Math.round(cart.length/items.length*100);
    h += '<div class="sh-prog"><div class="sh-prog-t"><b>'+open.length+'</b> to buy'+(cart.length?' · '+cart.length+' in the cart':'')+'</div>'+
      '<div class="sh-bar"><span style="width:'+pct+'%"></span></div></div>';
  }
  h += shopTripHtml();
  if(!open.length){
    h += '<div class="sh-empty">'+(items.length ? '🎉 Everything’s in the cart.' : 'Nothing on this list yet. Type above — several at once, separated by commas.')+'</div>';
  }
  h += open.map(i=>shopRowHtml(i)).join('');
  if(cart.length){
    h += '<div class="sh-aisle sh-cart-h"><span>🛒</span>In the cart<small>'+cart.length+'</small>'+
      '<button class="btn sm ghost" onclick="shopOp({op:\'clearDone\'})">Clear</button></div>'+cart.map(i=>shopRowHtml(i)).join('');
  }
  if((S2.lists||[]).length > 1 || items.length || S2.trip){
    h += '<button class="sh-del" onclick="shopDeleteList()"><i class="ti ti-trash"></i> Delete this list'+(S2.trip?' and its calendar event':'')+'</button>';
  }
  el.innerHTML = h;
}
function shopDeleteList(){
  const el = document.querySelector('.sh-del'); if(!el) return;
  if(!el.dataset.sure){ el.dataset.sure='1'; el.innerHTML='<i class="ti ti-alert-triangle"></i> Tap again to delete'; el.classList.add('sure'); return; }
  _shopPlan = false; shopOp({ op:'deleteList' });
}
function shopRowHtml(i){
  const editing = _shopEdit === i.id;
  return '<div class="sh-row'+(i.done?' done':'')+(editing?' editing':'')+'">'+
    '<button class="sh-check" onclick="shopToggle(\''+i.id+'\')" aria-label="'+(i.done?'Not bought':'Bought')+': '+escHtml(i.name)+'" aria-pressed="'+(i.done?'true':'false')+'">'+
      '<span class="sh-box">'+(i.done?'<i class="ti ti-check"></i>':'')+'</span>'+
      '<span class="sh-name">'+escHtml(i.name)+'</span>'+(i.qty?'<span class="sh-qty">'+escHtml(i.qty)+'</span>':'')+
    '</button>'+
    '<button class="sh-more" onclick="_shopEdit=_shopEdit===\''+i.id+'\'?null:\''+i.id+'\';shopRender()" aria-label="Edit '+escHtml(i.name)+'"><i class="ti ti-dots"></i></button>'+
    (editing ? '<div class="sh-edit">'+
      '<input id="shQty" class="cc-input" value="'+escHtml(i.qty||'')+'" placeholder="Qty (2, 1 kg…)">'+
      '<div class="sh-edit-acts"><button class="btn sm red" onclick="_shopEdit=null;shopOp({op:\'remove\',id:\''+i.id+'\'})"><i class="ti ti-trash"></i> Remove</button>'+
      '<button class="btn sm acc" onclick="_shopEdit=null;shopOp({op:\'edit\',id:\''+i.id+'\',qty:document.getElementById(\'shQty\').value})">Save</button></div>'+
    '</div>' : '')+
  '</div>';
}
function shopTripHtml(){
  const t = _shop && _shop.trip;
  if(t && !_shopPlan){
    return '<div class="sh-trip on"><i class="ti ti-calendar-check"></i><div class="sh-trip-t"><b>Shopping trip '+escHtml(shopWhen(t))+'</b>'+
        (t.location?'<span class="sh-store"><i class="ti ti-map-pin"></i>'+escHtml(t.location)+'</span>':'')+
        '<small>In your calendar — it updates as the list changes</small></div>'+
      '<button class="btn sm" onclick="_shopPlan=true;shopRender()">Change</button>'+
      '<button class="btn sm ghost" onclick="closeModal();openOnDate(\''+t.date+'\',\''+t.id+'\')" aria-label="See in calendar"><i class="ti ti-calendar"></i></button></div>';
  }
  if(!_shopPlan){
    return (_shop.items||[]).some(i=>!i.done)
      ? '<button class="sh-trip" onclick="_shopPlan=true;shopRender()"><i class="ti ti-calendar-plus"></i><div class="sh-trip-t"><b>Plan a shopping trip</b><small>Put this list in your calendar</small></div><i class="ti ti-chevron-right"></i></button>'
      : '';
  }
  const tomorrow = fmtD(new Date(parseD(TODAY).getTime()+86400000));
  const cur = t ? t.date : TODAY;
  const pick = 'document.getElementById(\'shDate\').value=this.dataset.d;this.parentNode.querySelectorAll(\'.hol-yr\').forEach(b=>b.classList.remove(\'on\'));this.classList.add(\'on\')';
  return '<div class="sh-plan"><div class="sh-plan-days">'+
      '<button class="hol-yr'+(cur===TODAY?' on':'')+'" data-d="'+TODAY+'" onclick="'+pick+'">Today</button>'+
      '<button class="hol-yr'+(cur===tomorrow?' on':'')+'" data-d="'+tomorrow+'" onclick="'+pick+'">Tomorrow</button>'+
      '<input type="date" id="shDate" value="'+cur+'" onchange="this.parentNode.querySelectorAll(\'.hol-yr\').forEach(b=>b.classList.remove(\'on\'))">'+
    '</div>'+
    '<div class="sh-plan-row"><input type="time" id="shTime" value="'+(t?fmtTime(t.time):'18:00')+'" step="300">'+
      '<input id="shWhere" class="cc-input" value="'+escHtml(t&&t.location||'')+'" placeholder="Store (optional) — e.g. Lidl Lugoj" autocomplete="off"></div>'+
    '<div class="sh-plan-acts">'+(t?'<button class="btn sm red" onclick="_shopPlan=false;shopOp({op:\'unplan\'})">Remove trip</button>':'')+
      '<span class="msp"></span><button class="btn sm" onclick="_shopPlan=false;shopRender()">Cancel</button>'+
      '<button class="btn sm acc" onclick="shopPlanSave()"><i class="ti ti-calendar-plus"></i> '+(t?'Save':'Add to calendar')+'</button></div></div>';
}
function shopPlanSave(){
  const date = (document.getElementById('shDate')||{}).value, time = (document.getElementById('shTime')||{}).value;
  const where = ((document.getElementById('shWhere')||{}).value||'').trim();
  _shopPlan = false;
  // The store is always sent, so it's kept on every save (and cleared if emptied).
  shopOp({ op:'plan', date, time, location: where });
}
async function shopShare(){
  if(!_shop) return;
  const open = (_shop.items||[]).filter(i=>!i.done);
  if(!open.length) return shopRender('Nothing left to buy — nothing to share.');
  const t = _shop.trip;
  const txt = '🛒 Shopping list'+(t?' — '+shopWhen(t)+(t.location?', '+t.location:''):'')+'\n' + open.map(i=>'• '+i.name+(i.qty?' ('+i.qty+')':'')).join('\n');
  try{
    if(navigator.share){ await navigator.share({ title:'Shopping list', text:txt }); return; }
    await navigator.clipboard.writeText(txt); shopRender('✅ Copied — paste it in WhatsApp or a message.');
  }catch(e){ if(e && e.name !== 'AbortError') shopRender('Couldn’t share from this browser.'); }
}

// ─── CURRENCY ────────────────────────────────────────────
// Converter at the official BNR reference rate of the day (free feed, no key).
// Any pair works: both currencies are converted through RON, which is how
// BNR quotes them. A 10-day line shows where the pair has been heading.
let _fx = null;
const FX_PAIRS = [['EUR','RON'],['USD','RON'],['GBP','RON'],['CHF','RON'],['CAD','RON'],['EUR','USD'],['HUF','RON']];
function fxRate(from, to, rates){ rates = rates || (_fx && _fx.rates); if(!rates || !rates[from] || !rates[to]) return null; return rates[from]/rates[to]; }
function fxFmt(v){
  if(v==null || !isFinite(v)) return '–';
  const a=Math.abs(v), d = a>=1000?2 : a>=10?3 : a>=1?4 : a>=0.01?5 : 6;
  return v.toLocaleString('en-GB',{minimumFractionDigits:Math.min(d,4), maximumFractionDigits:d});
}
function fxName(c){ try{ return new Intl.DisplayNames(['en'],{type:'currency'}).of(c); }catch(e){ return c; } }
// Windows has no flag emoji (it shows two letters, e.g. "EU"), so skip them there.
const FX_SHOW_FLAGS = !/Windows/i.test(navigator.userAgent);
const FX_POPULAR = ['RON','EUR','USD','GBP','CHF','HUF','CAD'];
const FX_FLAG = c => c==='EUR' ? '🇪🇺' : c==='XAU' ? '🥇' : c==='XDR' ? '🌐' : CC_FLAG(c.slice(0,2));
async function openFx(){
  showModal('Currency',
    '<div id="fxBody" class="fx-body"><div class="cc-empty"><i class="ti ti-loader-2"></i> Loading BNR rates…</div></div>',
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Done</button>');
  try{ const d = await (await fetch('/api/fx')).json(); _fx = d; }catch(e){ _fx = { error:'Couldn’t reach the server.' }; }
  fxRender(true);
}
function fxSel(id, cur){

    (()=>{ const opt=c=>'<option value="'+c+'"'+(c===cur?' selected':'')+'>'+(FX_SHOW_FLAGS?FX_FLAG(c)+' ':'')+c+' \u2013 '+escHtml(fxName(c))+'</option>';
      const top=FX_POPULAR.filter(c=>codes.includes(c)), rest=codes.filter(c=>!top.includes(c));
      return '<optgroup label="Most used">'+top.map(opt).join('')+'</optgroup><optgroup label="All currencies">'+rest.map(opt).join('')+'</optgroup>'; })()+'</select>'+

function fxRender(full){

        (_fx.stale?' (couldn’t refresh — last known rates)':'')+'. '+(_fx.source==='ECB'?'ECB publishes on working days around 16:00':'BNR publishes on banking days around 13:00')+'; banks and exchange offices add their own margin.</div>';

// 10-day line for the pair: one series, so the heading names it; tap or hover
// a day to read its value.
function fxTrend(from, to){
  const el = document.getElementById('fxTrend'); if(!el) return;
  const pts = (_fx.history||[]).map(h=>({ date:h.date, v:fxRate(from,to,h.rates) })).filter(p=>p.v);
  if(pts.length < 2){ el.innerHTML=''; return; }
  const last = pts[pts.length-1], prev = pts[pts.length-2];
  const ch = (last.v/prev.v-1)*100, up = ch>0.0005, down = ch<-0.0005;
  const W=320, H=84, P=6;
  const vs = pts.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||hi*0.001||1;
  const x = i => P + i*(W-2*P)/(pts.length-1), y = v => P + (H-2*P)*(1-(v-lo)/span);
  const d = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area = d+' L'+x(pts.length-1).toFixed(1)+' '+(H-P)+' L'+x(0).toFixed(1)+' '+(H-P)+' Z';
  const day = ds => new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  el.innerHTML =
    '<div class="fx-trend-h"><span>'+from+' → '+to+', last '+pts.length+' '+(_fx.source||'BNR')+' days</span>'+
      '<span class="fx-ch '+(up?'up':down?'down':'')+'">'+(up?'▲':down?'▼':'●')+' '+Math.abs(ch).toFixed(2)+'% since '+day(prev.date)+'</span></div>'+
    '<div class="fx-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+from+' to '+to+' over the last '+pts.length+' BNR days, from '+fxFmt(pts[0].v)+' to '+fxFmt(last.v)+'">'+
      '<path d="'+area+'" fill="rgba(34,211,238,.10)"/>'+
      '<path d="'+d+'" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
      '<circle cx="'+x(pts.length-1).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="4" fill="#22d3ee" stroke="var(--bg1)" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      '<g id="fxHov"></g>'+
      pts.map((p,i)=>'<rect x="'+(x(i)-(W-2*P)/(pts.length-1)/2).toFixed(1)+'" y="0" width="'+((W-2*P)/(pts.length-1)).toFixed(1)+'" height="'+H+'" fill="transparent" data-i="'+i+'"/>').join('')+
    '</svg><div id="fxTip" class="fx-tip" hidden></div></div>'+
    '<div class="fx-axis"><span>'+day(pts[0].date)+'</span><span>low '+fxFmt(lo)+' · high '+fxFmt(hi)+'</span><span>'+day(last.date)+'</span></div>';
  const svg = el.querySelector('svg'), tip = el.querySelector('#fxTip'), hov = el.querySelector('#fxHov');
  const show = i => {
    const p = pts[i]; if(!p) return;
    hov.innerHTML = '<line x1="'+x(i)+'" x2="'+x(i)+'" y1="0" y2="'+H+'" stroke="rgba(255,255,255,.25)" stroke-width="1" vector-effect="non-scaling-stroke"/>'+
      '<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="4" fill="#22d3ee" stroke="var(--bg1)" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    tip.hidden = false; tip.innerHTML = '<b>'+fxFmt(p.v)+'</b> '+to+'<span>'+day(p.date)+'</span>';
    tip.style.left = Math.min(Math.max(x(i)/W*100, 12), 88)+'%';
  };
  const hide = () => { hov.innerHTML=''; tip.hidden = true; };
  svg.addEventListener('pointermove', e=>{ const r=e.target.closest('rect'); if(r) show(+r.dataset.i); });
  svg.addEventListener('pointerdown', e=>{ const r=e.target.closest('rect'); if(r) show(+r.dataset.i); });
  svg.addEventListener('pointerleave', hide);
}
function fxChanged(){
  const a = (document.getElementById('fxAmt')||{}).value||'';

  S.fxAmount = isFinite(n) && n>0 ? n : 1;
  S.fxFrom = (document.getElementById('fxFrom')||{}).value || S.fxFrom;
  S.fxTo = (document.getElementById('fxTo')||{}).value || S.fxTo;

function fxSwap(){

}
function fxSet(f, t){ S.fxFrom = f; S.fxTo = t; S.fxAmount = S.fxAmount||1; saveState(); fxRender(true); }

async function rmLoad(){

function rmAgo(iso){
  if(!iso) return '';
  const s=Math.round((Date.now()-new Date(iso))/1000);
  if(s<60) return 'just now';
  const m=Math.round(s/60); if(m<60) return m+' min ago';
  const h=Math.round(m/60); return h<24 ? h+' h ago' : new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

function rmRender(){
  const el=document.getElementById('rmBody'); if(!el||!_rm) return;

async function rmSend(cmd){
  if(_rmBusy) return;
  _rmBusy=cmd; _rmMsg=''; rmRender();
  const before = _rm.last ? _rm.last.at : null;
  try{
    const r=await fetch('/api/remote/cmd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});
    const d=await r.json(); if(d.error) throw new Error(d.error);
  }catch(e){ _rmBusy=null; _rmMsg='<span style="color:var(--red)">'+escHtml(e.message)+'</span>'; rmRender(); return; }
  // Wait for the laptop to report back (it usually takes a second or two).
  const t0=Date.now();
  while(Date.now()-t0 < 20000){
    await new Promise(r=>setTimeout(r,900));
    try{ _rm=await (await fetch('/api/remote/status')).json(); }catch(e){}
    if(_rm.last && _rm.last.at!==before && !_rm.pending) break;
  }
  _rmBusy=null;
  if(!(_rm.last && _rm.last.at!==before)) _rmMsg='<i class="ti ti-clock"></i> The laptop hasn’t answered yet — it may be asleep. It will be skipped if not picked up within a minute.';
  rmRender();
}
async function rmNeedUnlock(){

  m.innerHTML='<div class="rm-unlock"><input id="rmPw" type="password" class="cc-input" placeholder="Private-settings password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')rmDownload()"><button class="btn acc sm" onclick="rmDownload()">Unlock</button></div>';
  setTimeout(()=>{ const i=document.getElementById('rmPw'); if(i) i.focus(); },50);

}
async function rmDownload(){
  const m=document.getElementById('rmSetupMsg');
  const pwEl=document.getElementById('rmPw');
  if(pwEl && pwEl.value){
    const d=await privPost('/api/private/unlock',{password:pwEl.value});
    if(d.error){ if(m) m.innerHTML='<span style="color:var(--red)">'+escHtml(d.error)+'</span>'; return; }
    setPrivTok(d.token);
  }
  if(/iPhone|iPad|Android/i.test(navigator.userAgent) && m && !m.dataset.warned){
    m.dataset.warned='1';
    m.innerHTML='<i class="ti ti-info-circle"></i> The helper must be opened <b>on the laptop</b>. Tap Download helper again to get it here anyway.';
    return;
  }
  let pr=await privPost('/api/remote/pair',{});
  if(pr.locked || (pr.error && /locked/i.test(pr.error))) return rmNeedUnlock();
  if(pr.error){ if(m) m.innerHTML='<span style="color:var(--red)">'+escHtml(pr.error)+'</span>'; return; }
  try{
    const r=await fetch('/api/remote/helper?origin='+encodeURIComponent(location.origin));
    if(r.status===401) return rmNeedUnlock();
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||('HTTP '+r.status)); }
    const blob=await r.blob();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Organizer-Screen-Remote.cmd';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    if(m) m.innerHTML='<i class="ti ti-check" style="color:var(--green)"></i> Downloaded. Open <b>Organizer-Screen-Remote.cmd</b> from your Downloads.';
    await rmLoad();
    const m2=document.getElementById('rmSetupMsg'); if(m2) m2.innerHTML='<i class="ti ti-check" style="color:var(--green)"></i> Downloaded. Open <b>Organizer-Screen-Remote.cmd</b> from your Downloads.';
  }catch(e){ if(m) m.innerHTML='<span style="color:var(--red)">'+escHtml(e.message)+'</span>'; }
}
async function rmUnpair(){
  const d=await privPost('/api/remote/unpair',{});
  if(d.locked || (d.error && /locked/i.test(d.error))) return rmNeedUnlock();
  if(d.error){ const m=document.getElementById('rmSetupMsg'); if(m) m.innerHTML='<span style="color:var(--red)">'+escHtml(d.error)+'</span>'; return; }

// ─── TOUCHPAD & KEYBOARD (screen remote) ────────────────
// A full-screen pad. One finger moves the pointer, a tap clicks, two
// fingers scroll, a two-finger tap right-clicks, press-and-hold drags.
// Input goes over a live connection (WebSocket) through the server to the
// laptop helper. The phone is trusted once with the private password and
// then keeps its own token in this browser.
const RM_TOK_KEY='org:rmPhoneTok', RM_SENS_KEY='org:rmSens';
let _pad=null;
function rmTok(){ try{ return localStorage.getItem(RM_TOK_KEY)||''; }catch(e){ return ''; } }
function rmSetTok(t){ try{ if(t) localStorage.setItem(RM_TOK_KEY,t); else localStorage.removeItem(RM_TOK_KEY); }catch(e){} }
function rmSens(){ try{ const v=+localStorage.getItem(RM_SENS_KEY); return v>=1&&v<=5?v:3; }catch(e){ return 3; } }
const RM_KEYS=[['esc','Esc'],['tab','Tab'],['left','←'],['up','↑'],['down','↓'],['right','→'],['back','⌫'],['enter','Enter'],
  ['win','<i class="ti ti-brand-windows"></i>'],['alttab','Alt+Tab'],['f11','Full'],['play','<i class="ti ti-player-play"></i>'],['voldn','<i class="ti ti-volume-2"></i>−'],['volup','<i class="ti ti-volume"></i>+'],['mute','<i class="ti ti-volume-off"></i>']];
function rmPadOpen(){
  closeModal();

      '<button class="pad-ic" id="padSensBtn" onclick="rmSensCycle()" aria-label="Pointer speed"><i class="ti ti-gauge"></i><b id="padSens">'+rmSens()+'</b></button>'+
      '<button class="pad-ic" onclick="rmKbToggle()" aria-label="Keyboard"><i class="ti ti-keyboard"></i></button>'+
    '</div>'+
    '<div class="pad-keys" id="padKeys">'+RM_KEYS.map(k=>'<button onclick="rmKey(\''+k[0]+'\')">'+k[1]+'</button>').join('')+'</div>'+
    '<div class="pad-main">'+
      '<div class="pad-area" id="padArea"><div class="pad-hint" id="padHint">Move with one finger · tap to click<br>Two fingers: scroll · two-finger tap: right-click<br>Press and hold to drag</div></div>'+
      '<div class="pad-scroll" id="padScroll" aria-label="Scroll"><i class="ti ti-chevron-up"></i><i class="ti ti-arrows-vertical"></i><i class="ti ti-chevron-down"></i></div>'+
    '</div>'+
    '<div class="pad-btns"><button id="padL">Left</button><button id="padR">Right</button></div>'+
    '<div class="pad-lock" id="padLock" hidden></div>'+
    '<input id="padKb" class="pad-kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Type on the laptop">';
  document.body.appendChild(o);
  lockPageScroll();
  _pad={ ws:null, ax:0, ay:0, sx:0, sy:0, raf:0, alive:true, retry:0, laptop:false };

function rmPadClose(){
  if(!_pad) return;
  _pad.alive=false;
  try{ if(_pad.drag) rmPadSend('u l'); }catch(e){}
  try{ _pad.ws && _pad.ws.close(); }catch(e){}
  clearInterval(_pad.ping); clearTimeout(_pad.retryT); cancelAnimationFrame(_pad.raf);
  const o=document.getElementById('rmPad'); if(o) o.remove();
  _pad=null;
  unlockPageScroll();
}
function rmPadStatus(kind, text){
  const el=document.getElementById('padSt'); if(!el) return;
  el.className='pad-st '+kind;
  el.innerHTML='<span class="rm-dot"></span><span>'+text+'</span>';
}
function rmPadConnect(){
  if(!_pad || !_pad.alive) return;
  const tok=rmTok();
  if(!tok){ rmPadAskTrust(); return; }
  rmPadStatus('', 'Connecting…');
  let ws;
  try{ ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/remote/phone'); }
  catch(e){ rmPadStatus('off','Can’t connect'); return; }
  _pad.ws=ws;
  ws.onopen=()=>{ ws.send('auth '+tok); _pad.retry=0; };
  ws.onmessage=e=>{
    if(e.data==='laptop on'){ _pad.laptop=true; rmPadStatus('on', escHtml((_rm&&_rm.host)||'Laptop')+' connected'); }
    else if(e.data==='laptop off'){ _pad.laptop=false; rmPadStatus('off','Laptop offline — is it on?'); }
  };
  ws.onclose=e=>{
    if(!_pad || !_pad.alive) return;
    if(e.code===4401){ rmSetTok(''); rmPadAskTrust('This phone needs to be trusted again.'); return; }
    rmPadStatus('off','Reconnecting…');
    _pad.retryT=setTimeout(rmPadConnect, Math.min(8000, 800*(++_pad.retry)));
  };
  clearInterval(_pad.ping);
  _pad.ping=setInterval(()=>{ try{ if(ws.readyState===1) ws.send('ping'); }catch(e){} }, 20000);
}
function rmPadAskTrust(msg){
  const L=document.getElementById('padLock'); if(!L) return;
  rmPadStatus('off','Locked');
  L.hidden=false;
  L.innerHTML='<div class="pad-lock-box"><i class="ti ti-lock"></i><b>Trust this phone</b>'+

  setTimeout(()=>{ const i=document.getElementById('padPw'); if(i) i.focus(); },60);

// Pointer moves are added up and sent once per screen frame, so a fast
// swipe is a handful of messages rather than hundreds.
function rmFlush(){
  if(!_pad) return;
  _pad.raf=0;
  const mx=Math.trunc(_pad.ax), my=Math.trunc(_pad.ay);
  if(mx||my){ _pad.ax-=mx; _pad.ay-=my; rmPadSend('m '+Math.max(-9999,Math.min(9999,mx))+' '+Math.max(-9999,Math.min(9999,my))); }
  const sy=Math.trunc(_pad.sy), sx=Math.trunc(_pad.sx);
  if(sy||sx){ _pad.sy-=sy; _pad.sx-=sx; rmPadSend('s '+Math.max(-99999,Math.min(99999,sy))+' '+Math.max(-99999,Math.min(99999,sx))); }
}
function rmQueue(){ if(_pad && !_pad.raf) _pad.raf=requestAnimationFrame(rmFlush); }
function rmPadWire(){
  const A=document.getElementById('padArea'), SC=document.getElementById('padScroll'), hint=document.getElementById('padHint');
  let t0=0, n=0, maxN=0, moved=0, lx=0, ly=0, lt=0, hold=null;
  const pt=(e)=>{ let x=0,y=0; const T=e.touches; for(let i=0;i<T.length;i++){ x+=T[i].clientX; y+=T[i].clientY; } return [x/T.length, y/T.length]; };
  A.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(hint) hint.style.opacity='0';
    n=e.touches.length; maxN=Math.max(maxN,n);
    if(e.touches.length===e.changedTouches.length){ t0=performance.now(); moved=0; maxN=n; }
    [lx,ly]=pt(e); lt=performance.now();
    clearTimeout(hold);
    if(n===1 && !_pad.drag){
      hold=setTimeout(()=>{ if(moved<10 && _pad){ _pad.drag=true; rmPadSend('d l'); A.classList.add('dragging'); if(navigator.vibrate) navigator.vibrate(20); } }, 480);
    }
  }, {passive:false});
  A.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(!_pad) return;
    if(e.touches.length!==n){ n=e.touches.length; [lx,ly]=pt(e); lt=performance.now(); return; }
    const [x,y]=pt(e), now=performance.now();
    const dx=x-lx, dy=y-ly, dt=Math.max(1,now-lt);
    lx=x; ly=y; lt=now;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>10) clearTimeout(hold);
    if(n>=2){
      // Natural scrolling, like a laptop touchpad.
      _pad.sy+=dy*6; _pad.sx+=-dx*6;
    } else {
      // Faster finger = further pointer, so small moves stay precise.
      const v=Math.hypot(dx,dy)/dt;
      const g=(0.6+rmSens()*0.45)*(1+Math.min(v,2.5)*0.9);
      _pad.ax+=dx*g; _pad.ay+=dy*g;
    }
    rmQueue();
  }, {passive:false});
  const end=e=>{
    e.preventDefault();
    clearTimeout(hold);
    if(!_pad) return;
    if(e.touches.length>0){ n=e.touches.length; [lx,ly]=pt(e); lt=performance.now(); return; }
    const dur=performance.now()-t0;
    if(_pad.drag){ _pad.drag=false; rmPadSend('u l'); A.classList.remove('dragging'); }
    else if(dur<260 && moved<12){
      rmPadSend(maxN>=2 ? 'c r' : 'c l');
      A.classList.add('tap'); setTimeout(()=>A.classList.remove('tap'),120);
    }
    n=0; maxN=0;
  };
  A.addEventListener('touchend', end, {passive:false});
  A.addEventListener('touchcancel', end, {passive:false});
  // Mouse fallback so it also works from a laptop or tablet with a mouse.
  let md=false;
  A.addEventListener('mousedown', e=>{ md=true; moved=0; lx=e.clientX; ly=e.clientY; t0=performance.now(); });
  A.addEventListener('mousemove', e=>{ if(!md) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy); _pad.ax+=dx*1.5; _pad.ay+=dy*1.5; rmQueue(); });
  window.addEventListener('mouseup', ()=>{ if(md && moved<6 && performance.now()-t0<300) rmPadSend('c l'); md=false; });
  // One-finger scroll strip on the right edge.
  let sly=0;
  SC.addEventListener('touchstart', e=>{ e.preventDefault(); sly=e.touches[0].clientY; SC.classList.add('on'); }, {passive:false});
  SC.addEventListener('touchmove', e=>{ e.preventDefault(); const y=e.touches[0].clientY; _pad.sy+=(y-sly)*8; sly=y; rmQueue(); }, {passive:false});
  SC.addEventListener('touchend', ()=>SC.classList.remove('on'));
  // Buttons: Left supports hold-to-drag too.
  const L=document.getElementById('padL'), R=document.getElementById('padR');
  const press=(el,down,up)=>{
    el.addEventListener('touchstart', e=>{ e.preventDefault(); el.classList.add('on'); rmPadSend(down); if(navigator.vibrate) navigator.vibrate(8); }, {passive:false});
    el.addEventListener('touchend', e=>{ e.preventDefault(); el.classList.remove('on'); if(up) rmPadSend(up); }, {passive:false});
    el.addEventListener('click', ()=>{ if(!('ontouchstart' in window)){ rmPadSend(down); if(up) rmPadSend(up); } });
  };
  press(L,'d l','u l');
  press(R,'c r',null);
  // Keyboard: keep two spaces in the hidden box so Backspace always has
  // something to delete, and forward every keystroke instead of typing here.
  const K=document.getElementById('padKb');
  const keep=()=>{ K.value='  '; try{ K.setSelectionRange(2,2); }catch(e){} };
  K.addEventListener('beforeinput', e=>{
    const t=e.inputType;
    if(t==='insertText' || t==='insertReplacementText' || t==='insertFromPaste'){ const d=e.data || (e.dataTransfer && e.dataTransfer.getData('text')) || ''; if(d) rmPadSend('t '+d.slice(0,200)); }
    else if(t==='deleteContentBackward' || t==='deleteWordBackward'){ rmPadSend('k back'); }
    else if(t==='insertLineBreak' || t==='insertParagraph'){ rmPadSend('k enter'); }
    e.preventDefault(); keep();
  });
  K.addEventListener('input', keep);
  K.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); rmPadSend('k enter'); }
    else if(e.key==='Tab'){ e.preventDefault(); rmPadSend('k tab'); }
    else if(e.key==='Escape'){ e.preventDefault(); rmPadSend('k esc'); }
    else if(e.key.startsWith('Arrow')){ e.preventDefault(); rmPadSend('k '+e.key.slice(5).toLowerCase()); }
  });
  K.addEventListener('focus', ()=>{ document.getElementById('rmPad').classList.add('kb'); keep(); });
  K.addEventListener('blur', ()=>{ const o=document.getElementById('rmPad'); if(o) o.classList.remove('kb'); });
}
