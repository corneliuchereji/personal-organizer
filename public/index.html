.pl-add summary{cursor:pointer;font-size:13px;font-weight:650;list-style:none;padding:6px 0}
.pl-add summary::-webkit-details-marker{display:none}
.pl-add summary i{color:#a3e635}
.pl-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pl-form select,.pl-row select{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:13px}
.pl-form input{width:80px;font-variant-numeric:tabular-nums}
.pl-days{display:flex;gap:4px;flex-basis:100%}
.pl-days button{flex:1;padding:6px 0;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--txt2);font-family:inherit;font-size:12px;cursor:pointer}

.nt-sep{flex:none;width:1px;height:22px;background:var(--border);margin:0 2px}
.nt-tools button.on{background:rgba(250,204,21,.2);border-color:rgba(250,204,21,.55);color:#fde68a}
.nt-title::placeholder,.nt-body::placeholder{color:rgba(219,226,245,.4)}
.nt-tools{display:flex;gap:6px;align-items:center;flex:none;padding-top:8px;overflow-x:auto;scrollbar-width:none}

<script>
// ─── CONSTANTS ───────────────────────────────────────────
const TODAY = (()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')})();
const PAL = ['#4f8ef7','#34d399','#f97316','#e879a0','#fbbf24','#a78bfa','#60a5fa','#f87171','#94a3b8','#2dd4bf'];
const FREQS = ['none','daily','weekly','monthly','yearly'];
const PRIS = ['low','normal','high','very'];
const ALLH = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const WXI = {sunny:'ti-sun',partly_cloudy:'ti-sun',cloudy:'ti-cloud',rainy:'ti-cloud-rain',snow:'ti-cloud-snow',storm:'ti-cloud-storm',fog:'ti-cloud-fog',windy:'ti-wind'};
// One weather picture for every place (header, days, hours, event cards).
// "Partly sunny" has no single icon in the font, so it's a sun with a cloud
// in front; at night the sun becomes the moon. ink:true = for the ivory cards.
function wxIconHtml(cond, night, ink){
  const cloudC = ink ? '#64748b' : '#cbd5e1';
  if(cond==='partly_cloudy') return '<span class="wxi2"><i class="ti '+(night?'ti-moon-filled':'ti-sun-filled')+' a" style="color:'+(night?'#c4b5fd':'#fbbf24')+'"></i><i class="ti ti-cloud-filled b" style="color:'+cloudC+'"></i></span>';
  if(cond==='sunny' && night) return '<i class="ti ti-moon" style="color:#c4b5fd"></i>';
  const c = ink ? ({sunny:'#d97706',cloudy:'#64748b',rainy:'#2563eb',snow:'#0284c7',storm:'#6d28d9',fog:'#64748b',windy:'#059669'})[cond] : WXC[cond];
  return '<i class="ti '+(WXI[cond]||'ti-cloud')+'" style="color:'+(c||'#94a3b8')+'"></i>';
}
const WXC = {sunny:'#fbbf24',partly_cloudy:'#60a5fa',cloudy:'#94a3b8',rainy:'#60a5fa',snow:'#bae6fd',storm:'#818cf8',fog:'#94a3b8',windy:'#34d399'};
const BTC_HOLD=0.00359, BTC_RON=1800, USD_RON=4.65;
const SPORT_COLORS = {f1:'#e879a0',motogp:'#f97316',tdf:'#fbbf24',giro:'#f87171',ucl:'#4f8ef7',seriea:'#34d399',bundesliga:'#fb923c',snooker:'#a78bfa',n24h:'#2dd4bf',wec:'#60a5fa',cycling:'#fbbf24',football:'#4f8ef7',soccer:'#4f8ef7',romania:'#f87171'};
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ─── STATE ───────────────────────────────────────────────
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

const DFLT = {
  weekOffset:0, dayOffset:0, ftKey:'', tgToken:'', tgChatId:'', tgMorningHour:'08',
  wxLat:45.689, wxLon:21.903, wxLocName:'Lugoj, RO',
  apiFootballKey:'', footballDataKey:'', highlightlyKey:'', tsdbKey:'123', follows:{teams:[],competitions:[]},
  wx:null, // filled in by loadWeather() on boot — null shows a loading state, never fake data
  tasks:[], sportEvents:[],
  groups:[
    {id:'g_pers',name:'Personal',color:'#a78bfa'},
    {id:'g_home',name:'Home',color:'#4f8ef7'},
    {id:'g_car',name:'Car',color:'#94a3b8'},
    {id:'g_work',name:'Work',color:'#34d399'},
    {id:'g_sport',name:'Sport',color:'#f97316'},
  ]
};

// ── SERVER-BACKED STATE ──────────────────────────────────
let S = {...DFLT}; // will be overwritten from server on boot
let _saveTimer = null;

function saveState(){
  // Debounce saves — wait 500ms after last change
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    const payload = {
        // Revision we last loaded — lets the server detect that this tab is
        // stale and merge rather than overwrite newer data from elsewhere.
        _rev: S._rev,
        tasks: S.tasks,
        // Auto-synced fixtures are managed exclusively by the server's
        // follow-sync job — never echo them back or we can clobber a
        // fresher sync with a stale client copy. Only manual entries save.
        sportEvents: (S.sportEvents||[]).filter(e=>e.source!=='auto'),
        groups: S.groups,
        settings:{
          tgMorningHour: S.tgMorningHour||'08',
          tgMorningMin: S.tgMorningMin||'00',
          wxLat: S.wxLat, wxLon: S.wxLon, wxLocName: S.wxLocName,
          leaveBy: S.leaveBy!==false, leaveBuffer: S.leaveBuffer!=null?S.leaveBuffer:10,
          trafficPct: S.trafficPct!=null?S.trafficPct:20,
          worldClocks: Array.isArray(S.worldClocks)?S.worldClocks:[], holCountry: S.holCountry||'RO',
          fxFrom: S.fxFrom||'EUR', fxTo: S.fxTo||'RON', fxAmount: S.fxAmount||1,
          wsOpts: S.wsOpts||null, holGroup: S.holGroup||'',
          birthday: S.birthday||'',
          widgets: Array.isArray(S.widgets)?S.widgets:null
        }
    };
    // Mirror the change into the on-device copy straight away, so reopening
    // the app while offline shows it.
    const cache = lsGet(LS_CACHE) || {};
    cache.tasks = S.tasks; cache.sportEvents = S.sportEvents; cache.groups = S.groups;
    cache.settings = { ...(cache.settings||{}), ...payload.settings };
    cache.follows = S.follows;
    lsSet(LS_CACHE, cache);
    // Queue first, send second: if the request never makes it, the edit is
    // already safe and will be replayed on reconnect.
    lsSet(LS_PENDING, payload);
    fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(d=>{
        if(d && d._rev){ S._rev = d._rev; }
        // Only clear the queue if nothing newer was queued meanwhile.
        const cur = lsGet(LS_PENDING);
        if(cur && JSON.stringify(cur)===JSON.stringify(payload)) lsDel(LS_PENDING);
        setOnlineState(true);
      })
      .catch(()=> setOnlineState(false));
  },500);
}

// ─── OFFLINE SUPPORT ─────────────────────────────────────
// The last good copy of the data lives on the device, so the app opens and
// works with no connection. Edits made offline are queued and replayed when
// the connection returns; the server merges them by revision, so a queued
// edit can't overwrite newer changes made on another device meanwhile.
const LS_CACHE='org:cache', LS_PENDING='org:pending';
let _online = navigator.onLine !== false;
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function setOnlineState(on){
  _online = on;
  const pill = document.getElementById('netPill');
  if(!pill) return;
  const pending = !!lsGet(LS_PENDING);
  if(on && !pending){ pill.style.display='none'; return; }
  pill.style.display='inline-flex';
  pill.className = 'net-pill ' + (on ? 'syncing' : 'offline');
  pill.innerHTML = on
    ? '<i class="ti ti-refresh"></i> Syncing changes\u2026'
    : '<i class="ti ti-wifi-off"></i> Offline \u2014 changes saved on this device';
}

async function flushPending(){
  const pending = lsGet(LS_PENDING);
  if(!pending) return true;
  try{
    const r = await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(d && d._rev) S._rev = d._rev;
    lsDel(LS_PENDING);
    return true;
  }catch(e){ return false; }
}

// When the connection returns: push queued edits, then pull fresh data.
window.addEventListener('online', async ()=>{
  setOnlineState(true);
  const ok = await flushPending();
  if(ok){ await loadFromServer(); renderAll(); try{ loadWeather(); }catch(e){} }
  setOnlineState(ok);
});
window.addEventListener('offline', ()=> setOnlineState(false));

async function loadFromServer(){
  // Keep whatever month/day the user is looking at — a background refresh
  // shouldn't yank the view back to today.
  const keepWeek = (typeof S!=='undefined' && S) ? S.weekOffset||0 : 0;
  const keepDay  = (typeof S!=='undefined' && S) ? S.dayOffset||0  : 0;
  try{
    let d;
    try{
      // Anything queued offline goes up first, so we don't immediately
      // reload over the top of unsent edits.
      await flushPending();
      const r = await fetch('/api/data',{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      d = await r.json();
      lsSet(LS_CACHE, d);
      setOnlineState(true);
    }catch(netErr){
      d = lsGet(LS_CACHE);
      if(!d) throw netErr;          // no connection and nothing cached yet
      setOnlineState(false);
    }
    S = {
      ...DFLT,
      tasks: d.tasks||[],
      sportEvents: d.sportEvents||[],
      groups: d.groups&&d.groups.length ? d.groups : DFLT.groups,
      tgToken: d.settings?.tgToken||'',
      tgChatId: d.settings?.tgChatId||'',
      tgMorningHour: d.settings?.tgMorningHour||'08',
      tgMorningMin: d.settings?.tgMorningMin||'00',
      wxLat: d.settings?.wxLat ?? DFLT.wxLat,
      wxLon: d.settings?.wxLon ?? DFLT.wxLon,
      wxLocName: d.settings?.wxLocName || DFLT.wxLocName,
      apiFootballKey: d.settings?.apiFootballKey||'',
      footballDataKey: d.settings?.footballDataKey||'',
      highlightlyKey: d.settings?.highlightlyKey||'',
      tsdbKey: d.settings?.tsdbKey||'123',

// Notes may contain a link (the reading plan puts the T4T passage URL
// there); turn it into something tappable rather than raw text.
function linkifyNotes(s){
  return escHtml(s).replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function getGroup(id){return S.groups.find(g=>g.id===id)||{name:'?',color:'#888'}}
function parseD(s){return new Date(s+'T00:00:00')}
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtShort(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function fmtTime(t){if(!t)return'00:00';const p=String(t);return p.includes(':')?p:p.padStart(2,'0')+':00'}
function fmtLong(d){return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function sportColor(sp,ev){return(ev&&ev.color)||SPORT_COLORS[sp]||'#94a3b8'}
function currentDay(){const d=parseD(TODAY);d.setDate(d.getDate()+S.dayOffset);return d}

function matchesDate(ev,ds){
  if(!ev.date)return false;
  const freq=ev.freq||'none';
  if(freq==='none')return ev.date===ds;
  const base=parseD(ev.date),tgt=parseD(ds);
  if(tgt<base)return false;
  if(freq==='daily')return true;
  if(freq==='weekly')return base.getDay()===tgt.getDay();
  if(freq==='monthly')return base.getDate()===tgt.getDate();
  if(freq==='yearly')return base.getMonth()===tgt.getMonth()&&base.getDate()===tgt.getDate();
  return false;
}

// Converts "HH:MM" (or "H") to minutes-since-midnight for correct chronological sorting.
function timeToMinutes(t){
  if(!t) return 0;
  const s=fmtTime(t); // normalizes to "HH:MM"
  const [h,m]=s.split(':').map(Number);
  return (h||0)*60+(m||0);
}

// Groups same-day sport fixtures: a fixture involving a followed TEAM always
// gets its own slot with real team names (e.g. "Borussia Dortmund vs X").
// Everything else that only belongs to a followed COMPETITION is shown
// generically as the competition (badge + name), never spelling out team
// names for matches you didn't specifically follow — even when there's
// only one such fixture that day, per user preference. Multiple at once
// (e.g. a full Champions League group-stage night) collapse into a single
// tappable "(N matches)" slot.
function collapseSportEvents(sportEvs){
  const followedTeamIds = new Set((S.follows&&S.follows.teams||[]).map(t=>String(t.providerId)));
  const isTeamMatch = e => e.followType==='team' || (e.home && e.away && (followedTeamIds.has(String(e.home.id)) || followedTeamIds.has(String(e.away.id))));
  sportEvs = dedupeByMatchIdentity(sportEvs, isTeamMatch); // same cross-provider duplicate problem as the agenda view
  const teamSlots = sportEvs.filter(isTeamMatch).map(e=>({...e,_display:'single'}));
  const rest = sportEvs.filter(e=>!isTeamMatch(e));
  // Manually-added events (no competitionId, not auto-synced) always show
  // as themselves — only auto-synced "competition only" fixtures collapse.
  const manual = rest.filter(e=>e.source!=='auto');
  const autoRest = rest.filter(e=>e.source==='auto');
  const groups = {};
  autoRest.forEach(e=>{
    const key = e.competitionId || ('single_'+e.id);
    (groups[key] = groups[key]||[]).push(e);
  });
  const restSlots = Object.values(groups).map(g=>{
    const sorted=[...g].sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
    // Always the generic competition-badge display, even for a single fixture.
    return {
      _type:'sport', _display:'collapsed', id:'collapsed_'+(sorted[0].competitionId||sorted[0].id)+'_'+sorted[0].date,
      time: sorted[0].time, name: sorted[0].competitionName || 'Competition',
      competitionLogo: sorted[0].competitionLogo, sport: sorted[0].sport,
      count: sorted.length, fixtures: sorted, color: sorted[0].color
    };
  });
  return [...teamSlots, ...manual.map(e=>({...e,_display:'single'})), ...restSlots];
}

function eventsOnDay(ds){
  const tasks = viewTasks(S.tasks.map(t=>({...t,_type:'task',_occDate:ds,done:isDoneOn(t,ds)})).filter(ev=>matchesDate(ev,ds)));
  const sportsRaw = viewSports((S.sportEvents||[]).map(e=>({...e,_type:'sport',_color:e.color||SPORT_COLORS[e.sport]||'#94a3b8'})).filter(ev=>matchesDate(ev,ds)));
  const sports = collapseSportEvents(sportsRaw);
  return [...tasks, ...sports].sort((a,b)=>{
    const dt=timeToMinutes(a.time)-timeToMinutes(b.time);
    if(dt!==0) return dt;
    // Same time: tasks (personal items) come before sport fixtures.
    if(a._type!==b._type) return a._type==='task'?-1:1;
    return 0; // same type & time: keep original order
  });
}

// Fine-grained grouping for the day-agenda view specifically: a fresh
// "Competition name" header appears at every distinct kickoff time that
// competition has fixtures at, with same-time same-competition matches
// bundled directly beneath it — rather than one header covering the whole
// day. E.g. Premier League can appear three separate times in one day if
// it has matches at 13:45, 17:00, and 22:00. Team-follow and manual
// fixtures stay standalone (unchanged from the coarse grouping).
function collapseSportEventsFine(sportEvs){
  const followedTeamIds = new Set((S.follows&&S.follows.teams||[]).map(t=>String(t.providerId)));
  const isTeamMatch = e => e.followType==='team' || (e.home && e.away && (followedTeamIds.has(String(e.home.id)) || followedTeamIds.has(String(e.away.id))));

  // The SAME real match can be stored twice under different provider IDs —
  // e.g. AC Milan vs Venezia arrives once via the AC Milan team follow
  // (Highlightly) and again via the Serie A competition follow
  // (football-data.org). Those IDs never collide, so dedupe on match
  // identity instead: same kickoff time + same two teams. Keep the
  // team-follow copy so it renders as the highlighted card.
  const deduped = dedupeByMatchIdentity(sportEvs, isTeamMatch);

  const standalone = deduped.filter(e=>isTeamMatch(e) || e.source!=='auto').map(e=>({...e,_display:'single'}));
  const groupable = deduped.filter(e=>!isTeamMatch(e) && e.source==='auto');
  const cells = {};
  groupable.forEach(e=>{
    const key = e.time+'|'+(e.competitionId||e.id);
    (cells[key] = cells[key]||[]).push(e);
  });
  const cellSlots = Object.values(cells).map(g=>{
    const sorted=[...g].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    return {
      _type:'sport', _display:'cell',
      id:'cell_'+sorted[0].time+'_'+(sorted[0].competitionId||sorted[0].id)+'_'+sorted[0].date,
      time: sorted[0].time, name: sorted[0].competitionName || 'Competition',
      competitionLogo: sorted[0].competitionLogo, sport: sorted[0].sport,
      count: sorted.length, fixtures: sorted, color: sorted[0].color
    };
  });
  return [...standalone, ...cellSlots];
}

// Removes cross-provider duplicates of the same real match (same date,
// kickoff and teams), preferring the followed-team copy so it renders as
// the highlighted card rather than folded into a competition group.
function dedupeByMatchIdentity(sportEvs, isTeamMatch){
  const identityKey = e => {
    if(!e.home || !e.away) return null;
    const names = [normTeamName(e.home.name), normTeamName(e.away.name)].sort().join('|');
    return e.date+'|'+fmtTime(e.time)+'|'+names;
  };
  const byIdentity = new Map();
  const noIdentity = [];
  sportEvs.forEach(e=>{
    const k = identityKey(e);
    if(!k){ noIdentity.push(e); return; }
    const existing = byIdentity.get(k);
    if(!existing){ byIdentity.set(k,e); return; }
    if(!isTeamMatch(existing) && isTeamMatch(e)) byIdentity.set(k,e);
  });
  let result = [...byIdentity.values(), ...noIdentity];

  // Second pass for naming variants strict normalisation can't reconcile
  // ("Bayern München" vs "Bayern Munich", differing word order). Same
  // date+kickoff AND a strong fuzzy resemblance on BOTH sides is required,
  // so distinct fixtures (e.g. AC Milan vs Inter Milan) never merge.
  const out = [];
  result.forEach(e=>{
    if(!e.home || !e.away){ out.push(e); return; }
    const dupIdx = out.findIndex(o=>o.home && o.away &&
      o.date===e.date && fmtTime(o.time)===fmtTime(e.time) &&
      teamsResemble(o, e));
    if(dupIdx === -1){ out.push(e); return; }
    // Keep whichever is the followed-team copy.
    if(!isTeamMatch(out[dupIdx]) && isTeamMatch(e)) out[dupIdx] = e;
  });
  return out;
}
// True when two fixtures look like the same match: both teams resemble
// each other (either orientation), using a conservative prefix/containment
// test on normalised names.
function teamsResemble(a, b){
  const like = (x,y)=>{
    const nx=normTeamName(x), ny=normTeamName(y);
    if(!nx || !ny) return false;
    if(nx===ny) return true;
    if(nx.length>=5 && ny.length>=5 && (nx.startsWith(ny.slice(0,5)) || ny.startsWith(nx.slice(0,5)))) return true;
    return nx.includes(ny) || ny.includes(nx);
  };
  const sameOrder = like(a.home.name,b.home.name) && like(a.away.name,b.away.name);
  const swapped   = like(a.home.name,b.away.name) && like(a.away.name,b.home.name);
  return sameOrder || swapped;
}

// Team names differ slightly between providers ("Venezia" vs "Venezia FC",
// "FC Bayern München" vs "Bayern Munich"), so normalise before comparing:
// lowercase, strip accents, drop common club-type suffixes/prefixes.
function normTeamName(n){
  if(!n) return '';
  return String(n)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/\b(fc|cf|afc|sc|ac|as|ss|ssc|us|bsc|vfb|vfl|tsg|sv|fk|cd|ud|rc|club|calcio|futbol|football)\b/g,'')
    .replace(/[^a-z0-9]/g,'')
    .trim();
}

function agendaEventsOnDay(ds){
  // _occDate records WHICH occurrence this copy represents. A repeating
  // task appears on many days, so completion has to be tracked per date
  // rather than with one shared flag.
  const tasks = viewTasks(S.tasks.map(t=>({...t,_type:'task',_occDate:ds,done:isDoneOn(t,ds)})).filter(ev=>matchesDate(ev,ds)));
  const sportsRaw = viewSports((S.sportEvents||[]).map(e=>({...e,_type:'sport',_color:e.color||SPORT_COLORS[e.sport]||'#94a3b8'})).filter(ev=>matchesDate(ev,ds)));
  const sports = collapseSportEventsFine(sportsRaw);
  return [...tasks, ...sports].sort((a,b)=>{
    const dt=timeToMinutes(a.time)-timeToMinutes(b.time);
    if(dt!==0) return dt;
    if(a._type!==b._type) return a._type==='task'?-1:1;
    // Same time, both sport: alphabetical by competition/event name.
    if(a._type==='sport' && b._type==='sport') return (a.name||'').localeCompare(b.name||'');
    return 0;
  });
}

function closeModal(){

  if(typeof _timerInt!=='undefined' && _timerInt){ clearInterval(_timerInt); _timerInt=null; }document.getElementById('modal').classList.remove('open');unlockPageScroll();if(_fxRefreshTimer){clearInterval(_fxRefreshTimer);_fxRefreshTimer=null;}if(typeof _rmPoll!=='undefined'&&_rmPoll){clearInterval(_rmPoll);_rmPoll=null;}if(typeof _plTimer!=='undefined'&&_plTimer){clearInterval(_plTimer);_plTimer=null;}}
// While a dialog is open the page behind it is frozen in place. On iPhone a
// swipe that started on the dim backdrop scrolled the calendar underneath,
// and the dialog's own list then wouldn't scroll.
let _lockEl=null, _lockTop=0;
function lockPageScroll(){
  if(_lockEl) return;
  // On phones the page scrolls inside <body>; on wider screens it's the window.
  const b=document.body, cs=getComputedStyle(b);
  _lockEl = (/(auto|scroll)/.test(cs.overflowY) && b.scrollHeight>b.clientHeight) ? b : document.documentElement;
  _lockTop=_lockEl.scrollTop;
  _lockEl.style.overflow='hidden';
}
function unlockPageScroll(){
  if(!_lockEl) return;
  const el=_lockEl; _lockEl=null;
  el.style.overflow='';
  el.scrollTop=_lockTop;
}
function showModal(title,body,acts){

// Close on backdrop click only — and only when the click BEGAN on the
// backdrop. Without the mousedown check, selecting text inside the dialog

let _mouseDownOnBackdrop = false;
document.getElementById('modal').addEventListener('mousedown',function(e){ _mouseDownOnBackdrop = (e.target===this); });
document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this && _mouseDownOnBackdrop) closeModal(); });
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// ─── WEATHER ─────────────────────────────────────────────
// Which "sky" the weather panel shows. Night overrides conditions, since
// a sunny forecast at 23:00 shouldn't glow like midday.
function skyFor(wx){
  const h = new Date().getHours();
  if(h < 6 || h >= 20) return 'night';
  if(!wx) return 'cloud';
  const c = String(wx.cond||'');
  if(/storm|thunder/.test(c)) return 'storm';
  if(/rain|drizzle|shower/.test(c)) return 'rain';
  if(/snow|sleet/.test(c)) return 'snow';
  if(/fog|mist|haze/.test(c)) return 'fog';
  if(/sun|clear|partly/.test(c)) return 'sun';
  return 'cloud';
}
function renderWx(){
  const wx=S.wx;

  if(wxEl) wxEl.dataset.sky = skyFor(wx);
  const ic=document.getElementById('wxi');

  const windyLink=document.getElementById('wxWindyLink');
  if(windyLink) windyLink.href='https://www.windy.com/'+S.wxLat+'/'+S.wxLon+'?'+S.wxLat+','+S.wxLon+',10';

  if(!wx){
    // Loading or failed state — never show fake numbers
    const ico0=document.getElementById('wxIco');
    if(ico0) ico0.innerHTML='<i id="wxi" class="ti '+(S._wxError?'ti-cloud-off':'ti-loader-2')+'" style="color:#94a3b8"></i>';
    document.getElementById('wxT').textContent='—';
    document.getElementById('wxMM').textContent='';
    document.getElementById('wxC').textContent=S._wxError?'Unavailable':'Loading…';
    document.getElementById('wxDays').innerHTML='';

  }

  if(ico) ico.innerHTML=wxIconHtml(wx.cond, wx.now && wx.now.isDay===false);
  document.getElementById('wxT').textContent=wx.tempC+'°C';
  document.getElementById('wxMM').textContent='↑ '+wx.high+'° · ↓ '+wx.low+'°';
  document.getElementById('wxC').textContent=wx.text;
  if(_wxDay>=wx.forecast.length) _wxDay=0;
  document.getElementById('wxDays').innerHTML=wx.forecast.map((d,i)=>
    '<div class="wx-day'+(i===_wxDay?' on':'')+'" role="button" tabindex="0" onclick="wxPickDay('+i+')" aria-label="'+escHtml(d.dow)+': show hour by hour">'+
    '<div class="wx-day-n">'+d.dow+'</div>'+

    (d.rain>0?'<div class="wx-day-r">💧'+d.rain+'%</div>':'')+

// ── Forecast details: tiles + hour by hour ──
// Today shows "now" (feels like, wind, humidity, UV) and the next 24 hours;
// tapping another day shows that day's figures and its hours.
let _wxDay=0;
function wxPickDay(i){ _wxDay=i; renderWx(); const h=document.getElementById('wxHours'); if(h) h.scrollLeft=0; }
function uvLabel(u){ if(u==null) return ''; return u<3?'Low':u<6?'Moderate':u<8?'High':u<11?'Very high':'Extreme'; }
function wxIsNight(t, day){ const hm=String(t).slice(11,16); return !!(day && day.sunrise && day.sunset && (hm<day.sunrise.slice(0,3)+'00' || hm>=day.sunset)); }
function wxRenderDetail(){
  const wx=S.wx, st=document.getElementById('wxStats'), hh=document.getElementById('wxHours'), hd=document.getElementById('wxHoursH');
  if(!st||!hh||!hd) return;
  if(!wx || !Array.isArray(wx.hourly) || !wx.forecast){ st.innerHTML=''; hh.innerHTML=''; hd.innerHTML=''; return; }
  const day=wx.forecast[_wxDay]||wx.forecast[0];
  const tile=(ic,label,val,sub)=>'<div class="wx-stat"><i class="ti '+ic+'"></i><span>'+label+'</span><b>'+val+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>';
  const n=wx.now||{};
  const tiles=[];
  if(_wxDay===0){
    if(n.feels!=null) tiles.push(tile('ti-temperature','Feels like',n.feels+'°'));
    if(n.wind!=null) tiles.push(tile('ti-wind','Wind',n.wind+' km/h',n.gust?'gusts '+n.gust:''));
    if(n.humidity!=null) tiles.push(tile('ti-droplet','Humidity',n.humidity+'%'));
    const uv = n.uv!=null ? n.uv : day.uv;
    if(uv!=null) tiles.push(tile('ti-sun-high','UV now',Math.round(uv),uvLabel(uv)+(day.uv!=null?' · max '+Math.round(day.uv):'')));
  } else {
    tiles.push(tile('ti-umbrella','Rain chance',day.rain+'%'));
    if(day.wind!=null) tiles.push(tile('ti-wind','Wind',day.wind+' km/h',day.gust?'gusts '+day.gust:''));
    if(day.uv!=null) tiles.push(tile('ti-sun-high','UV max',Math.round(day.uv),uvLabel(day.uv)));
  }
  if(day.sunrise) tiles.push(tile('ti-sunrise','Sunrise',day.sunrise));
  if(day.sunset) tiles.push(tile('ti-sunset','Sunset',day.sunset));
  st.innerHTML=tiles.join('');
  const nowKey=(n.time||'').slice(0,13);
  let list;
  if(_wxDay===0){ let i=wx.hourly.findIndex(h=>h.t.slice(0,13)>=nowKey); if(i<0) i=0; list=wx.hourly.slice(i,i+24); }
  else list=wx.hourly.filter(h=>h.t.slice(0,10)===day.date);
  const dayOf=t=>wx.forecast.find(f=>f.date===String(t).slice(0,10));
  hd.innerHTML='<i class="ti ti-clock-hour-4"></i> '+(_wxDay===0?'Next 24 hours':escHtml(parseD(day.date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))+' · hour by hour');
  hh.innerHTML=list.map((h,k)=>{
    const lab=(_wxDay===0&&k===0)?'Now':h.t.slice(11,16);
    const newDay=_wxDay===0 && k>0 && h.t.slice(11,13)==='00';
    return (newDay?'<div class="wx-hsep">'+escHtml(parseD(h.t.slice(0,10)).toLocaleDateString('en-GB',{weekday:'short'}))+'</div>':'')+
      '<div class="wx-hour'+(k===0&&_wxDay===0?' now':'')+'"><span>'+lab+'</span>'+(k===0&&_wxDay===0?wxIconHtml(wx.cond, n.isDay===false):wxIconHtml(h.cond, wxIsNight(h.t, dayOf(h.t))))+'<b>'+((k===0&&_wxDay===0&&wx.tempC!=null)?wx.tempC:h.temp)+'°</b>'+
      '<small'+(h.rain>=10?'':' class="dry"')+'>💧'+h.rain+'%</small></div>';
  }).join('');
}
// ── Weather on event cards ──

const WXC_INK = {sunny:'#d97706',partly_cloudy:'#2563eb',cloudy:'#64748b',rainy:'#2563eb',snow:'#0284c7',storm:'#6d28d9',fog:'#64748b',windy:'#059669'};
const WMO_TEXT={sunny:'Clear',partly_cloudy:'Partly cloudy',cloudy:'Cloudy',rainy:'Rain',snow:'Snow',storm:'Thunderstorm',fog:'Fog',windy:'Windy'};

// Fetches real weather from our backend (which calls Open-Meteo).
// Pass {q:'Timisoara'} to look up a place name, or nothing to use S.wxLat/wxLon.
async function loadWeather(opts){
  opts=opts||{};
  try{
    S._wxError=false;
    renderWx(); // show loading state immediately
    const params=new URLSearchParams();
    if(opts.q) params.set('q',opts.q);
    else { params.set('lat',S.wxLat); params.set('lon',S.wxLon); }
    const r=await fetch('/api/weather?'+params.toString());
    if(!r.ok){ throw new Error('Weather lookup failed ('+r.status+')'); }
    const d=await r.json();
    S.wx=d;
    lsSet('org:wx', d);
    S.wxLat=d.lat; S.wxLon=d.lon;
    if(d.locName) S.wxLocName=d.locName;
    renderWx();
    try{ renderLP(); }catch(e){}
    // Settings-only save. Routing this through the full saveState() meant
    // every weather refresh re-sent this tab's whole task list — which is
    // how a stale phone tab wiped tasks created on the laptop.
    fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({wxLat:S.wxLat, wxLon:S.wxLon, wxLocName:S.wxLocName})})
      .then(r=>r.json()).then(x=>{ if(x && x._rev) S._rev = x._rev; })
      .catch(e=>console.log('Weather location save failed:',e.message));
  }catch(e){
    console.log('Weather error:',e.message);
    // Offline: show the last reading rather than an error.
    const cached = lsGet('org:wx');
    if(cached){ S.wx = cached; S._wxError=false; renderWx(); return; }
    S._wxError=true;
    renderWx();
  }
}

// Today's list scrolls itself so the event happening now (or the next one)
// sits at the top; earlier ones are still there above it. It leaves the
// list alone for two minutes after you scroll it yourself.
let _lpLastDay=null, _lpUserAt=0;
function lpAutoScroll(evs, force){
  const el=document.getElementById('lpBody'); if(!el) return;
  if(!force && Date.now()-_lpUserAt < 120000) return;
  requestAnimationFrame(()=>{
    if(el.scrollHeight <= el.clientHeight + 4) return;           // everything fits
    const now=new Date(), nowM=now.getHours()*60+now.getMinutes();
    const mins=ev=>{ const t=ev && ev.time ? fmtTime(ev.time) : ''; const m=t.match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60+(+m[2]) : null; };
    let idx=-1, lastTimed=-1;
    evs.forEach((ev,i)=>{ const m=mins(ev); if(m==null) return; lastTimed=i; if(idx<0 && m >= nowM-60) idx=i; /* started within the last hour, or later */ });
    if(idx<0) idx=lastTimed;                                    // all earlier today: show the last one
    const card=el.children[idx]; if(!card || idx<=0){ return; }
    const top=card.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop - 6;
    el.scrollTo({ top, behavior: force ? 'auto' : 'smooth' });
  });
}
['touchstart','wheel','pointerdown','keydown'].forEach(t=>document.addEventListener(t, e=>{ if(e.target && e.target.closest && e.target.closest('#lpBody')) _lpUserAt=Date.now(); }, {passive:true}));

// Detects whether a fixture's status text indicates it's currently in
// progress (Highlightly's state.description is free text like "1st Half",
// "Half Time", "Not Started", "Full Time" — anything that isn't clearly
// pre/post-match counts as live).
// Whether a fixture is actually in progress right now. This is a positive
// allow-list, NOT a "not finished/not scheduled" negative test — the
// negative version wrongly treated every unrecognised status (notably
// football-data.org's "TIMED", used for normal upcoming matches) as live,
// which made the whole day's schedule show LIVE badges hours early.
// Also requires kickoff to have actually passed, as a second safety net.
function isLiveStatus(status, ev){
  // THE CLOCK IS THE PRIMARY TEST, and it fails CLOSED: if we can't prove
  // from the stored date/time that kickoff has already passed, we never
  // show LIVE. An earlier version trusted the provider's status text first
  // and only used the clock as a secondary check, which meant an
  // unrecognised status (e.g. football-data.org's "TIMED" for ordinary
  // upcoming matches) lit up the entire day's schedule hours early.
  if(!ev || !ev.date || !ev.time) return false;
  const start = new Date(ev.date+'T'+fmtTime(ev.time)+':00').getTime();
  if(isNaN(start)) return false;
  const now = Date.now();
  if(now < start) return false;                    // hasn't kicked off yet
  if(now > start + 4*3600*1000) return false;      // long over
  // Only inside that window do we consult the provider's status text, as a
  // positive allow-list (never a "not finished" negative test).
  if(!status) return false;
  const s = String(status).toLowerCase();
  if(/(not started|scheduled|timed|postponed|cancell|full[\s-]?time|finished|ended|abandoned)/i.test(s)) return false;
  const liveWords = /(in[\s_-]?play|live|1st half|2nd half|first half|second half|half[\s-]?time|halftime|paused|extra time|penalt|added time|break time|interrupted)/i;
  return liveWords.test(s);
}

  return '<span style="display:inline-flex;align-items:center;gap:3px;background:#ef444422;color:#ef4444;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:6px"><span style="width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.5s infinite"></span>LIVE'+(ev.liveClock?' '+escHtml(ev.liveClock):'')+'</span>';
}

// Completion is per-occurrence for repeating tasks: ticking off this
// month's instance must not mark every other month done as well. Non
// repeating tasks keep the simple boolean.
function isDoneOn(task, ds){
  if(!task) return false;
  if(!task.freq || task.freq==='none') return !!task.done;
  return Array.isArray(task.doneDates) && task.doneDates.includes(ds);
}
function markDone(id, ds){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.freq || t.freq==='none'){
    t.done=!t.done;
  } else {
    if(!Array.isArray(t.doneDates)) t.doneDates=[];
    const i=t.doneDates.indexOf(ds);
    if(i===-1) t.doneDates.push(ds); else t.doneDates.splice(i,1);
  }
  saveState(); renderAll();
}
function postpone(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const d=parseD(t.date);d.setDate(d.getDate()+1);t.date=fmtD(d);saveState();renderAll()}

}

// ─── CALENDAR ────────────────────────────────────────────
let _selDay=TODAY;

function renderCal(){
  const ms=new Date(parseD(TODAY).getFullYear(),parseD(TODAY).getMonth()+S.weekOffset,1);
  const year=ms.getFullYear(),month=ms.getMonth();
  document.getElementById('calLabel').textContent=MONTHS_LONG[month]+' '+year;
  let startDow=(ms.getDay()+6)%7; // Mon=0
  const dim=new Date(year,month+1,0).getDate();
  const prev=new Date(year,month,0).getDate();
  let cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({d:prev-i,m:month-1,y:year,other:true});
  for(let d=1;d<=dim;d++)cells.push({d,m:month,y:year,other:false});
  let nd=1;while(cells.length%7!==0)cells.push({d:nd++,m:month+1,y:year,other:true});
  const DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html='<div class="month-dow-row">'+DOWS.map(d=>'<div class="month-dow">'+d+'</div>').join('')+'</div>';
  for(let w=0;w<cells.length;w+=7){
    html+='<div class="month-week">';
    for(let i=0;i<7;i++){
      const c=cells[w+i];
      const dt=new Date(c.y,c.m,c.d);
      const ds=fmtD(dt);
      const isToday=ds===TODAY,isSel=ds===_selDay;
      const evs=c.other?[]:eventsOnDay(ds);
      cacheEvents(evs);
      // Desktop cells are tall now that the calendar fills the screen, so
      // show more before collapsing; phones keep the compact limit.
      const maxChips = window.innerWidth > 900 ? 5 : 3;
      let chips=evs.slice(0,maxChips).map(ev=>{
        const col=ev._type==='task'?getGroup(ev.group).color:(ev._color||sportColor(ev.sport,ev));
        const isSport=ev._type==='sport';
        const badgeUrl=isSport?(ev._display==='collapsed'?ev.competitionLogo:(ev.home&&ev.home.logo)||ev.competitionLogo):null;
        const icon=badgeUrl?'<img src="'+escHtml(badgeUrl)+'" style="width:12px;height:12px;object-fit:contain;border-radius:2px;flex-shrink:0;vertical-align:-2px;margin-right:3px">':'';
        // A finished day should look finished: past entries fade back and
        // completed tasks are struck through, so what's still ahead of you
        // stands out at a glance.
        const isPast = ds < TODAY;
        const isDone = ev._type==='task' && ev.done;
        // An unfinished task from an earlier day isn't "past" — it's overdue,
        // so it keeps its colour (with a red edge) instead of fading out.
        const isOverdue = isPast && ev._type==='task' && !ev.done && !noOverdue(ev);
        const cls = 'chip'+(isSport?' sport':' task')+(isPast&&!isOverdue?' past':'')+(isOverdue?' overdue':'')+(isDone?' done':'');
        const tip = escHtml(ev.name)+(isDone?' — done':(isOverdue?' — overdue':(isPast?' — past':'')));
        return '<div class="'+cls+'" style="--c:'+col+';background:'+col+'28;color:'+col+';border-color:'+col+'50" title="'+tip+'">'+icon+escHtml(ev.name)+'</div>';
      }).join('');
      if(evs.length>maxChips)chips+='<div class="mday-more">+'+(evs.length-maxChips)+' more…</div>';
      html+='<div class="month-day'+(c.other?' other-month':'')+(ds<TODAY?' past-day':'')+(isToday?' today':'')+(isSel&&!isToday?' selected':'')+(evs.length?' has-events':'')+'" onclick="selectDay(\''+ds+'\')">';
      html+='<div class="mday-num">'+c.d+'</div><div class="mday-chips">'+chips+'</div></div>';
    }
    html+='</div>';
  }
  document.getElementById('cgrid').innerHTML=html;
}

function hOpts(sel){
  // Returns an input[type=time] value string HH:MM
  const hh=(sel||'09').toString().padStart(2,'0');
  return hh.includes(':')?hh:hh+':00';
}
function pOpts(sel){return PRIS.map(p=>'<option value="'+p+'"'+(p===(sel||'normal')?' selected':'')+'>'+(p==='very'?'Very high (urgent)':p[0].toUpperCase()+p.slice(1))+'</option>').join('')}
function spOpts(sel){
  const sp=['f1','motogp','tdf','giro','ucl','seriea','bundesliga','wec','snooker','cycling','n24h','football','romania','other'];
  const lb={f1:'Formula 1',motogp:'MotoGP',tdf:'Tour de France',giro:"Giro d'Italia",ucl:'Champions League',seriea:'Serie A',bundesliga:'Bundesliga',wec:'WEC Endurance',snooker:'Snooker',cycling:'Cycling',n24h:'24h Race',football:'Football',romania:'Romania NT',other:'Other'};
  return sp.map(s=>'<option value="'+s+'"'+(s===(sel||'other')?' selected':'')+'>'+lb[s]+'</option>').join('');
}

function gOpts(sel){return S.groups.map(g=>'<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+escHtml(g.name)+'</option>').join('')}
function fOpts(sel){return FREQS.map(f=>'<option value="'+f+'"'+(f===(sel||'none')?' selected':'')+'>'+(f==='none'?'No repeat':f[0].toUpperCase()+f.slice(1))+'</option>').join('')}

    PAL.map(c=>'<div class="cdot" style="width:20px;height:20px;border-radius:50%;background:'+c+

function openAddTask(prefill){
  showModal('New event',evForm(prefill||null),
    '<button class="btn" onclick="closeModal()">Cancel</button><span class="msp"></span><button class="btn acc" onclick="doSaveEvent()">Save</button>');
  setTimeout(()=>{document.getElementById('fn').focus();toggleEvType();},50);
}

function editTask(id){
  const t=S.tasks.find(x=>x.id===id);
  if(t){
    showModal('Edit task',evForm({...t,_type:'task'}),
      '<button class="btn red" onclick="delTask(\''+id+'\')">Delete</button><span class="msp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn acc" onclick="doSaveEvent()">Save</button>');
    setTimeout(()=>{toggleEvType();document.getElementById('fn').focus();},50);return;
  }
  const se=(S.sportEvents||[]).find(x=>x.id===id);
  if(se){
    showModal('Edit event',evForm({...se,_type:'sport'}),
      '<button class="btn red" onclick="delSport(\''+id+'\')">Delete</button><span class="msp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn acc" onclick="doSaveEvent()">Save</button>');
    setTimeout(()=>{toggleEvType();document.getElementById('fn').focus();},50);
  }
}

function doSaveEvent(){
  const name=(document.getElementById('fn').value||'').trim();
  if(!name){document.getElementById('fn').focus();return;}
  const type=document.getElementById('fevtype').value;
  const id=document.getElementById('fid').value;
  const origType=document.getElementById('forigtype').value;
  const date=document.getElementById('fd').value;
  const time=document.getElementById('ft').value;
  const notes=document.getElementById('fno').value;
  const location=(document.getElementById('floc')?document.getElementById('floc').value:'').trim();
  const travelMode=(document.querySelector('#fmode input:checked')||{}).value||'drive';
  const travelFrom=(document.getElementById('ffrom')?document.getElementById('ffrom').value:'').trim();
  const travelMins=parseInt((document.getElementById('fmins')||{}).value)||null;
  const reminders=[...document.querySelectorAll('#fremind input:checked')].map(i=>i.value);
  const reminder=reminders.length?reminders[reminders.length-1]:''; // legacy single field, kept for older code paths
  // Keep the original object so fields the form doesn't show survive an
  // edit — notably doneDates (per-occurrence completion of repeating
  // tasks), which used to be wiped every time a task was edited.
  let prev=null;
  if(id){
    prev = (origType==='task' ? S.tasks : (S.sportEvents||[])).find(x=>x.id===id) || null;
    if(origType==='task')S.tasks=S.tasks.filter(x=>x.id!==id);
    else S.sportEvents=(S.sportEvents||[]).filter(x=>x.id!==id);
  }
  const keep = (prev && origType===type) ? prev : {};
  const newId=id||uid();
  if(type==='sport'){
    const sport=document.getElementById('fsport').value;
    if(!S.sportEvents)S.sportEvents=[];
    S.sportEvents.push({...keep,id:newId,name,date,time,notes,location,travelFrom,travelMode,travelMins,sport,color:_tc,reminders,reminder});
  } else {
    S.tasks.push({...keep,id:newId,name,date,time,notes,location,travelFrom,travelMode,travelMins,
      group:document.getElementById('fg').value,
      freq:document.getElementById('fr').value,
      priority:document.getElementById('fp').value,
      reminders,reminder,done:keep.done||false});
  }
  saveState();
  scheduleReminder({id:newId,name,date,time,reminders});
  closeModal();renderAll();
}

// ─── NOTIFICATIONS / REMINDERS ────────────────────────────
function requestNotifPermission(cb){
  if(!('Notification' in window)){cb&&cb(false);return;}
  if(Notification.permission==='granted'){cb&&cb(true);return;}
  Notification.requestPermission().then(p=>cb&&cb(p==='granted'));
}

// Store active timer IDs so we can cancel on reload
const _timers={};

// Local (in-page) reminders are only a fallback now — the server sends
// reminders via push and Telegram even when the app is closed. Two bugs
// lived here:
//  • setTimeout overflows above 2^31 ms (~24.8 days), so an event weeks
//    away fired IMMEDIATELY on save. We now only arm timers for the next
//    24 hours and re-check hourly.
//  • A sleeping laptop freezes timers, then fires every overdue one on
//    wake. Each timer now checks on firing whether it's gone stale.
const LOCAL_WINDOW_MS = 24*3600*1000;
const STALE_AFTER_MS  = 5*60*1000;
function scheduleReminder(ev){
  if(!ev.date||!ev.time)return;
  // Clear every timer previously armed for this event.
  Object.keys(_timers).forEach(k=>{ if(k===ev.id || k.startsWith(ev.id+'|')){ clearTimeout(_timers[k]); delete _timers[k]; } });
  const [hh,mm]=(ev.time||'00:00').split(':');
  const evMs=new Date(ev.date+'T'+hh.padStart(2,'0')+':'+(mm||'00').padStart(2,'0')+':00').getTime();
  remindersOf(ev).forEach(r=>{
    const minBefore=parseInt(r);
    const fireMs=evMs-(minBefore*60000);
    const delay=fireMs-Date.now();
    if(delay<=0) return;                 // already past
    if(delay>LOCAL_WINDOW_MS) return;    // too far ahead — the hourly re-check will pick it up
    const key=ev.id+'|'+minBefore;
    _timers[key]=setTimeout(()=>{
      delete _timers[key];
      // Timers resume late after sleep; don't announce something long overdue.
      if(Date.now()-fireMs > STALE_AFTER_MS) return;
      if(Date.now() > evMs) return;
      // This in-page reminder is only a backup for devices that can't get
      // push. When this device already receives the server's push, showing
      // it as well made a second copy that the phone kept and a watch could
      // re-deliver later (e.g. the next morning on reconnect).
      pushActiveHere().then(hasPush=>{
        if(hasPush) return;
        requestNotifPermission(ok=>{
          if(!ok) return;
          const label=remLabelLong(minBefore);
          new Notification('\u23f0 '+ev.name,{
            body:'Starting in '+label+' \u2014 '+ev.date+' at '+ev.time,
            icon:'/icon-192.png',
            // Exactly the tag the server's push uses, so the two can never
            // stack up as separate notifications.
            tag:'rem-'+ev.id+'-'+ev.date
          });
        });
      });
    },delay);
  });
}

async function pushActiveHere(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    const reg = await navigator.serviceWorker.getRegistration();
    return !!(reg && await reg.pushManager.getSubscription());
  }catch(e){ return false; }
}
function scheduleAllReminders(){
  const all=[...S.tasks,...(S.sportEvents||[])];
  all.forEach(ev=>{ if(remindersOf(ev).length) scheduleReminder(ev); });
}
// Events enter the 24-hour window over time, so re-arm periodically.
setInterval(()=>{ try{ scheduleAllReminders(); }catch(e){} }, 60*60*1000);

// Show reminder badge on event cards
// An event can carry several reminders (e.g. 1 day, 2 hours and 15 min
// before). Older events stored a single "reminder" string, so both shapes
// are read here and everything else goes through this one function.
const REMINDER_OPTS=['5','10','15','30','60','120','1440'];
function remChipHtml(m, checked){
  return '<label class="rem-chip"><input type="checkbox" value="'+m+'"'+(checked?' checked':'')+'><span>'+remLabelLong(m)+'</span></label>';
}
const REM_UNIT_MAX={ day:7, week:4, month:12 };
function remNumOpts(unit){
  const n=REM_UNIT_MAX[unit]||7;
  return Array.from({length:n},(_,i)=>'<option value="'+(i+1)+'"'+(i===1&&unit==='day'?' selected':'')+'>'+(i+1)+'</option>').join('');
}
// Adds a "3 days / 2 weeks / 1 month before" chip (ticked) to the form.
function addCustomReminder(){
  const n=parseInt((document.getElementById('remN')||{}).value)||1;
  const u=(document.getElementById('remU')||{}).value||'day';
  const mins=String(n*(u==='month'?REM_MONTH:u==='week'?REM_WEEK:REM_DAY));
  const box=document.getElementById('fremind'); if(!box) return;
  const ex=box.querySelector('input[value="'+mins+'"]');
  if(ex){ ex.checked=true; return; }
  const chips=[...box.querySelectorAll('input')].map(i=>({m:i.value,c:i.checked}));
  chips.push({m:mins,c:true});
  chips.sort((a,b)=>parseInt(a.m)-parseInt(b.m));
  box.innerHTML=chips.map(x=>remChipHtml(x.m,x.c)).join('');
}
function remindersOf(ev){
  let list = Array.isArray(ev && ev.reminders) && ev.reminders.length ? ev.reminders
           : (ev && ev.reminder ? [ev.reminder] : []);
  list = [...new Set(list.map(String))].filter(m=>parseInt(m)>0);
  return list.sort((a,b)=>parseInt(b)-parseInt(a)); // earliest warning first
}
// True once an event's start time has gone by — used to fade finished
// items in the day list, including ones earlier today.
// How long ago an unfinished task was due: "20 min", "3 h", "2 days".
function overdueFor(ev){
  const ds=ev._occDate||ev.date; const [h,m]=(ev.time||'23:59').split(':').map(Number);
  const due=parseD(ds); due.setHours(h||0,m||0,0,0);
  const mins=Math.max(1,Math.round((Date.now()-due.getTime())/60000));
  if(mins<60) return mins+' min';
  if(mins<1440) return Math.round(mins/60)+' h';
  const d=Math.round(mins/1440); return d+' day'+(d===1?'':'s');
}
// A public holiday in the calendar is a marker, not a to-do: it never turns "overdue".
function noOverdue(ev){ return !!ev && ev.src==='holiday'; }
function isPastEvent(ev){
  const ds = ev._occDate || ev.date;
  if(!ds) return false;
  if(ds < TODAY) return true;
  if(ds > TODAY) return false;
  const [h,m]=(ev.time||'23:59').split(':').map(Number);
  const d=new Date(); d.setHours(h||0, m||0, 0, 0);
  return Date.now() > d.getTime();
}

// Reminders are stored in minutes; weeks are 7 days and months 30 days.
const REM_DAY=1440, REM_WEEK=10080, REM_MONTH=43200;
function remLabelLong(m){
  m=parseInt(m);
  const pl=(n,w)=>n+' '+w+(n===1?'':'s');
  if(m>=REM_MONTH && m%REM_MONTH===0) return pl(m/REM_MONTH,'month');
  if(m>=REM_WEEK && m%REM_WEEK===0) return pl(m/REM_WEEK,'week');
  if(m>=REM_DAY) return pl(Math.round(m/REM_DAY),'day');
  if(m>=60) return pl(Math.round(m/60),'hour');
  return m+' min';
}
function reminderLabelShort(m){
  m=parseInt(m);
  if(m>=REM_MONTH && m%REM_MONTH===0) return (m/REM_MONTH)+'mo';
  if(m>=REM_WEEK && m%REM_WEEK===0) return (m/REM_WEEK)+'w';
  return m>=REM_DAY?Math.round(m/REM_DAY)+'d':m>=60?Math.round(m/60)+'h':m+'m';
}

function reminderBadge(reminder){
  if(!reminder)return'';
  const min=parseInt(reminder);
  const label=reminderLabelShort(min)+' before';
  return'<span style="font-size:9px;background:#a78bfa20;color:#a78bfa;border:1px solid #a78bfa40;border-radius:10px;padding:1px 5px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-bell" style="font-size:9px"></i>'+label+'</span>';
}

// ─── SPORT DETAIL ─────────────────────────────────────────
// Caches every event object currently rendered (including fixtures nested
// inside collapsed competition slots) so click handlers can look up full
// data by id without re-deriving it.
let _evCache={};
let _fxRefreshTimer=null;
function cacheEvents(evs){
  evs.forEach(e=>{ _evCache[e.id]=e; if(e.fixtures) e.fixtures.forEach(f=>_evCache[f.id]=f); });
}

function showFixtureList(id){
  const slot=_evCache[id]; if(!slot||!slot.fixtures)return;
  if(slot.fixtures.length===1){ showSportDetail(slot.fixtures[0].id); return; }
  const rows=slot.fixtures.map(f=>{
    const hasTeams=f.home&&f.away;
    const badges=hasTeams?badgeImg(f.home.logo,f.home.name)+'<span style="font-size:10px;color:var(--txt3);margin:0 4px">vs</span>'+badgeImg(f.away.logo,f.away.name):'';
    const scoreTxt=f.score&&(f.score.home!=null)?(f.score.home+' - '+f.score.away):fmtTime(f.time);
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer" onclick="showSportDetail(\''+f.id+'\')">'+
      badges+'<div style="flex:1;font-size:12px">'+escHtml(f.name)+'</div>'+
      '<div style="font-size:11px;color:var(--txt2);font-weight:600">'+scoreTxt+'</div></div>';
  }).join('');
  showModal(slot.name, '<div style="max-height:60vh;overflow-y:auto">'+rows+'</div>',
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Close</button>');
}

function sdItem(label,val,full){
  return '<div class="sd-item"'+(full?' style="grid-column:1/-1"':'')+'>'+
    '<div class="sd-label">'+label+'</div><div class="sd-val">'+val+'</div></div>';
}

function showSportDetail(id){
  const ev=_evCache[id]||(S.sportEvents||[]).find(e=>e.id===id);if(!ev)return;
  if(ev.source==='auto'){ showAutoFixtureDetail(ev); return; }
  showManualSportDetail(ev);
}

function showManualSportDetail(ev){
  const col=ev.color||sportColor(ev.sport,ev);
  const d=parseD(ev.date);
  const links={f1:'<a href="https://www.formula1.com" target="_blank" style="color:var(--accent)">formula1.com</a>',motogp:'<a href="https://www.motogp.com" target="_blank" style="color:var(--orange)">motogp.com</a>',wec:'<a href="https://www.fiawec.com" target="_blank" style="color:var(--accent)">fiawec.com</a>',tdf:'<a href="https://www.letour.fr" target="_blank" style="color:var(--yellow)">letour.fr</a>',giro:'<a href="https://www.giroditalia.it" target="_blank" style="color:var(--red)">giroditalia.it</a>',ucl:'<a href="https://www.uefa.com/uefachampionsleague" target="_blank" style="color:var(--accent)">UEFA.com</a>',seriea:'<a href="https://www.legaseriea.it" target="_blank" style="color:var(--green)">legaseriea.it</a>'};
  let body='<div style="border-left:3px solid '+col+';padding-left:12px;margin-bottom:14px">'+
    '<div style="font-size:16px;font-weight:700;margin-bottom:4px">'+escHtml(ev.name)+'</div>'+
    '<div style="font-size:11px;color:var(--txt2)">'+fmtLong(d)+' · '+fmtTime(ev.time)+' Bucharest</div></div>'+
    '<div class="sd-grid">'+sdItem('Sport',ev.sport||'other')+sdItem('Date',fmtShort(d))+sdItem('Time',fmtTime(ev.time))+'</div>';

// Auto-synced fixture (from a followed team/competition). Fetches full
// detail from the backend — lineups/stats/standings for football via
// Highlightly, best-available info for everything else via TheSportsDB.
async function showAutoFixtureDetail(ev){
  if(_fxRefreshTimer){ clearInterval(_fxRefreshTimer); _fxRefreshTimer=null; }
  const col=ev.color||sportColor(ev.sport,ev);
  const d=parseD(ev.date);
  const headerBadges=ev.home&&ev.away
    ? '<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px">'+
        '<div style="text-align:center">'+badgeImgLg(ev.home.logo,ev.home.name)+'<div style="font-size:11px;margin-top:4px">'+escHtml(ev.home.name)+'</div></div>'+
        '<div style="font-size:13px;color:var(--txt3)">vs</div>'+
        '<div style="text-align:center">'+badgeImgLg(ev.away.logo,ev.away.name)+'<div style="font-size:11px;margin-top:4px">'+escHtml(ev.away.name)+'</div></div>'+
      '</div>' : '';
  showModal(ev.name,
    headerBadges+'<div style="text-align:center;font-size:11px;color:var(--txt2);margin-bottom:10px">'+fmtLong(d)+' · '+fmtTime(ev.time)+' Bucharest'+(ev.competitionName?' · '+escHtml(ev.competitionName):'')+'</div>'+
    '<div id="fxDetailBody" style="font-size:12px;color:var(--txt2);text-align:center;padding:20px 0"><i class="ti ti-loader-2"></i> Loading details…</div>',
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Close</button>');

  const load = async ()=>{
    try{
      const r=await fetch('/api/fixture/'+ev.provider+'/'+ev.providerId+'?sport='+encodeURIComponent(ev.sport||''));
      const d2=await r.json();
      const el=document.getElementById('fxDetailBody');
      if(!el){ if(_fxRefreshTimer){clearInterval(_fxRefreshTimer);_fxRefreshTimer=null;} return; } // modal closed
      if(d2.error){ el.innerHTML='<div style="color:var(--red)">Could not load details: '+escHtml(d2.error)+'</div>'; return; }
      el.innerHTML=renderFixtureDetailBody(ev,d2);
      // If the match is live, keep polling for fresh score/events every 60s
      // while this modal stays open — stop once it's no longer live.
      const liveNow = d2.fixture && isLiveStatus((d2.fixture.state&&d2.fixture.state.description)||ev.status, ev);
      if(liveNow && !_fxRefreshTimer){
        _fxRefreshTimer=setInterval(load, 60000);
      } else if(!liveNow && _fxRefreshTimer){
        clearInterval(_fxRefreshTimer); _fxRefreshTimer=null;
      }
    }catch(e){
      const el=document.getElementById('fxDetailBody');
      if(el) el.innerHTML='<div style="color:var(--red)">Network error loading details.</div>';
    }
  };
  await load();
}

function renderFixtureDetailBody(ev,d){
  if(ev.provider==='thesportsdb'){
    const f=d.fixture;
    if(!f) return '<div style="text-align:center;color:var(--txt3)">No further detail available for this event.</div>';
    let html='<div class="sd-grid">'+sdItem('Status',f.strStatus||'Scheduled')+sdItem('Venue',f.strVenue||'—');
    if(f.intHomeScore!=null) html+=sdItem('Score',f.intHomeScore+' - '+f.intAwayScore,true);
    html+='</div>';
    return html;
  }
  if(ev.provider==='motogp'){
    const f=d.fixture;
    if(!f || f.error) return '<div style="text-align:center;color:var(--txt3)">No further detail available for this event.</div>';
    let html='<div class="sd-grid">'+
      sdItem('Circuit',(f.circuit&&f.circuit.name)||ev.circuit||'—')+
      sdItem('Country',(f.circuit&&f.circuit.country)||ev.country||'—')+
      sdItem('Status',f.status||ev.status||'Scheduled')+'</div>';
    if(f.broadcasts && f.broadcasts.length){
      html+='<div class="slabel" style="margin-top:14px">Weekend schedule</div>';
      html+='<div style="font-size:11px">'+f.broadcasts.filter(b=>b.category&&b.category.name==='MotoGP').map(b=>
        '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)"><span>'+escHtml(b.name||b.shortname)+'</span><span style="color:var(--txt3)">'+new Date(b.date_start).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})+'</span></div>'
      ).join('')+'</div>';
    }
    return html;
  }
  if(ev.provider==='highlightly'){
    const fx=d.fixture;
    if(!fx) return '<div style="text-align:center;color:var(--txt3)">No further detail available for this event.</div>';
    let html='<div class="sd-grid">'+
      sdItem('Status',(fx.state&&fx.state.description)||'Scheduled')+
      sdItem('Venue',(fx.venue&&fx.venue.name)||'—');
    if(fx.state&&fx.state.score&&fx.state.score.current) html+=sdItem('Score',fx.state.score.current,true);
    html+='</div>';
    if(fx.events && fx.events.length){
      const notable=fx.events.filter(e=>['Goal','Own Goal','Penalty','Red Card'].includes(e.type));
      if(notable.length){
        html+='<div class="slabel" style="margin-top:14px">Key events</div><div style="font-size:11px">'+
          notable.map(e=>'<div style="display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)"><span style="color:var(--txt3);width:34px">'+escHtml(e.time||'')+'\'</span><span>'+(e.type==='Goal'||e.type==='Penalty'?'⚽':e.type==='Own Goal'?'⚽(OG)':'🟥')+' '+escHtml(e.player||'')+'</span></div>').join('')+
          '</div>';
      }
    }
    if(d.lineups && d.lineups.homeTeam && d.lineups.awayTeam){
      html+='<div class="slabel" style="margin-top:14px">Lineups</div><div style="display:flex;gap:10px">';
      [d.lineups.homeTeam, d.lineups.awayTeam].forEach(side=>{
        html+='<div style="flex:1;font-size:11px"><div style="font-weight:700;margin-bottom:4px">'+escHtml(side.name)+' <span style="color:var(--txt3);font-weight:400">('+escHtml(side.formation||'')+')</span></div>';
        (side.initialLineup||[]).flat().forEach(p=>{ html+='<div style="padding:2px 0;color:var(--txt2)">'+(p.number||'')+' · '+escHtml(p.name)+' <span style="color:var(--txt3)">'+(p.position||'')+'</span></div>'; });
        html+='</div>';
      });
      html+='</div>';
    }
    if(fx.statistics && fx.statistics.length===2){
      const [home,away]=fx.statistics;
      html+='<div class="slabel" style="margin-top:14px">Statistics</div>';
      (home.statistics||[]).forEach((s,i)=>{
        const b=(away.statistics[i]&&away.statistics[i].value) ?? '—';
        html+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)"><span>'+s.value+'</span><span style="color:var(--txt3)">'+escHtml(s.displayName)+'</span><span>'+b+'</span></div>';
      });
    }
    if(d.standings && d.standings.length){
      html+='<div class="slabel" style="margin-top:14px">Standings</div><div style="font-size:11px">'+d.standings.slice(0,10).map(t=>
        '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)">'+
        '<span style="width:16px;color:var(--txt3)">'+t.position+'</span>'+badgeImg(t.team.logo,t.team.name)+
        '<span style="flex:1">'+escHtml(t.team.name)+'</span><span style="color:var(--txt3)">'+t.total.games+'p</span><span style="color:var(--txt2);font-weight:700">'+t.points+' pts</span></div>'
      ).join('')+'</div>';
    }
    if(fx.predictions && fx.predictions.prematch && fx.predictions.prematch[0]){
      const p=fx.predictions.prematch[0].probabilities;
      html+='<div class="slabel" style="margin-top:14px">Prediction</div><div style="font-size:11px;display:flex;justify-content:space-between"><span>Home '+p.home+'</span><span>Draw '+p.draw+'</span><span>Away '+p.away+'</span></div>';
    }
    return html;
  }
  return '<div style="text-align:center;color:var(--txt3)">No further detail available yet — check back closer to kickoff.</div>';
}

// API keys, the home address, backups and the Claude link live behind a
// password. The server never sends these in /api/data; unlocking returns a
// 30-minute token that is kept for this session only.
let _privTok = null, P = {};
try{ _privTok = sessionStorage.getItem('org:privTok') || null; }catch(e){}
function setPrivTok(t){
  _privTok = t || null;
  try{ if(t) sessionStorage.setItem('org:privTok', t); else sessionStorage.removeItem('org:privTok'); }catch(e){}
}
// Every same-origin API call carries the token while unlocked, so the
// existing backup/restore/connector code needs no changes of its own.
(function(){
  const orig = window.fetch.bind(window);
  window.fetch = function(input, init){
    try{
      const url = typeof input === 'string' ? input : (input && input.url) || '';
      if(_privTok && (url.startsWith('/api/') || url.startsWith(location.origin + '/api/'))){
        init = { ...(init||{}) };
        const h = new Headers(init.headers || {});
        h.set('X-Private-Token', _privTok);
        init.headers = h;
      }
    }catch(e){}
    return orig(input, init);
  };
})();

  const box = document.getElementById('privBox'); if(!box) return;

async function privPost(url, body){
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok && !d.error) d.error = 'Request failed ('+r.status+')';
  return d;
}
async function privSetup(){

async function doRestore(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const el = document.getElementById('restoreStatus');
  el.style.color='var(--txt3)'; el.innerHTML='<i class="ti ti-loader-2"></i> Restoring…';
  try{
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); }
    catch(e){ el.style.color='var(--red)'; el.textContent='That file isn\'t valid JSON.'; return; }
    const r = await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(parsed)});
    const d = await r.json();
    if(d.error){ el.style.color='var(--red)'; el.textContent='Restore failed: '+d.error; return; }
    el.style.color='var(--green)';
    el.textContent='✅ Restored '+d.tasks+' tasks, '+d.sportEvents+' sport events, '+d.follows+' follows.';
    await loadFromServer(); renderAll(); renderWx();
  }catch(e){ el.style.color='var(--red)'; el.textContent='Restore failed: '+e.message; }
  finally { input.value=''; }
}

async function fmSearch(){
  const q=(document.getElementById('fmQ').value||'').trim();
  const resEl=document.getElementById('fmResults');
  const isFdCompetitionBrowse = _fmSport==='football' && _fmKind==='competition'; // fixed list, browsable with no query
  if(!q && !isFdCompetitionBrowse){resEl.innerHTML='<div style="font-size:11px;color:var(--txt3);padding:8px 0">Type a name to search.</div>';return;}
  const url='/api/sports/search?sport='+encodeURIComponent(_fmSport)+'&kind='+_fmKind+'&q='+encodeURIComponent(q);
  resEl.innerHTML='<div style="font-size:11px;color:var(--txt3);padding:8px 0"><i class="ti ti-loader-2"></i> Loading…</div>';
  try{
    const r=await fetch(url);
    const d=await r.json();
    if(d.error){ resEl.innerHTML='<div style="font-size:11px;color:var(--red)">'+escHtml(d.error)+'</div>'; return; }
    _fmResults=d.results||[];
    if(!_fmResults.length){ resEl.innerHTML='<div style="font-size:11px;color:var(--txt3);padding:8px 0">No results.</div>'; return; }
    // "View clubs" browse uses Highlightly's standings endpoint — only
    // valid for handball competitions now (football competitions use
    // football-data.org codes, a different ID scheme entirely).
    const canBrowseClubs = _fmKind==='competition' && _fmSport==='handball';
    if(canBrowseClubs){ renderCompetitionResults(); return; }
    resEl.innerHTML=_fmResults.map((x,i)=>
      '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'+
      badgeImg(x.logo,x.name)+'<span style="flex:1;font-size:12px">'+escHtml(x.name)+(x.country?' <span style="color:var(--txt3);font-size:10px">'+escHtml(x.country)+'</span>':'')+'</span>'+
      '<button class="btn sm acc" onclick="fmAdd('+i+')"><i class="ti ti-plus"></i> Follow</button></div>'
    ).join('');
  }catch(e){ resEl.innerHTML='<div style="font-size:11px;color:var(--red)">Search failed: '+escHtml(e.message)+'</div>'; }
}

async function fmAdd(i){
  const x=_fmResults[i]; if(!x)return;
  try{

}

function buildDailyMsg(dateStr){
  const d=parseD(dateStr);
  const evs=eventsOnDay(dateStr);
  const dow=d.toLocaleDateString('en-GB',{weekday:'long'});
  const dateDisp=d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  let msg='📅 <b>Daily briefing — '+dow+', '+dateDisp+'</b>\n\n';
  if(!evs.length){
    msg+='✨ No events scheduled today. Enjoy your day!';
  } else {
    msg+='<b>'+evs.length+' event'+(evs.length>1?'s':'')+' today:</b>\n\n';
    evs.forEach(ev=>{
      const icon=ev._type==='task'?'📋':'🏆';
      msg+=icon+' <b>'+ev.name+'</b>\n';
      msg+='   🕐 '+fmtTime(ev.time);
      if(ev._type==='task'){
        const g=getGroup(ev.group);
        msg+=' · '+g.name;
        if(ev.priority&&ev.priority!=='normal') msg+=' · ⚠️ '+ev.priority;
      } else {
        msg+=' · '+(ev.sport||'sport');
      }
      if(ev.notes) msg+='\n   📝 '+ev.notes;
      if(ev.reminder) msg+='\n   🔔 Reminder: '+reminderBadgeTxt(ev.reminder)+' before';
      msg+='\n\n';
    });
  }
  msg+='—\n🗂 Personal Organizer';
  return msg;
}

function remindersBadge(ev){
  const list=remindersOf(ev);
  if(!list.length) return '';
  return '<span class="rem-badge" style="font-size:9px;background:#a78bfa20;color:#a78bfa;border:1px solid #a78bfa40;border-radius:10px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-bell" style="font-size:9px"></i>'+
    list.map(reminderLabelShort).join(' \u00b7 ')+' before</span>';
}

function reminderBadgeTxt(r){ return remLabelLong(r); }

function buildWeeklyMsg(){
  // 7 days starting from today
  let msg='📆 <b>Weekly summary</b> — week of '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'\n\n';
  const totalTasks=S.tasks.filter(t=>!t.done).length;
  const totalSport=(S.sportEvents||[]).length;
  msg+='📋 <b>'+totalTasks+'</b> active tasks · 🏆 <b>'+totalSport+'</b> sport events\n\n';
  // Active tasks by priority
  const urgent=S.tasks.filter(t=>!t.done&&t.priority==='very');
  const high=S.tasks.filter(t=>!t.done&&t.priority==='high');
  if(urgent.length){
    msg+='🚨 <b>URGENT:</b>\n';
    urgent.forEach(t=>msg+='• '+t.name+' ('+t.date+')\n');
    msg+='\n';
  }
  if(high.length){
    msg+='⚠️ <b>High priority:</b>\n';
    high.forEach(t=>msg+='• '+t.name+' ('+t.date+')\n');
    msg+='\n';
  }
  // This week's events day by day
  msg+='<b>This week\'s schedule:</b>\n';
  for(let i=0;i<7;i++){
    const d=parseD(TODAY);d.setDate(d.getDate()+i);
    const ds=fmtD(d);
    const evs=eventsOnDay(ds);
    if(evs.length){
      const dow=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      msg+='\n<b>'+dow+'</b>\n';
      evs.forEach(ev=>{
        const icon=ev._type==='task'?'📋':'🏆';
        msg+=icon+' '+ev.name+' ('+fmtTime(ev.time)+')\n';
      });
    }
  }
  // Upcoming sport events
  const upcoming=(S.sportEvents||[]).filter(e=>e.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(upcoming.length){
    msg+='\n🏆 <b>Next sport events:</b>\n';
    upcoming.forEach(e=>{
      const d=parseD(e.date);
      msg+='• '+e.name+' — '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' at '+fmtTime(e.time)+'\n';
    });
  }
  msg+='\n—\n🗂 Personal Organizer';
  return msg;
}
