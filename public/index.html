<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Personal Organizer</title>
<!-- PWA: the manifest + service worker are what make Android Chrome and
     desktop browsers offer a real "Install" option. iOS installs without
     them, which is why it already worked there. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#11141f">
<meta name="description" content="Tasks, events, weather and followed sport fixtures in one place.">
<!-- iOS-specific: standalone display and home-screen icon -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Organizer">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0a0d14;--bg1:#111520;--bg2:#181d2e;--bg3:#1f2540;
  --border:#2a3050;--border2:#374068;
  --txt:#e2e8f8;--txt2:#7d8ab0;--txt3:#3d4870;
  --accent:#4f8ef7;--accent2:#7c3aed;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;--pink:#e879a0;
  --r:8px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);box-sizing:border-box}
/* viewport-fit=cover (needed so the PWA fills the screen) draws content
   under the status bar and home indicator, so every edge element has to
   add the matching safe-area inset back. */
.app{display:grid;height:100vh;
  grid-template-rows:64px 1fr 200px;
  grid-template-columns:280px 1fr;
  grid-template-areas:"wx top top""lp cal cal""bot bot bot";
}
@media(max-width:900px){
  .app{display:flex;flex-direction:column;height:auto}
  html,body{overflow:auto}
  #chatbot{height:240px}
}
/* TOP */
#wx{grid-area:wx;background:var(--bg1);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;cursor:pointer;position:relative;z-index:60;display:flex;flex-direction:column;justify-content:space-between}
#topbar{grid-area:top;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px}
#topbar h1{font-size:15px;font-weight:700;flex:1;text-align:center;background:linear-gradient(90deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#cr{display:none}
/* WEATHER */
.wx-main{display:flex;align-items:center;gap:10px}
.wx-icon{font-size:36px;line-height:1}
.wx-data{display:flex;flex-direction:column;gap:1px}
.wx-temp{font-size:26px;font-weight:700;line-height:1;letter-spacing:-1px}
.wx-mm{font-size:11px;color:var(--txt2)}
.wx-cond{font-size:11px;color:var(--txt2)}
.wx-loc-row{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:3px;margin-top:2px}
.wx-hint{font-size:9px;color:var(--txt3);text-align:center}
.wx-drop{display:none;position:absolute;top:100%;left:0;width:340px;background:var(--bg1);border:1px solid var(--border2);border-radius:0 0 var(--rl) var(--rl);z-index:200;box-shadow:0 20px 60px #000a}
.wx-drop.open{display:block}
.wx-drop-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.wx-drop-head h3{font-size:13px;font-weight:600}
.wx-loc-bar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border)}
.wx-loc-bar input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;color:var(--txt);font-size:12px;font-family:inherit;outline:none}
.wx-days{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
.wx-day{flex-shrink:0;width:66px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 5px;text-align:center}
.wx-day-n{font-size:10px;color:var(--txt2);font-weight:600;margin-bottom:4px}
.wx-day-i{font-size:20px;margin-bottom:3px}
.wx-day-h{font-size:13px;font-weight:700}
.wx-day-l{font-size:10px;color:var(--txt2)}
.wx-day-r{font-size:9px;color:#60a5fa;margin-top:2px}
.wx-windy{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 14px;padding:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);font-size:12px;color:var(--accent);text-decoration:none}
@media (hover:hover) and (pointer:fine){ .wx-windy:hover{background:var(--bg3)} }
/* CRYPTO */
.cr-row{display:flex;gap:10px;align-items:stretch}
.cr-coin{flex:1;display:flex;flex-direction:column;gap:2px}
.cr-label{font-size:9px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.cr-price{font-size:16px;font-weight:700;letter-spacing:-.5px;line-height:1}
.cr-chg{font-size:10px}
.cr-chg.up{color:var(--green)}.cr-chg.dn{color:var(--red)}
.cr-pnl{font-size:10px;color:var(--txt2);margin-top:1px}
.cr-hint{font-size:9px;color:var(--txt3);text-align:center;margin-top:5px}
.cr-sep{width:1px;background:var(--border);flex-shrink:0}
.cr-panel{display:none;position:absolute;top:0;right:0;width:400px;max-width:95vw;background:var(--bg1);border:1px solid var(--border2);border-radius:var(--rl);z-index:200;box-shadow:0 24px 64px #000c;padding:16px;max-height:90vh;overflow-y:auto}
.cr-panel.open{display:block}
.cr-panel h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center}
.ptable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.ptable th{color:var(--txt2);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:10px}
.ptable td{padding:5px 6px;border-bottom:1px solid var(--border)}
.ptable tr:last-child td{border-bottom:none}
.pnl-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--border);margin-top:2px}
.tv-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:10px;min-height:200px}
/* LEFT PANEL */
#lp{grid-area:lp;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lp-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.lp-head h2{font-size:13px;font-weight:600}
.day-nav{display:flex;align-items:center;gap:4px}
.day-nav .dl{font-size:10px;color:var(--txt2);min-width:72px;text-align:center}
.lp-body{flex:1;overflow-y:auto;padding:8px}
/* CALENDAR */
#cal{grid-area:cal;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.cal-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.cal-head h2{font-size:14px;font-weight:700;flex:1;text-align:center}
.cal-body{flex:1;overflow-y:auto;padding:8px 10px}
.month-grid{display:flex;flex-direction:column;gap:1px}
.month-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}
.month-dow{text-align:center;font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;padding:4px 0}
.month-week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.month-day{background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:4px 5px;min-height:74px;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden}
@media (hover:hover) and (pointer:fine){ .month-day:hover{border-color:var(--border2);background:var(--bg2)} }
.month-day.today{border-color:var(--accent);background:var(--bg2)}
.month-day.today .mday-num{color:var(--accent);font-weight:700}
.month-day.other-month{opacity:.25}
.month-day.selected{border-color:var(--accent);background:#4f8ef712}
.mday-num{font-size:11px;font-weight:500;margin-bottom:3px;line-height:1}
.mday-chips{display:flex;flex-direction:column;gap:1px}
.chip{display:block;border-radius:3px;padding:1px 4px;font-size:9px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;font-weight:500}
.mday-more{font-size:9px;color:var(--txt3);margin-top:1px}
#rp{display:none}
/* EVENT CARDS */
.ecard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px;margin-bottom:7px}
.ecard.done{opacity:.4}
.ec-top{display:flex;align-items:flex-start;gap:7px}
.ec-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:14px}
.ec-body{flex:1;min-width:0}
.ec-title{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-meta{font-size:10px;color:var(--txt2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ec-notes{font-size:10px;color:var(--txt2);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ec-actions{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.ea{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;font-size:10px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--txt2);cursor:pointer;font-family:inherit;transition:background .12s,color .12s}
@media (hover:hover) and (pointer:fine){ .ea:hover{background:var(--bg3);color:var(--txt)} }
@media (hover:hover) and (pointer:fine){ .ea.red:hover{background:#f8717120;color:var(--red)} }
@media (hover:hover) and (pointer:fine){ .ea.grn:hover{background:#34d39920;color:var(--green)} }
@media (hover:hover) and (pointer:fine){ .ea.ylw:hover{background:#fbbf2420;color:var(--yellow)} }
/* PRIORITY */
.plabel{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:700}
.plabel.low{background:#64748b30;color:#94a3b8}
.plabel.normal{background:#4f8ef720;color:var(--accent)}
.plabel.high{background:#fb923c20;color:var(--orange)}
.plabel.very{background:#f8717120;color:var(--red)}
/* CHATBOT */
#chatbot{grid-area:bot;background:var(--bg1);border-top:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.cmsg{max-width:78%;padding:8px 12px;border-radius:var(--r);font-size:12px;line-height:1.5}
.cmsg.u{background:var(--accent);color:#fff;align-self:flex-end;border-radius:12px 12px 4px 12px}
.cmsg.b{background:var(--bg2);border:1px solid var(--border);color:var(--txt);align-self:flex-start;border-radius:12px 12px 12px 4px}
.chat-row{display:flex;gap:8px;padding:8px 16px;border-top:1px solid var(--border);flex-shrink:0;align-items:flex-end}
.chat-inp{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:8px 14px;color:var(--txt);font-size:12px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4}
.chat-inp:focus{border-color:var(--accent)}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media (hover:hover) and (pointer:fine){ .chat-send:hover{background:#3a7de8} }
/* MODAL */
.mbg{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.mbg.open{display:flex}
.mbox{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--rl);padding:20px;width:400px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 32px 80px #000c}
.mbox h2{font-size:15px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:68px;line-height:1.5}
.field select option{background:var(--bg2)}
.macts{display:flex;align-items:center;gap:8px;margin-top:16px}
.msp{flex:1}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;font-size:12px;font-family:inherit;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--txt);cursor:pointer;white-space:nowrap;transition:background .15s}
@media (hover:hover) and (pointer:fine){ .btn:hover{background:var(--bg3)} }
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
@media (hover:hover) and (pointer:fine){ .btn.acc:hover{background:#3a7de8} }
.btn.red{color:var(--red);border-color:transparent}
@media (hover:hover) and (pointer:fine){ .btn.red:hover{background:#f8717120} }
.btn.ghost{border-color:transparent;background:transparent}
@media (hover:hover) and (pointer:fine){ .btn.ghost:hover{background:var(--bg2)} }
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ico{padding:5px 8px;border-radius:6px}
/* SPORT DETAIL */
.sd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.sd-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.sd-label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.sd-val{font-size:12px;font-weight:600}
/* STANDINGS */
.stand-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:2px}
.stand-table th{color:var(--txt3);font-weight:700;text-align:left;padding:4px 5px;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase}
.stand-table td{padding:4px 5px;border-bottom:1px solid var(--border)}
.stand-table tr:last-child td{border-bottom:none}
.stand-p1{background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;font-size:9px;font-weight:700}
.stand-p{color:var(--txt3);font-size:10px}
/* BADGES */
.badge-live{display:inline-block;background:#f8717130;color:var(--red);border:1px solid #f8717150;border-radius:10px;font-size:9px;padding:1px 6px;font-weight:700}
.badge-soon{display:inline-block;background:#fbbf2430;color:var(--yellow);border:1px solid #fbbf2450;border-radius:10px;font-size:9px;padding:1px 6px;font-weight:700}
.slabel{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slideL{from{opacity:.35;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.35;transform:translateX(-18px)}to{opacity:1;transform:none}}
.swipe-l{animation:slideL .22s ease-out}
.net-pill{align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.net-pill.offline{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b55}
.net-pill.syncing{background:#4f8ef722;color:#4f8ef7;border:1px solid #4f8ef755}
.swipe-r{animation:slideR .22s ease-out}
#cgrid,#lpBody{touch-action:pan-y}

/* ═══════════════════════════════════════════════════════════
   DEEP GLASS
   A single layer over the base styles. Palette: night navy base,
   frosted glass surfaces, mist text, periwinkle accent. Hierarchy
   comes from shape — large radius for panels, medium for cards,
   pills for chips — rather than one radius on everything.
   The one expressive element is the weather "sky", whose glow
   follows current conditions; everything else stays quiet.
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg:#0F1732;
  --bg1:rgba(255,255,255,.045);
  --bg2:rgba(255,255,255,.075);
  --bg3:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.13);
  --txt:#E8ECF8;--txt2:#9AA6C8;--txt3:#6B78A0;
  --accent:#8CA8FF;--accent-ink:#0F1732;
  --glass-solid:rgba(24,33,72,.86);
  --r:12px;--rl:22px;--rp:999px;
  color-scheme:dark;
}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  background:#0F1732;
}
/* The backdrop lives on a fixed layer behind the page. background-attachment:
   fixed is ignored by iOS Safari (it rendered a flat black band past the first
   screen), whereas a fixed pseudo-element behaves the same everywhere. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 110% -10%, rgba(124,108,255,.18), transparent 60%),
    radial-gradient(900px 600px at -20% 110%, rgba(56,132,255,.14), transparent 60%),
    linear-gradient(180deg,#131C3D 0%,#0F1732 45%,#0C1229 100%);
}
/* Frosted surfaces */
#topbar,#lp,#cal,#chatbot{
  background:var(--bg1);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--border);
}
/* Mobile: panels float as separate sheets */
@media(max-width:900px){
  #topbar,#lp,#cal,#chatbot{margin:10px 12px 0;border-radius:var(--rl)}
  #chatbot{margin-bottom:12px}
  #topbar{padding:10px 12px;border-radius:var(--rl)}
}
/* Desktop: a grid of sheets with breathing room */
@media(min-width:901px){
  .app{gap:12px;padding:12px;grid-template-rows:118px 1fr 210px}
  #wx,#topbar,#lp,#cal,#chatbot{border-radius:var(--rl)}
  #wx{border:1px solid var(--border)}
}
/* ── The sky: weather panel whose glow follows conditions ── */
#wx{
  border-right:none;border-bottom:none;
  background:
    radial-gradient(120% 110% at 8% -10%, var(--sky-glow,rgba(140,168,255,.22)), transparent 62%),
    linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
}
@media(max-width:900px){ #wx{border-radius:0 0 30px 30px;padding-bottom:16px} }
#wx[data-sky="sun"]  {--sky-glow:rgba(255,183,94,.42)}
#wx[data-sky="cloud"]{--sky-glow:rgba(150,170,210,.30)}
#wx[data-sky="rain"] {--sky-glow:rgba(72,150,255,.40)}
#wx[data-sky="storm"]{--sky-glow:rgba(150,110,255,.42)}
#wx[data-sky="snow"] {--sky-glow:rgba(190,230,255,.38)}
#wx[data-sky="fog"]  {--sky-glow:rgba(170,180,200,.28)}
#wx[data-sky="night"]{--sky-glow:rgba(92,96,220,.40)}
.wx-temp{font-size:34px;font-weight:600;letter-spacing:-1.2px}
.wx-icon,#wxi{font-size:42px}
.wx-mm,.wx-cond{font-size:12px}
.wx-loc-row{color:var(--txt2)}
.wx-hint{color:var(--txt3)}
.wx-drop{background:var(--glass-solid);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  border:1px solid var(--border2);border-radius:var(--rl);margin-top:8px;box-shadow:0 30px 70px rgba(4,8,26,.6)}
.wx-day{background:var(--bg2);border:none;border-radius:16px}
.wx-loc-bar input{border-radius:var(--rp);background:var(--bg2);border-color:var(--border)}
.wx-windy{border-radius:var(--rp);background:var(--bg2);border-color:var(--border)}
/* ── Header ── */
#topbar h1{background:none;-webkit-text-fill-color:currentColor;color:var(--txt);font-weight:650;font-size:16px;letter-spacing:-.2px}
#topbar h1 i{color:var(--accent)}
/* ── Buttons: soft pills ── */
.btn{border-radius:var(--rp);background:var(--bg2);border:1px solid var(--border);color:var(--txt);font-weight:500;padding:7px 15px}
@media (hover:hover) and (pointer:fine){ .btn:hover{background:var(--bg3)} }
.btn.acc{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
@media (hover:hover) and (pointer:fine){ .btn.acc:hover{background:#A3B9FF} }
.btn.ghost{background:transparent;border-color:transparent}
@media (hover:hover) and (pointer:fine){ .btn.ghost:hover{background:var(--bg2)} }
.btn.red{background:rgba(248,113,113,.10);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.ico{border-radius:var(--rp);padding:7px 9px}
.btn:focus-visible,.ea:focus-visible,.chat-send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ── Day agenda ── */
.lp-head,.cal-head{border-bottom:1px solid var(--border);background:transparent}
.lp-head h2{font-size:18px;font-weight:650;letter-spacing:-.3px}
.day-nav .dl{font-size:12px;color:var(--txt2)}
.lp-body{padding:12px}
.ecard{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.ec-bar{width:4px;border-radius:var(--rp)}
.ec-title{font-size:15px;font-weight:600;letter-spacing:-.1px}
.ec-meta{font-size:12px;gap:8px;margin-top:4px}
.ec-notes{font-size:12px}
.ec-notes a{word-break:break-all}
.ecard:hover .ec-notes,.ec-notes:focus-within{-webkit-line-clamp:unset}
.ec-actions{gap:6px;margin-top:11px}
.ea{border-radius:var(--rp);padding:5px 11px;font-size:12px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--txt2)}
@media (hover:hover) and (pointer:fine){ .ea:hover{background:var(--bg3);color:var(--txt)} }
.plabel{border-radius:var(--rp);padding:2px 8px;font-size:10px;font-weight:600}
.plabel.normal{background:rgba(140,168,255,.14);color:var(--accent)}
/* Times line up down the page */
.ec-meta,.wx-temp,.wx-mm,.mday-num,.day-nav .dl{font-variant-numeric:tabular-nums}
/* ── Month grid ── */
.cal-head h2{font-size:18px;font-weight:650;letter-spacing:-.3px}
.cal-body{padding:10px 12px}
.month-grid,.month-dow-row,.month-week{gap:5px}
.month-dow{text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;color:var(--txt3)}
.month-day{background:rgba(255,255,255,.035);border:1px solid transparent;border-radius:12px;padding:6px 6px;min-height:78px}
@media (hover:hover) and (pointer:fine){ .month-day:hover{background:var(--bg2);border-color:var(--border)} }
.month-day.today{background:rgba(140,168,255,.10);border-color:rgba(140,168,255,.55)}
.month-day.today .mday-num{color:var(--accent);font-weight:700}
.month-day.selected{background:rgba(140,168,255,.08);border-color:rgba(140,168,255,.35)}
.month-day.other-month{opacity:.22}
.mday-num{font-size:12px;font-weight:600;margin-bottom:5px}
.chip{border-radius:7px;padding:2px 6px;font-size:10px}
/* ── Chat ── */
.chat-msgs{padding:12px 16px;gap:8px}
.cmsg{font-size:13px;border-radius:18px}
.cmsg.u{background:var(--accent);color:var(--accent-ink);border-radius:18px 18px 6px 18px}
.cmsg.b{background:var(--bg2);border:1px solid var(--border);border-radius:18px 18px 18px 6px}
.chat-row{border-top:1px solid var(--border);padding:10px 12px}
.chat-inp{border-radius:var(--rp);background:var(--bg2);border:1px solid var(--border);font-size:14px;padding:10px 16px}
.chat-inp:focus{border-color:rgba(140,168,255,.6)}
.chat-send{width:42px;height:42px;background:var(--accent);color:var(--accent-ink)}
@media (hover:hover) and (pointer:fine){ .chat-send:hover{background:#A3B9FF} }
/* ── Modals: solid-enough glass to read comfortably ── */
.mbg{background:rgba(6,10,28,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mbox{background:var(--glass-solid);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
  border:1px solid var(--border2);border-radius:26px;padding:22px;box-shadow:0 40px 90px rgba(4,8,26,.65)}
.mbox h2{font-size:18px;font-weight:650;letter-spacing:-.3px}
.field label{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--txt2)}
.field input,.field select,.field textarea{border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:14px;padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(140,168,255,.6);background:rgba(255,255,255,.08)}
.field select option{background:#1B2350}
/* Section headings in settings: sentence case, quiet */
.slabel{text-transform:none;letter-spacing:0;font-size:13px;font-weight:650;color:var(--txt);border-bottom:none;padding:14px 0 6px}
.slabel i{color:var(--accent)}
.sd-item{background:var(--bg2);border:none;border-radius:14px}
.sd-label,.stand-table th{text-transform:none;letter-spacing:0;font-size:11px}
/* Narrow screens: month cells are too small for text, so chips become
   solid colour bars (the chip's text colour is its group colour, hence
   currentColor). Tap the day for the details. */
@media(max-width:600px){
  .month-day{min-height:62px;padding:5px}
  .mday-chips{gap:3px}
  .chip{font-size:0;line-height:0;height:5px;padding:0;border:none;border-radius:var(--rp);background:currentColor!important;opacity:.85}
  .chip img{display:none}
  .mday-more{font-size:9px}
}
/* Reminder picker: toggle chips */
.rem-chips{display:flex;flex-wrap:wrap;gap:6px}
.rem-chip{position:relative;cursor:pointer}
.rem-chip input{position:absolute;opacity:0;pointer-events:none}
.rem-chip span{display:inline-block;padding:6px 12px;border-radius:var(--rp);font-size:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--txt2);transition:background .15s,border-color .15s,color .15s}
.rem-chip input:checked + span{background:rgba(140,168,255,.18);border-color:rgba(140,168,255,.6);color:var(--txt)}
.rem-chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
/* Scrollbars fade into the glass */
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
.net-pill{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
@media (prefers-reduced-motion:reduce){
  .swipe-l,.swipe-r{animation:none}
  *{transition:none!important}
}
/* ═══ Layout v2: no banner, no chat row — the calendar gets the space ═══ */
.app{position:relative}
@media(min-width:901px){
  /* Weeks stretch to fill the full calendar height instead of leaving a
     large empty area below the last row. Cells keep a sensible minimum and
     the body scrolls if a busy day needs more room. */
  .cal-body{display:flex;flex-direction:column}
  .month-grid{flex:1;min-height:100%}
  .month-week{flex:1 1 0;min-height:96px}
  .month-week .month-day{min-height:0;height:100%}
  .app{grid-template-columns:300px 1fr;grid-template-rows:118px 1fr;
       grid-template-areas:"wx cal" "lp cal"}
  /* The toolbar sits in the calendar's header row, top right. */
  #tools{position:absolute;top:21px;right:26px}
  /* Space for the floating toolbar is measured from the toolbar itself
     (see syncToolsWidth) rather than hard-coded, so adding a button can't
     make it overlap the calendar's own controls. */
  .cal-head{padding-right:calc(var(--tools-w, 300px) + 30px)}
}
@media(max-width:900px){
  /* On phones it floats over the weather panel's top-right corner. */
  #tools{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px}
  #lp{min-height:200px}
  /* A busy day scrolls inside its own frame (so the calendar stays close
     below) and opens on the event happening now — see lpAutoScroll. */
  .lp-body{max-height:min(64vh,680px);overflow-y:auto;-webkit-overflow-scrolling:touch}
}
#tools{display:flex;gap:6px;z-index:80;align-items:center}
#tools .btn.ico{width:34px;height:34px;padding:0;justify-content:center;
  background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#tools .btn.acc{height:34px;gap:5px}
#filterBtn{position:relative}
#filterBtn .fdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none;box-shadow:0 0 0 2px #0F1732}
#filterBtn.on .fdot{display:block}
/* Phone widths: labels go, every button becomes an equal round icon.
   Titles and aria-labels keep them identifiable. */
@media(max-width:700px){
  #tools{gap:4px}
  #tools .tl{display:none}
  /* Six round buttons (with the bell) must clear the temperature on the left. */
  #tools .btn{width:33px;height:33px;padding:0;justify-content:center;border-radius:var(--rp)}
  #tools .btn i{font-size:16px}
}

/* ── Assistant dialog ── */
#chatbot{position:fixed;inset:0;height:auto;z-index:420;display:none;align-items:center;justify-content:center;
  margin:0!important;border:none;border-radius:0;background:rgba(6,10,28,.55);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#chatbot.open{display:flex}
.chat-panel{width:100%;max-width:520px;height:min(620px,100%);display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass-solid);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
  border:1px solid var(--border2);border-radius:26px;box-shadow:0 40px 90px rgba(4,8,26,.65)}
.chat-head{padding:18px 20px 6px}
.chat-head h2{font-size:18px;font-weight:650;letter-spacing:-.3px}
.chat-panel .chat-msgs{flex:1;min-height:0}
.chat-foot{display:flex;gap:8px;align-items:center;padding:10px 14px 14px}

/* ── What-to-show options ── */
.vopt{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.vopt:last-child{border-bottom:none}
.vopt input{position:absolute;opacity:0;pointer-events:none}
.vopt small{color:var(--txt3);font-size:12px}
.vopt b{font-weight:600}
.vbox{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);margin-top:1px;
  display:grid;place-items:center;transition:background .15s,border-color .15s}
.vopt input:checked + .vbox{background:var(--accent);border-color:var(--accent)}
.vopt input:checked + .vbox::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.vopt input:focus-visible + .vbox{outline:2px solid var(--accent);outline-offset:2px}
.vopt.dis{opacity:.4;cursor:default}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  max-width:min(440px,calc(100% - 32px));z-index:600;padding:12px 16px;border-radius:18px;font-size:13px;
  background:var(--glass-solid);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--border2);box-shadow:0 20px 50px rgba(4,8,26,.5);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ── Time wheel ── */
.tpick{position:relative;display:flex;align-items:stretch;gap:6px;padding:0 10px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;overflow:hidden}
/* The band showing which row is selected. */
.tpick::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:44px;transform:translateY(-50%);
  border-radius:12px;background:rgba(140,168,255,.16);border:1px solid rgba(140,168,255,.4);pointer-events:none}
.tcol{flex:1;height:132px;overflow-y:auto;scroll-snap-type:y mandatory;padding:44px 0;
  scrollbar-width:none;-ms-overflow-style:none;outline:none}
.tcol::-webkit-scrollbar{display:none}
.titem{height:44px;display:grid;place-items:center;scroll-snap-align:center;cursor:pointer;
  font-size:20px;font-variant-numeric:tabular-nums;color:var(--txt3);
  transition:color .15s,transform .15s,opacity .15s}
.titem.sel{color:var(--txt);font-weight:650;transform:scale(1.08)}
.tcol:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:12px}
.tsep{align-self:center;font-size:20px;font-weight:650;color:var(--txt2);position:relative;z-index:1}
.tquick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tquick .btn{font-size:12px;padding:5px 11px}
@media (prefers-reduced-motion:reduce){ .titem{transition:none} }
/* ── Widget launcher ── */
#wdrop{position:fixed;display:none;flex-direction:column;z-index:430;width:270px;padding:6px;
  background:var(--glass-solid);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  border:1px solid var(--border2);border-radius:18px;box-shadow:0 30px 70px rgba(4,8,26,.6)}
#wdrop.open{display:flex}
.witem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border:none;border-radius:12px;
  background:transparent;color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
@media (hover:hover) and (pointer:fine){ .witem:hover{background:var(--bg3)} }
.witem:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.witem > i:first-child{color:var(--accent);font-size:17px;flex:none}
.witem span{flex:1;min-width:0;display:block}
.witem small{display:block;font-size:10px;color:var(--txt3);margin-top:1px}
.witem .wgo{font-size:13px;color:var(--txt3);flex:none}
.witem.wmanage{border-top:1px solid var(--border);border-radius:0 0 12px 12px;margin-top:4px;color:var(--txt2);font-size:12px}
.witem.wmanage > i:first-child{color:var(--txt3);font-size:15px}
.wempty{font-size:12px;color:var(--txt3);padding:12px}
/* ── Past vs upcoming ──
   Past entries recede and completed ones are struck through, so a glance at
   the month separates "done with" from "still coming". */
.chip.past{opacity:.45;filter:saturate(.45)}
.chip.done{text-decoration:line-through;opacity:.4;filter:saturate(.3)}
.month-day.past-day{background:rgba(255,255,255,.018)}
.month-day.past-day .mday-num{opacity:.45}
.month-day.past-day .mday-more{opacity:.5}
/* The colour bars on phones carry the same distinction. */
@media(max-width:600px){
  .chip.past{opacity:.35}
  .chip.done{opacity:.25}
}
.ecard.past{opacity:.62}
.ecard.past .ec-title{font-weight:500}
/* From / To rows in the event form */
.jrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.jrow .jlbl{flex:none;width:38px;font-size:11px;font-weight:600;color:var(--txt3);text-align:right}
.jrow input{flex:1;min-width:0}
/* ── Bible reading plan dialog ── */
.bib-top{display:flex;gap:8px;margin-bottom:10px}
.bib-stat{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:9px 6px;text-align:center}
.bib-stat b{display:block;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.bib-stat small{font-size:10px;color:var(--txt3)}
.bib-stat.behind b{color:var(--yellow)}
.bib-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bib-bar span{display:block;height:100%;background:linear-gradient(90deg,#8CA8FF,#a78bfa);border-radius:99px;transition:width .3s}
.bib-sub{font-size:11px;color:var(--txt3);margin:7px 0 10px}
.bib-list{overflow-y:auto;border:1px solid var(--border);border-radius:16px;padding:4px;
  max-height:min(46vh,380px);overscroll-behavior:contain}
/* The dialog itself must not scroll: header and buttons stay put and only
   the chapter list moves, so the controls never disappear off the top. */
/* Leave room for the dialog's own title and the action row beneath, or the
   Done button ends up clipped and the dialog becomes scrollable again. */
.bib-dialog{display:flex;flex-direction:column;max-height:calc(88vh - 170px)}
.bib-dialog .bib-list{flex:1 1 auto;max-height:none;min-height:130px}
/* position:relative anchors the visually-hidden checkbox to its own row.
   Without it the input resolves against a distant ancestor, and focusing it
   made the browser scroll the whole dialog to a seemingly random point
   (Chrome does this; Safari doesn't, which is why iOS looked fine). */
.bib-row{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer}
@media (hover:hover) and (pointer:fine){ .bib-row:hover{background:rgba(255,255,255,.04)} }
.bib-row input{position:absolute;opacity:0;pointer-events:none}
.bib-row .bib-main{flex:1;min-width:0}
.bib-row .bib-main b{display:block;font-size:13px;font-weight:600}
.bib-row .bib-main small{font-size:10px;color:var(--txt3)}
.bib-row.today{background:rgba(140,168,255,.12);box-shadow:inset 0 0 0 1px rgba(140,168,255,.45)}
.bib-row.today .bib-main small{color:var(--accent)}
.bib-row.future{opacity:.62}
.bib-row.behind .bib-main small{color:var(--yellow)}
.bib-row.done .bib-main b{text-decoration:line-through;opacity:.5}
.bib-row.done .bib-main small{opacity:.5}
/* The tick mark itself — the checkbox styling was scoped to the filter
   dialog, so these rows showed an empty box even when ticked. */
.bib-row .vbox{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);display:grid;place-items:center;transition:background .15s,border-color .15s}
.bib-row input:checked + .vbox{background:var(--accent);border-color:var(--accent)}
.bib-row input:checked + .vbox::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bib-row input:focus-visible + .vbox{outline:2px solid var(--accent);outline-offset:2px}
.bib-read{flex:none;color:var(--txt3);padding:4px;border-radius:8px}
@media (hover:hover) and (pointer:fine){ .bib-read:hover{color:var(--accent);background:rgba(255,255,255,.06)} }
/* Suggested-session card at the top of the reading plan */
.bib-next{background:linear-gradient(135deg,rgba(140,168,255,.18),rgba(167,139,250,.12));
  border:1px solid rgba(140,168,255,.4);border-radius:18px;padding:14px;margin-bottom:12px}
.bib-next-lbl{font-size:10px;color:var(--accent);font-weight:600;margin-bottom:3px}
.bib-next-ref{font-size:19px;font-weight:650;letter-spacing:-.3px}
.bib-next-sub{font-size:11px;color:var(--txt2);margin-top:3px}
.bib-next-acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.bib-next-acts .btn{text-decoration:none}
/* Chapters queued for this session */
.bib-row.next{background:rgba(140,168,255,.10);box-shadow:inset 0 0 0 1px rgba(140,168,255,.35)}
.bib-row.next .bib-main small{color:var(--accent)}
.bib-row.done.next{box-shadow:none}
/* Briefly ring the event a reminder was about, so it's obvious which one
   the notification referred to. */
@keyframes evFlash{0%{box-shadow:0 0 0 0 rgba(140,168,255,.65)}70%{box-shadow:0 0 0 10px rgba(140,168,255,0)}100%{box-shadow:0 0 0 0 rgba(140,168,255,0)}}
.ecard.flash{animation:evFlash 1.3s ease-out 2;border-color:rgba(140,168,255,.75)}
@media (prefers-reduced-motion:reduce){ .ecard.flash{animation:none;border-color:rgba(140,168,255,.75)} }
/* ── Life timer ── */
.tmr-tabs{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.05);padding:4px;border-radius:var(--rp)}
.tmr-tab{flex:1;border:none;background:transparent;color:var(--txt2);font:inherit;font-size:12px;font-weight:600;
  padding:7px 10px;border-radius:var(--rp);cursor:pointer}
.tmr-tab.on{background:var(--accent);color:var(--accent-ink)}
.tmr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tmr-grid.four{grid-template-columns:repeat(4,1fr)}
.tmr-cell{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:16px;padding:12px 6px;text-align:center}
/* Big totals (seconds runs to ten digits) must shrink rather than spill. */
.tmr-cell b{display:block;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  font-size:20px;line-height:1.15;white-space:nowrap}
.tmr-cell b.sm{font-size:16px;letter-spacing:-.3px}
.tmr-cell b.xs{font-size:13px;letter-spacing:-.2px}
.tmr-cell small{font-size:10px;color:var(--txt3)}
.tmr-grid.four .tmr-cell b{font-size:22px}
.tmr-age{text-align:center;margin:4px 0 10px}
.tmr-age b{display:block;font-size:54px;font-weight:650;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,#8CA8FF,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tmr-age span{font-size:12px;color:var(--txt3)}
.tmr-sub{font-size:11px;color:var(--txt3);margin-bottom:7px;text-align:center}
.tmr-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.tmr-bar span{display:block;height:100%;background:linear-gradient(90deg,#8CA8FF,#a78bfa);border-radius:99px;transition:width .5s}
.tmr-note{font-size:11px;color:var(--txt3);margin-top:9px;text-align:center;line-height:1.5}
.tmr-born{font-size:10px;color:var(--txt3);margin-top:12px;text-align:center;padding-top:10px;border-top:1px solid var(--border)}
@media(max-width:420px){ .tmr-grid.four{grid-template-columns:repeat(2,1fr)} }
/* ── Giving tracker ── */
.tithe-dialog{display:flex;flex-direction:column;max-height:calc(88vh - 170px)}
.th-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.th-nav b{font-size:14px;font-weight:650}
.th-head{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px}
.th-due{text-align:center;margin-bottom:10px}
.th-due small{font-size:10px;color:var(--txt3);display:block}
.th-due b{display:block;font-size:30px;font-weight:650;letter-spacing:-1px;
  background:linear-gradient(135deg,#8CA8FF,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.th-due.done b{background:linear-gradient(135deg,#34d399,#8CA8FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:40px}
.th-due.ahead b{background:linear-gradient(135deg,#34d399,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.th-line.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-weight:600}
.th-line.total.owe b{color:var(--yellow)}
.th-line.total.ahead b{color:#34d399}
.th-due span{font-size:11px;color:var(--txt3)}
.th-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:10px}
.th-bar span{display:block;height:100%;background:linear-gradient(90deg,#34d399,#8CA8FF);border-radius:99px;transition:width .4s}
.th-line{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--txt2)}
.th-line b{font-variant-numeric:tabular-nums;color:var(--txt)}
.th-line.owe b{color:var(--yellow)}
.th-carry{font-size:10px;color:var(--txt3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);text-align:center}
.th-add{display:grid;grid-template-columns:1.1fr 1.4fr 1.1fr;gap:6px}
.th-add input{font-size:13px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);width:100%}
.th-btns{display:flex;gap:6px;margin-top:6px}
.th-btns .btn{flex:1;justify-content:center}
.th-list{margin-top:10px;overflow-y:auto;flex:1 1 auto;min-height:90px;overscroll-behavior:contain}
.th-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.th-row:last-child{border-bottom:none}
.th-row > i:first-child{font-size:15px;flex:none;color:var(--txt3)}
.th-row.income > i:first-child{color:#34d399}
.th-row.given > i:first-child{color:#a78bfa}
.th-main{flex:1;min-width:0}
.th-main b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.th-main small{font-size:10px;color:var(--txt3)}
.th-empty{font-size:12px;color:var(--txt3);text-align:center;padding:16px 0}
@media(max-width:420px){ .th-add{grid-template-columns:1fr 1fr} .th-add #thNote{grid-column:1/-1} }
/* ══ Personal vs sport events ══
   Two different objects deserve two different shapes. Personal events stay
   as solid cards with a group-coloured spine. Sport reads like a ticket:
   tinted, lighter, with a perforated edge — recognisable at a glance from
   across the day list without relying on colour alone. */
/* Personal tasks/events: "ivory paper" — cream cards with dark ink and a
   serif title, so they read as calm personal notes and never blend in with
   the cool blue sport tickets. Text colours are set by redefining the
   colour variables inside the card, which also recolours the inline
   time / repeat labels that use var(--txt3). */
.ecard.task{--txt:#2B2733;--txt2:#6E6878;--txt3:#8F889A;--border:rgba(43,39,51,.10);--border2:rgba(43,39,51,.16);
  background:linear-gradient(180deg,#F6F1E8,#EFE8DC);border:1px solid rgba(255,255,255,.6);color:var(--txt);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.7) inset;padding:16px 16px 14px}
.ecard.task .ec-title{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-weight:600;font-size:17px;letter-spacing:0;color:var(--txt)}
.ecard.task .ec-meta > span:nth-child(2){color:var(--txt)!important;font-weight:600}
.ecard.task .ea{background:rgba(43,39,51,.04);color:var(--txt2);border:1px solid rgba(43,39,51,.10)}
@media (hover:hover) and (pointer:fine){ .ecard.task .ea:hover{background:rgba(43,39,51,.09);color:var(--txt)} }
.ecard.task .plabel.normal{background:rgba(43,39,51,.07);color:#5E586A}
.ecard.task .rem-badge{background:rgba(124,92,214,.10)!important;color:#6B4FC8!important;border-color:rgba(124,92,214,.22)!important}
.ecard.task.done{opacity:.55}
.chip.task{background:#EFE8DC!important;color:#3A3542!important;border-color:transparent!important;font-weight:600}
.ecard.task.past{opacity:.72}
@media (hover:hover) and (pointer:fine){ .ecard.task:hover{border-color:rgba(255,255,255,.8)} }

.ecard.sport{
  position:relative;
  background:
    linear-gradient(135deg, rgba(140,168,255,.10), rgba(167,139,250,.05) 55%, rgba(255,255,255,.02));
  border:1px solid rgba(140,168,255,.20);
  padding-left:20px;
}
/* Perforated spine, like a torn ticket stub. */
.ecard.sport::before{
  content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;border-radius:99px;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.34) 0 4px, transparent 4px 9px);
}
.ecard.sport .ec-bar{display:none}
.ecard.sport .ec-title{font-weight:650;letter-spacing:-.2px}
.ecard.sport .ec-meta{opacity:.95}
.ecard.sport .ea{background:rgba(255,255,255,.06)}
/* The sport name reads as a small pill rather than loose text. */
.ecard.sport .ec-meta > span:first-child{
  background:rgba(255,255,255,.08);border-radius:99px;padding:1px 7px;font-weight:600}
@media (hover:hover) and (pointer:fine){ .ecard.sport:hover{border-color:rgba(140,168,255,.34)} }
@media (prefers-reduced-motion:no-preference){ .ecard.sport{transition:border-color .15s} }
/* Kickoff time: the one place a sport card states when it starts. */
.ec-kick{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ecard.sport .ec-meta{gap:7px;align-items:baseline}

/* ══ Feel & polish (Emil Kowalski design-engineering + mobile-native rules) ══
   Small invisible details that make the PWA feel like an installed app. */
:root{
  --ease-out:cubic-bezier(0.23,1,0.32,1);       /* strong ease-out for UI */
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);   /* on-screen movement */
}
/* No grey flash over tapped elements on iPhone/Android; every tappable
   thing below gets its own press state instead. */
html{-webkit-tap-highlight-color:transparent}
/* Pop-ups size to the *visible* screen (keyboard, home indicator), not the
   largest possible viewport. The vh value stays as the fallback. */
@supports (height:100dvh){ .mbox{max-height:88dvh} }
/* Dialog layout: the title and the buttons stay in place and only the
   middle scrolls, so Done is always in reach. The backdrop never scrolls. */
.mbg{overscroll-behavior:none}
.mbox{display:flex;flex-direction:column;overflow:hidden}
.mbox > h2,.mbox > .macts{flex:none}
#mBody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;touch-action:pan-y;margin:0 -22px;padding:0 22px}
/* iOS zooms the page into any text box under 16px. Pinch-zoom is allowed
   again, so the boxes are 16px on touch screens instead. */
@media (pointer:coarse){
  input,textarea,select,.field input,.field select,.field textarea,.th-add input,.wx-loc-bar input{font-size:16px!important}
}
/* Controls: instant response, no double-tap delay, no long-press text
   selection or callout on button labels. */
button,.btn,.ea,.chat-send,.chip,.month-day,.rem-chip span,.witem,.bib-read,.vopt,.titem{
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Press feedback: buttons give a little as your finger lands, so the app
   feels like it heard you before you let go. */
.btn,.ea,.chat-send,.bib-read{
  transition:transform 140ms var(--ease-out),background-color 150ms ease,color 150ms ease,border-color 150ms ease}
.btn:active,.ea:active,.bib-read:active{transform:scale(0.97)}
.chat-send:active{transform:scale(0.94)}
.month-day{transition:transform 140ms var(--ease-out),border-color 150ms ease,background-color 150ms ease}
.month-day:active{transform:scale(0.98)}
.ecard.sport[onclick]{transition:transform 160ms var(--ease-out),border-color 150ms ease}
.ecard.sport[onclick]:active{transform:scale(0.99)}
/* Modals ease in instead of popping: scale from 0.96 (never from 0) plus a
   fade, centred because a modal isn't anchored to its trigger. */
@keyframes mbgIn{from{opacity:0}to{opacity:1}}
@keyframes mboxIn{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:none}}
.mbg.open{animation:mbgIn 180ms ease-out}
.mbg.open .mbox{animation:mboxIn 240ms var(--ease-out)}
/* Toast and day-swipe use the stronger curve too. */
#toast{transition:opacity 200ms var(--ease-out),transform 260ms var(--ease-out)}
.swipe-l{animation:slideL 220ms var(--ease-out)}
.swipe-r{animation:slideR 220ms var(--ease-out)}
/* Personal cards: a soft layered shadow carries the depth instead of a
   hard outline. */
.ecard.task{border-color:rgba(255,255,255,.55);
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 24px -12px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.7) inset}
/* Reduced motion: keep fades, drop movement and scaling. */
@media (prefers-reduced-motion:reduce){
  .btn:active,.ea:active,.bib-read:active,.chat-send:active,.month-day:active,.ecard.sport[onclick]:active{transform:none}
  .mbg.open .mbox{animation:mbgIn 180ms ease-out}
}

/* ══ Readability pass (from the Impeccable design checker) ══
   Contrast to WCAG AA (4.5:1) and an 11px floor for functional text. */
/* Faint grey secondary text was ~3.6:1 on the dark panels. */
:root{--txt3:#929DC2}
.month-day.past-day .mday-num{opacity:.62}
/* Group name on the cream cards: the group's own colour mixed darker, so
   "Work" in light green no longer disappears into the paper (was 1.7:1).
   The coloured spine keeps the original colour. */
.ecard.task .grp-name{color:var(--txt2)!important}
@supports (color:color-mix(in srgb,red 50%,blue)){
  .ecard.task .grp-name{color:color-mix(in srgb,var(--gc) 42%,#201c26)!important}
}
/* Priority, reminder and button labels in ink tones that hold up on cream. */
.ecard.task .plabel.normal{color:#4E4859}
.ecard.task .plabel.low{background:rgba(43,39,51,.07);color:#4E4859}
.ecard.task .plabel.high{background:rgba(234,88,12,.12);color:#9A3412}
.ecard.task .plabel.very{background:rgba(220,38,38,.12);color:#991B1B}
.ecard.task .rem-badge{color:#5B3FB8!important;background:rgba(91,63,184,.09)!important;border-color:rgba(91,63,184,.22)!important}
.ecard.task .ea{color:#5E586A}
/* Sport labels in the month view: lightened toward white (was 3.3:1). */
@supports (color:color-mix(in srgb,red 50%,blue)){
  .chip.sport{color:color-mix(in srgb,var(--c) 62%,#fff)!important}
}
/* Nothing functional below 11px. */
.grp-name,.rem-badge,.plabel,.ecard.sport .ec-meta > span:first-child{font-size:11px!important}
.rem-badge i{font-size:11px!important}
.wx-hint{font-size:11px}
#wxLoc{font-size:12px}
@media (min-width:601px){ .chip{font-size:11px} }

/* ══ Private settings ══ */
.priv-head{color:var(--txt)}
.priv-box{border:1px solid var(--border);border-radius:16px;padding:12px;background:rgba(255,255,255,.03)}
.priv-lead{font-size:12px;color:var(--txt2);margin-bottom:8px;line-height:1.5}
.priv-msg{font-size:12px;margin-top:8px}
.priv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--green)}
.priv-box > input,.priv-box > div > input{width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.priv-box > input:focus,.priv-box > div > input:focus{border-color:var(--accent)}
/* ══ Route map ══ */
.map-ov{z-index:500}
.map-box{width:640px;max-width:100%;padding:14px;display:flex;flex-direction:column;gap:10px}
.map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.map-head b{font-size:16px;font-weight:650}
.map-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.rmap{height:min(56vh,420px);min-height:240px;border-radius:14px;overflow:hidden;background:#0d1224;position:relative}
.rmap-wait{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--txt2);padding:16px;text-align:center}
.rinfo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rstat{font-size:12px;color:var(--txt2);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:99px;padding:4px 10px}
.rstat b{color:var(--txt);font-weight:650}
.rstat.lv{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:#fbbf24}
.rstat.lv b{color:#fcd34d}
.rnote{flex-basis:100%;font-size:12px;color:var(--txt2);line-height:1.5}
.racts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.racts a.btn{text-decoration:none}
.map-inline{margin-left:4px;vertical-align:middle}
.leaflet-container{font-family:inherit;background:#0d1224}
.leaflet-control-attribution{font-size:10px}

/* ══ Full event titles ══ Long names wrap onto a second line instead of
   being cut off with "…"; personal titles are a touch smaller to fit. */
.ec-title{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.25}
.ecard.task .ec-title{font-size:15.5px;line-height:1.28;text-wrap:pretty}

/* Day heading can be longer now ("14 Oct - Wednesday"): never push the
   date arrows off the row. */
.lp-head h2{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}

/* Light OpenStreetMap tiles (no CARTO key): keep the markers readable. */
.rmap.rmap-light{background:#e9e5dc}

/* ══ Concerts widget ══ */
.cc-body{font-size:13px}
.cc-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#fbbf24;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.cc-msg{font-size:12px;margin:0 0 10px;color:var(--txt2)}
.cc-input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:14px;outline:none}
.cc-input:focus{border-color:var(--accent)}
.cc-results{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cc-res{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04)}
.cc-res img,.cc-noimg{width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--txt3)}
.cc-res-main{flex:1;min-width:0;display:flex;flex-direction:column}
.cc-res-main b{font-weight:600}
.cc-res-main small{font-size:11px;color:var(--txt3)}
.cc-chips{display:flex;flex-wrap:wrap;gap:6px}
.cc-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 4px;border-radius:99px;background:rgba(244,114,182,.12);border:1px solid rgba(244,114,182,.3);color:#fbcfe8;font-size:12px}
.cc-chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.cc-chip > .ti{width:22px;text-align:center}
.cc-chip button{border:none;background:rgba(255,255,255,.08);color:inherit;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:12px}
.cc-empty{font-size:12px;color:var(--txt3);padding:6px 0}
.cc-sub{font-weight:400;color:var(--txt3);font-size:11px;margin-left:6px}
.cc-month{font-size:11px;font-weight:650;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
.cc-row{display:flex;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:6px}
.cc-row.in{border-color:rgba(244,114,182,.4);background:rgba(244,114,182,.07)}
.cc-date{width:42px;flex-shrink:0;text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:2px}
.cc-date b{font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cc-date span{font-size:11px;color:var(--txt3);margin-top:3px}
.cc-main{flex:1;min-width:0}
.cc-artist{font-weight:650}
.cc-where{font-size:12px;color:var(--txt2);margin-top:1px}
.cc-when{font-size:11px;color:var(--txt3);margin-top:1px}
.cc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.cc-acts a.btn{text-decoration:none}
.cc-incal{font-size:11px;color:#f9a8d4;display:inline-flex;align-items:center;gap:3px}
.cc-foot{font-size:11px;color:var(--txt3);margin-top:12px;line-height:1.5}
/* Concert events in the calendar: the cream personal card with a music
   accent, so they're recognisable at a glance. */
.ecard.task.concert{background:linear-gradient(180deg,#F8EEF2,#F0E3E8)}

/* Longer reminders: "Earlier: [2] [days] + Add" under the reminder chips. */
.rem-add{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.rem-add-l{font-size:12px;color:var(--txt2)}
.rem-add select{width:auto;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit}

/* ══ Widgets launcher (tile panel) ══ */
#wdrop{width:min(372px,calc(100vw - 16px));padding:12px;gap:0;max-height:min(80vh,640px);overflow-y:auto;overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){
  #wdrop.open{animation:wdropIn 200ms var(--ease-out)}
  @keyframes wdropIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
}
.wpanel-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.wpanel-head b{font-size:16px;font-weight:650;letter-spacing:-.2px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px;border-radius:16px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--wt) 26%,transparent);color:var(--txt);font:inherit;min-height:104px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--wt) 16%,transparent),rgba(255,255,255,.02) 70%);
  transition:transform 140ms var(--ease-out),border-color 150ms ease,background-color 150ms ease}
.wtile:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .wtile:hover{border-color:color-mix(in srgb,var(--wt) 50%,transparent)} }
.wtile:focus-visible{outline:2px solid var(--wt);outline-offset:2px}
.wtile-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:color-mix(in srgb,var(--wt) 22%,transparent);color:var(--wt)}
.wtile b{font-size:13px;font-weight:650;line-height:1.25}
.wtile small{font-size:11px;color:var(--txt2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wsec{font-size:11px;font-weight:650;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 6px}
.wlinks{display:flex;flex-direction:column;gap:2px}
.wlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border:none;border-radius:12px;background:transparent;color:var(--txt);font:inherit;cursor:pointer;
  transition:background-color 150ms ease,transform 140ms var(--ease-out)}
.wlink:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){ .wlink:hover{background:var(--bg3)} }
.wlink-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--txt2);font-size:15px;flex:none}
.wlink-t{flex:1;min-width:0}
.wlink-t b{font-size:13px;font-weight:600;display:block}
.wlink-t small{font-size:11px;color:var(--txt3)}
.wlink .wgo{color:var(--txt3);font-size:14px}
/* ══ World clocks ══ */
.clk-body{display:flex;flex-direction:column;gap:8px}
.clk-card{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l t" "w a";gap:4px 10px;align-items:center;padding:12px 14px;border-radius:16px;
  background:linear-gradient(160deg,rgba(251,191,36,.10),rgba(255,255,255,.02) 70%);border:1px solid rgba(251,191,36,.18)}
.clk-left{grid-area:l;min-width:0}
.clk-city{font-weight:650;font-size:15px}
.clk-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.clk-time{grid-area:t;font-size:30px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.clk-wx{grid-area:w;display:flex;align-items:baseline;gap:8px}
.clk-temp{font-size:15px;font-weight:600}
.clk-hilo{font-size:12px;color:var(--txt3)}
.clk-acts{grid-area:a;display:flex;gap:4px;justify-content:flex-end}
.clk-acts a.btn{text-decoration:none}
.clk-res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;border:none;background:rgba(255,255,255,.04);color:var(--txt);font:inherit;cursor:pointer}
.clk-res-t{flex:1;min-width:0;display:flex;flex-direction:column}
.clk-res-t small{font-size:11px;color:var(--txt3)}
/* ══ Public holidays ══ */
.hol-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.hol-years{display:inline-flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.hol-yr{border:none;background:transparent;color:var(--txt2);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;cursor:pointer}
.hol-yr.on{background:var(--accent);color:var(--accent-ink)}
.hol-bar select{width:auto;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit}
.hol-body{display:flex;flex-direction:column;gap:6px}
.hol-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.hol-row.next{background:linear-gradient(160deg,rgba(251,113,133,.14),rgba(255,255,255,.02) 70%);border-color:rgba(251,113,133,.35)}
.hol-row.past{opacity:.55}
.hol-date{width:40px;flex:none;text-align:center;display:flex;flex-direction:column}
.hol-date b{font-size:19px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hol-date span{font-size:11px;color:var(--txt3);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.hol-main{flex:1;min-width:0}
.hol-name{font-weight:600;font-size:14px}
.hol-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.hol-busy{color:#fda4af}
@media (max-width:420px){ .hol-row .btn{padding:6px 10px} }

@media (max-width:600px){ #wdrop{width:auto} }
.hol-body .hol-row.past{display:none}
.hol-body.show-past .hol-row.past{display:flex}
.hol-more{border:none;background:transparent;color:var(--accent);font:inherit;font-size:12px;font-weight:600;padding:4px 2px 8px;text-align:left;cursor:pointer}

/* ══ Shopping list ══ */
.sh-add{display:flex;gap:6px;margin-bottom:10px}
.sh-add .btn{width:46px;justify-content:center;font-size:18px}
.sh-body{display:flex;flex-direction:column}
.sh-usual{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:center}
.sh-usual::-webkit-scrollbar{display:none}
.sh-usual-l{font-size:11px;color:var(--txt3);font-weight:650;text-transform:uppercase;letter-spacing:.5px;flex:none;margin-right:2px}
.sh-chip{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:99px;border:1px solid rgba(74,222,128,.28);background:rgba(74,222,128,.08);color:#bbf7d0;font:inherit;font-size:13px;cursor:pointer;
  transition:transform 140ms var(--ease-out)}
.sh-chip:active{transform:scale(.95)}
.sh-chip i{font-size:12px;opacity:.7}
.sh-prog{margin:2px 0 10px}
.sh-prog-t{font-size:13px;color:var(--txt2);margin-bottom:6px}
.sh-prog-t b{color:var(--txt);font-size:15px}
.sh-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.sh-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4ade80,#a3e635);transition:width 300ms var(--ease-out)}
.sh-trip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px dashed rgba(74,222,128,.35);background:transparent;color:var(--txt);font:inherit;cursor:pointer;margin-bottom:12px}
.sh-trip > .ti:first-child{font-size:20px;color:#4ade80}
.sh-trip.on{border-style:solid;background:rgba(74,222,128,.08)}
.sh-trip-t{flex:1;min-width:0;display:flex;flex-direction:column}
.sh-trip-t b{font-size:13px;font-weight:650}
.sh-trip-t small{font-size:11px;color:var(--txt3)}
.sh-plan{padding:12px;border-radius:14px;border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.06);margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.sh-plan-days{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sh-plan-days .hol-yr{background:rgba(255,255,255,.06)}
.sh-plan-days .hol-yr.on{background:#4ade80;color:#052e16}
.sh-plan input[type=date],.sh-plan input[type=time]{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit;color-scheme:dark}
.sh-plan-row{display:flex;gap:6px}
.sh-plan-row .cc-input{flex:1}
.sh-plan-acts{display:flex;gap:6px;align-items:center}
.sh-empty{font-size:13px;color:var(--txt2);text-align:center;padding:18px 8px}
.sh-aisle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin:12px 2px 6px}
.sh-aisle small{font-weight:600;color:var(--txt3);letter-spacing:0}
.sh-aisle .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.sh-cart-h{margin-top:18px}
.sh-row{display:flex;flex-wrap:wrap;align-items:center;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--border);margin-bottom:6px;overflow:hidden}
.sh-check{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:var(--txt);font:inherit;text-align:left;cursor:pointer;
  transition:transform 140ms var(--ease-out)}
.sh-check:active{transform:scale(.985)}
.sh-box{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid rgba(74,222,128,.55);display:grid;place-items:center;color:#052e16;font-size:15px;
  transition:background-color 160ms ease,border-color 160ms ease}
.sh-row.done .sh-box{background:#4ade80;border-color:#4ade80}
.sh-name{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.sh-qty{flex:none;font-size:12px;font-weight:600;color:#bbf7d0;background:rgba(74,222,128,.12);border-radius:99px;padding:2px 8px}
.sh-row.done{background:transparent;border-style:dashed}
.sh-row.done .sh-name{text-decoration:line-through;color:var(--txt3)}
.sh-row.done .sh-qty{opacity:.5}
.sh-more{flex:none;width:42px;align-self:stretch;border:none;background:transparent;color:var(--txt3);font-size:18px;cursor:pointer}
.sh-edit{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.sh-edit .cc-input{flex:1 1 120px}
.sh-edit select{flex:1 1 140px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit}
.sh-edit-acts{flex-basis:100%;display:flex;justify-content:space-between;gap:6px}
@media (prefers-reduced-motion:reduce){ .sh-bar span{transition:none} }

/* ══ Overdue ══ An unfinished task whose time has passed stays at full
   strength (only Done fades) and says so: a red-ink pill and a warm edge. */
.ecard.task.overdue{opacity:1;border-color:rgba(220,38,38,.38);
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 24px -12px rgba(0,0,0,.55),0 0 0 1px rgba(220,38,38,.18) inset}
.ecard.task.overdue .ec-title{font-weight:650}
.od-pill{display:inline-flex;align-items:center;gap:3px;font-size:11px!important;font-weight:650;color:#B91C1C;
  background:rgba(220,38,38,.10);border:1px solid rgba(220,38,38,.28);border-radius:99px;padding:1px 8px}
.od-pill i{font-size:12px}
.chip.task.overdue{box-shadow:inset 3px 0 0 #ef4444}
@media (max-width:600px){ .chip.task.overdue{background:#ef4444!important} }

/* Shopping: one tab per list, store shown on the trip. */
.sh-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sh-tabs::-webkit-scrollbar{display:none}
.sh-tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--txt2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:transform 140ms var(--ease-out)}
.sh-tab:active{transform:scale(.96)}
.sh-tab b{font-size:11px;min-width:18px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--txt);text-align:center}
.sh-tab.on{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.45);color:#dcfce7}
.sh-tab.on b{background:#4ade80;color:#052e16}
.sh-tab-new{border-style:dashed;color:#86efac}
.sh-store{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#bbf7d0;margin:1px 0}
.sh-del{margin:16px auto 2px;display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--txt3);font:inherit;font-size:12px;cursor:pointer;padding:6px 10px;border-radius:99px}
.sh-del.sure{color:#fca5a5;background:rgba(248,113,113,.1)}

/* ══ Currency ══ */
.fx-conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:14px;border-radius:18px;
  background:linear-gradient(160deg,rgba(34,211,238,.12),rgba(255,255,255,.02) 70%);border:1px solid rgba(34,211,238,.25)}
.fx-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.fx-amt,.fx-out{width:100%;font-size:26px;font-weight:650;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--txt);
  background:transparent;border:none;border-bottom:1px solid rgba(34,211,238,.35);padding:2px 0 4px;outline:none;font-family:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-amt:focus{border-bottom-color:#22d3ee}
.fx-out{color:#a5f3fc}
.fx-sel{width:100%;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt);font-family:inherit;font-size:13px}
.fx-swap{width:42px;height:42px;border-radius:50%;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.12);color:#22d3ee;font-size:20px;
  display:grid;place-items:center;cursor:pointer;transition:transform 200ms var(--ease-out)}
.fx-swap:active{transform:scale(.92) rotate(180deg)}
.fx-line{font-size:13px;color:var(--txt2);margin:10px 2px 0}
.fx-line b{color:var(--txt);font-variant-numeric:tabular-nums}
.fx-trend{margin-top:14px}
.fx-trend-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--txt2);margin-bottom:6px;flex-wrap:wrap}
.fx-ch{font-weight:650;font-variant-numeric:tabular-nums;color:var(--txt2)}
.fx-ch.up{color:#4ade80}.fx-ch.down{color:#fca5a5}
.fx-chart{position:relative;height:84px;border-radius:12px;background:rgba(255,255,255,.03);touch-action:pan-y}
.fx-chart svg{width:100%;height:100%;display:block}
.fx-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--glass-solid);border:1px solid var(--border2);border-radius:10px;
  padding:4px 8px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.fx-tip b{font-variant-numeric:tabular-nums}
.fx-tip span{color:var(--txt3);margin-left:6px}
.fx-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin-top:4px;font-variant-numeric:tabular-nums}
.fx-pairs{display:flex;flex-wrap:wrap;gap:6px}
.fx-chip{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.07);color:#cffafe}
.fx-chip b{font-weight:650;margin-left:2px;font-variant-numeric:tabular-nums}
@media (max-width:420px){ .fx-amt,.fx-out{font-size:22px} }
@media (prefers-reduced-motion:reduce){ .fx-swap:active{transform:none} }

.fx-sel{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
/* Dropdown lists: Windows draws the open list with a white background but
   kept our light text, so options were nearly invisible. Give every list a
   dark background and clear text; group headings in the accent colour. */
select{color-scheme:dark}
select option{background:#1B2350;color:#E8ECF8;font-weight:500}
select optgroup{background:#121935;color:#7DD3FC;font-weight:700;font-style:normal}
select option:checked{background:#2E3A78;color:#fff}
.fx-name{display:none} /* the name is now inside the picker itself */
/* Pop-overs that sit on top of the page (7-day forecast, widgets) are solid:
   where the browser can't blur what's behind (some Android browsers), the
   see-through glass let the day's events show through the forecast. */
.wx-drop,#wdrop{background:#182148;-webkit-backdrop-filter:none;backdrop-filter:none}
/* On phones the forecast fits the screen, so Go and the close button stay visible. */
@media (max-width:600px){ .wx-drop{left:8px;right:8px;width:auto;max-width:none} }
.wx-loc-bar input{min-width:0;width:0}
.wx-loc-bar button{flex:none}
/* Forecast details */
.wx-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 14px 4px}
.wx-stat{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);min-width:0}
.wx-stat i{font-size:15px;color:var(--accent)}
.wx-stat span{font-size:11px;color:var(--txt2)}
.wx-stat b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.wx-stat small{font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-hours-h{padding:10px 14px 0;font-size:12px;font-weight:650;color:var(--txt2)}
.wx-hours-h i{color:var(--accent)}
.wx-hours{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.wx-hours::-webkit-scrollbar{display:none}
.wx-hour{flex:none;width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;background:rgba(255,255,255,.04)}
.wx-hour.now{background:rgba(140,168,255,.16);box-shadow:inset 0 0 0 1px rgba(140,168,255,.45)}
.wx-hour span{font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums}
.wx-hour i{font-size:19px}
.wx-hour b{font-size:13px}
.wx-hour small{font-size:10.5px;color:#93c5fd}
.wx-hour small.dry{visibility:hidden}
.wx-hsep{flex:none;align-self:stretch;display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:650;color:var(--txt2);padding:0 2px;border-left:1px dashed var(--border2)}
.wx-day{cursor:pointer;transition:transform 140ms var(--ease-out),background-color 150ms ease,box-shadow 150ms ease}
.wx-day:active{transform:scale(0.97)}
.wx-day.on{background:rgba(140,168,255,.16);box-shadow:inset 0 0 0 1px rgba(140,168,255,.5)}
@media (max-width:380px){ .wx-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* Weather chip on event cards (ivory cards, so darker ink) */
.ev-wx{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#3A3542;padding:1px 8px;border-radius:99px;
  background:rgba(43,39,51,.06);border:1px solid rgba(43,39,51,.10);font-variant-numeric:tabular-nums}
.ev-wx i{font-size:14px}
.ev-wx.wet{background:rgba(37,99,235,.10);border-color:rgba(37,99,235,.28)}
.ev-wx b{font-weight:650;color:#1d4ed8;margin-left:2px}
/* Sun (or moon) behind a cloud: "partly sunny" */
.wxi2{position:relative;display:inline-block;width:1.2em;height:1em;vertical-align:middle;line-height:1}
.wxi2 i{position:absolute;line-height:1}
.wxi2 .a{right:0;top:-.08em;font-size:.74em}
.wxi2 .b{left:0;bottom:0;font-size:.86em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.ev-wx .wxi2{font-size:14px}
.wx-hour .wxi2{font-size:21px}
.wx-day-i .wxi2{font-size:22px}
.wx-icon{display:flex;align-items:center}
/* A done task looks the same whether its time has passed or not (the
   "past" dimming used to override "done", so earlier ones looked lighter). */
.ecard.task.done,.ecard.task.done.past{opacity:.62}
.ecard.sport.done,.ecard.sport.done.past{opacity:.62}
/* Smart plugs */
.pl-sum{font-size:12.5px;color:var(--txt2);margin-bottom:8px}
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-card{position:relative;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--border);transition:background-color 200ms ease,border-color 200ms ease}
.pl-card.on{background:linear-gradient(160deg,rgba(163,230,53,.22),rgba(163,230,53,.06));border-color:rgba(163,230,53,.55)}
.pl-card.offline{opacity:.55}
.pl-card.armed{border-color:#f87171;background:rgba(248,113,113,.12)}
.pl-main{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border:0;background:transparent;color:var(--txt);font-family:inherit;text-align:left;cursor:pointer;min-height:118px;border-radius:20px;transition:transform 140ms var(--ease-out)}
.pl-main:active:not(:disabled){transform:scale(0.97)}
.pl-main:disabled{cursor:default}
.pl-ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);font-size:22px;color:var(--txt2);margin-bottom:6px;transition:background-color 200ms ease,color 200ms ease}
.pl-card.on .pl-ic{background:#a3e635;color:#1a2e05}
.pl-main b{font-size:15px;font-weight:650}
.pl-sub{font-size:12px;color:var(--txt2)}
.pl-card.on .pl-sub{color:#d9f99d}
.pl-timer{font-size:11.5px;color:#fbbf24;margin-top:2px}
.pl-sw{position:absolute;top:16px;right:14px;width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.14);transition:background-color 200ms ease}
.pl-sw span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 200ms var(--ease-out)}
.pl-card.on .pl-sw{background:#65a30d}
.pl-card.on .pl-sw span{transform:translateX(16px)}
.pl-clock{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--txt2);font-size:17px;cursor:pointer;touch-action:manipulation}
.pl-warn{grid-column:1/-1;font-size:12px;color:#fecaca;padding:0 14px 12px}
.pl-card.armed .pl-clock{display:none}
.pl-card.armed .pl-main{min-height:0;padding-bottom:6px}
.pl-tm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 12px;font-size:12px;color:var(--txt2)}
.pl-tm span{flex-basis:100%}
.pl-setup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 8px}
.pl-setup > i{font-size:34px;color:#a3e635}
.pl-setup b{font-size:16px}
.pl-setup span{font-size:12.5px;color:var(--txt2);max-width:300px}
.pl-setup ol{text-align:left;font-size:12.5px;color:var(--txt2);margin:4px 0 8px 18px;padding:0;line-height:1.55}
.pl-rules{display:flex;flex-direction:column;gap:6px}
.pl-rule{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.pl-rule.off{opacity:.55}
.pl-rule b{font-size:15px;font-variant-numeric:tabular-nums}
.pl-rule span{flex:1;font-size:12.5px;color:var(--txt2);min-width:0}
.pl-x{flex:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--txt2);cursor:pointer}
.pl-add{margin-top:10px}
