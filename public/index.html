<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Personal Organizer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0a0d14;--bg1:#111520;--bg2:#181d2e;--bg3:#1f2540;
  --border:#2a3050;--border2:#374068;
  --txt:#e2e8f8;--txt2:#7d8ab0;--txt3:#3d4870;
  --accent:#4f8ef7;--accent2:#7c3aed;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;--pink:#e879a0;
  --r:8px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
.app{display:grid;height:100vh;
  grid-template-rows:64px 1fr 200px;
  grid-template-columns:280px 1fr;
  grid-template-areas:"wx top top""lp cal cal""bot bot bot";
}
@media(max-width:900px){
  .app{display:flex;flex-direction:column;height:auto}
  html,body{overflow:auto}
  #chatbot{height:240px}
}
/* TOP */
#wx{grid-area:wx;background:var(--bg1);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px 14px;cursor:pointer;position:relative;z-index:60;display:flex;flex-direction:column;justify-content:space-between}
#topbar{grid-area:top;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px}
#topbar h1{font-size:15px;font-weight:700;flex:1;text-align:center;background:linear-gradient(90deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#cr{display:none}
/* WEATHER */
.wx-main{display:flex;align-items:center;gap:10px}
.wx-icon{font-size:36px;line-height:1}
.wx-data{display:flex;flex-direction:column;gap:1px}
.wx-temp{font-size:26px;font-weight:700;line-height:1;letter-spacing:-1px}
.wx-mm{font-size:11px;color:var(--txt2)}
.wx-cond{font-size:11px;color:var(--txt2)}
.wx-loc-row{font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:3px;margin-top:2px}
.wx-hint{font-size:9px;color:var(--txt3);text-align:center}
.wx-drop{display:none;position:absolute;top:100%;left:0;width:340px;background:var(--bg1);border:1px solid var(--border2);border-radius:0 0 var(--rl) var(--rl);z-index:200;box-shadow:0 20px 60px #000a}
.wx-drop.open{display:block}
.wx-drop-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.wx-drop-head h3{font-size:13px;font-weight:600}
.wx-loc-bar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border)}
.wx-loc-bar input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;color:var(--txt);font-size:12px;font-family:inherit;outline:none}
.wx-days{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
.wx-day{flex-shrink:0;width:66px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 5px;text-align:center}
.wx-day-n{font-size:10px;color:var(--txt2);font-weight:600;margin-bottom:4px}
.wx-day-i{font-size:20px;margin-bottom:3px}
.wx-day-h{font-size:13px;font-weight:700}
.wx-day-l{font-size:10px;color:var(--txt2)}
.wx-day-r{font-size:9px;color:#60a5fa;margin-top:2px}
.wx-windy{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 14px;padding:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);font-size:12px;color:var(--accent);text-decoration:none}
.wx-windy:hover{background:var(--bg3)}
/* CRYPTO */
.cr-row{display:flex;gap:10px;align-items:stretch}
.cr-coin{flex:1;display:flex;flex-direction:column;gap:2px}
.cr-label{font-size:9px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.cr-price{font-size:16px;font-weight:700;letter-spacing:-.5px;line-height:1}
.cr-chg{font-size:10px}
.cr-chg.up{color:var(--green)}.cr-chg.dn{color:var(--red)}
.cr-pnl{font-size:10px;color:var(--txt2);margin-top:1px}
.cr-hint{font-size:9px;color:var(--txt3);text-align:center;margin-top:5px}
.cr-sep{width:1px;background:var(--border);flex-shrink:0}
.cr-panel{display:none;position:absolute;top:0;right:0;width:400px;max-width:95vw;background:var(--bg1);border:1px solid var(--border2);border-radius:var(--rl);z-index:200;box-shadow:0 24px 64px #000c;padding:16px;max-height:90vh;overflow-y:auto}
.cr-panel.open{display:block}
.cr-panel h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center}
.ptable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.ptable th{color:var(--txt2);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:10px}
.ptable td{padding:5px 6px;border-bottom:1px solid var(--border)}
.ptable tr:last-child td{border-bottom:none}
.pnl-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--border);margin-top:2px}
.tv-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:10px;min-height:200px}
/* LEFT PANEL */
#lp{grid-area:lp;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lp-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.lp-head h2{font-size:13px;font-weight:600}
.day-nav{display:flex;align-items:center;gap:4px}
.day-nav .dl{font-size:10px;color:var(--txt2);min-width:72px;text-align:center}
.lp-body{flex:1;overflow-y:auto;padding:8px}
/* CALENDAR */
#cal{grid-area:cal;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.cal-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.cal-head h2{font-size:14px;font-weight:700;flex:1;text-align:center}
.cal-body{flex:1;overflow-y:auto;padding:8px 10px}
.month-grid{display:flex;flex-direction:column;gap:1px}
.month-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}
.month-dow{text-align:center;font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;padding:4px 0}
.month-week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.month-day{background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:4px 5px;min-height:74px;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden}
.month-day:hover{border-color:var(--border2);background:var(--bg2)}
.month-day.today{border-color:var(--accent);background:var(--bg2)}
.month-day.today .mday-num{color:var(--accent);font-weight:700}
.month-day.other-month{opacity:.25}
.month-day.selected{border-color:var(--accent);background:#4f8ef712}
.mday-num{font-size:11px;font-weight:500;margin-bottom:3px;line-height:1}
.mday-chips{display:flex;flex-direction:column;gap:1px}
.chip{display:block;border-radius:3px;padding:1px 4px;font-size:9px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;font-weight:500}
.mday-more{font-size:9px;color:var(--txt3);margin-top:1px}
#rp{display:none}
/* EVENT CARDS */
.ecard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px;margin-bottom:7px}
.ecard.done{opacity:.4}
.ec-top{display:flex;align-items:flex-start;gap:7px}
.ec-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:14px}
.ec-body{flex:1;min-width:0}
.ec-title{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-meta{font-size:10px;color:var(--txt2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ec-notes{font-size:10px;color:var(--txt2);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ec-actions{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.ea{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;font-size:10px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--txt2);cursor:pointer;font-family:inherit;transition:background .12s,color .12s}
.ea:hover{background:var(--bg3);color:var(--txt)}
.ea.red:hover{background:#f8717120;color:var(--red)}
.ea.grn:hover{background:#34d39920;color:var(--green)}
.ea.ylw:hover{background:#fbbf2420;color:var(--yellow)}
/* PRIORITY */
.plabel{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:700}
.plabel.low{background:#64748b30;color:#94a3b8}
.plabel.normal{background:#4f8ef720;color:var(--accent)}
.plabel.high{background:#fb923c20;color:var(--orange)}
.plabel.very{background:#f8717120;color:var(--red)}
/* CHATBOT */
#chatbot{grid-area:bot;background:var(--bg1);border-top:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.cmsg{max-width:78%;padding:8px 12px;border-radius:var(--r);font-size:12px;line-height:1.5}
.cmsg.u{background:var(--accent);color:#fff;align-self:flex-end;border-radius:12px 12px 4px 12px}
.cmsg.b{background:var(--bg2);border:1px solid var(--border);color:var(--txt);align-self:flex-start;border-radius:12px 12px 12px 4px}
.chat-row{display:flex;gap:8px;padding:8px 16px;border-top:1px solid var(--border);flex-shrink:0;align-items:flex-end}
.chat-inp{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:8px 14px;color:var(--txt);font-size:12px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4}
.chat-inp:focus{border-color:var(--accent)}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-send:hover{background:#3a7de8}
/* MODAL */
.mbg{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px}
.mbg.open{display:flex}
.mbox{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--rl);padding:20px;width:400px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 32px 80px #000c}
.mbox h2{font-size:15px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:68px;line-height:1.5}
.field select option{background:var(--bg2)}
.macts{display:flex;align-items:center;gap:8px;margin-top:16px}
.msp{flex:1}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;font-size:12px;font-family:inherit;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--txt);cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--bg3)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acc:hover{background:#3a7de8}
.btn.red{color:var(--red);border-color:transparent}
.btn.red:hover{background:#f8717120}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ico{padding:5px 8px;border-radius:6px}
/* SPORT DETAIL */
.sd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.sd-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px}
.sd-label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.sd-val{font-size:12px;font-weight:600}
/* STANDINGS */
.stand-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:2px}
.stand-table th{color:var(--txt3);font-weight:700;text-align:left;padding:4px 5px;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase}
.stand-table td{padding:4px 5px;border-bottom:1px solid var(--border)}
.stand-table tr:last-child td{border-bottom:none}
.stand-p1{background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;font-size:9px;font-weight:700}
.stand-p{color:var(--txt3);font-size:10px}
/* BADGES */
.badge-live{display:inline-block;background:#f8717130;color:var(--red);border:1px solid #f8717150;border-radius:10px;font-size:9px;padding:1px 6px;font-weight:700}
.badge-soon{display:inline-block;background:#fbbf2430;color:var(--yellow);border:1px solid #fbbf2450;border-radius:10px;font-size:9px;padding:1px 6px;font-weight:700}
.slabel{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="app">

<!-- WEATHER -->
<div id="wx" onclick="toggleWx(event)">
  <div class="wx-main">
    <div class="wx-icon"><i id="wxi" class="ti ti-sun" style="color:#fbbf24"></i></div>
    <div class="wx-data">
      <div class="wx-temp" id="wxT">—</div>
      <div class="wx-mm" id="wxMM"></div>
      <div class="wx-cond" id="wxC"></div>
      <div class="wx-loc-row"><i class="ti ti-map-pin" style="font-size:9px"></i><span id="wxLoc">Lugoj, RO</span></div>
    </div>
  </div>
  <div class="wx-hint">tap for forecast ↓</div>
  <div class="wx-drop" id="wxDrop" onclick="event.stopPropagation()">
    <div class="wx-drop-head">
      <h3><i class="ti ti-cloud-sun" style="color:var(--accent)"></i> 7-day forecast</h3>
      <button class="btn ghost ico sm" onclick="closeWx(event)"><i class="ti ti-x"></i></button>
    </div>
    <div class="wx-loc-bar">
      <input id="wxLI" value="" placeholder="Change location…" onkeydown="if(event.key==='Enter'){changeWxLoc();event.stopPropagation()}">
      <button class="btn sm acc" onclick="changeWxLoc()">Go</button>
    </div>
    <div class="wx-days" id="wxDays"></div>
    <a class="wx-windy" id="wxWindyLink" href="https://www.windy.com/45.689/21.903?45.689,21.903,10" target="_blank" onclick="event.stopPropagation()">
      <i class="ti ti-wind"></i> Open Windy interactive forecast
    </a>
  </div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <h1><i class="ti ti-layout-dashboard" style="font-size:16px"></i> Personal Organizer</h1>
  <button class="btn acc sm" onclick="openAddTask()"><i class="ti ti-plus"></i> Add event</button>
  <button class="btn sm" onclick="openSettings()"><i class="ti ti-settings"></i></button>
</div>

<!-- crypto removed -->

<!-- LEFT PANEL -->
<div id="lp">
  <div class="lp-head">
    <h2 id="lpTitle">Today</h2>
    <div class="day-nav">
      <button class="btn ghost ico sm" onclick="shiftDay(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="dl" id="lpLabel"></span>
      <button class="btn ghost ico sm" onclick="shiftDay(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>
  <div class="lp-body" id="lpBody"></div>
</div>

<!-- CALENDAR -->
<div id="cal">
  <div class="cal-head">
    <button class="btn ghost ico sm" onclick="shiftMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <h2 id="calLabel"></h2>
    <button class="btn ghost ico sm" onclick="shiftMonth(1)"><i class="ti ti-chevron-right"></i></button>
    <button class="btn sm" onclick="gotoToday()">Today</button>
  </div>
  <div class="cal-body"><div class="month-grid" id="cgrid"></div></div>
</div>

<!-- right panel removed -->

<!-- CHATBOT -->
<div id="chatbot">
  <div class="chat-msgs" id="chatMsgs">
    <div class="cmsg b">👋 Hi! I'm your assistant. Try: <em>"add task dentist tomorrow at 10am"</em>, <em>"delete dentist"</em>, <em>"what do I have today?"</em> or type <em>"help"</em>.</div>
  </div>
  <div class="chat-row">
    <textarea class="chat-inp" id="chatIn" placeholder="Add tasks, ask about your schedule…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
    <button class="chat-send" onclick="sendChat()"><i class="ti ti-send"></i></button>
  </div>
</div>

<!-- MODAL -->
<div class="mbg" id="modal">
  <div class="mbox">
    <h2 id="mTitle">Event</h2>
    <div id="mBody"></div>
    <div class="macts" id="mActs"></div>
  </div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────
const TODAY = (()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')})();
const PAL = ['#4f8ef7','#34d399','#f97316','#e879a0','#fbbf24','#a78bfa','#60a5fa','#f87171','#94a3b8','#2dd4bf'];
const FREQS = ['none','daily','weekly','monthly','yearly'];
const PRIS = ['low','normal','high','very'];
const ALLH = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const WXI = {sunny:'ti-sun',partly_cloudy:'ti-cloud-sun',cloudy:'ti-cloud',rainy:'ti-cloud-rain',snow:'ti-snowflake',storm:'ti-storm',fog:'ti-mist',windy:'ti-wind'};
const WXC = {sunny:'#fbbf24',partly_cloudy:'#60a5fa',cloudy:'#94a3b8',rainy:'#60a5fa',snow:'#bae6fd',storm:'#818cf8',fog:'#94a3b8',windy:'#34d399'};
const BTC_HOLD=0.00359, BTC_RON=1800, USD_RON=4.65;
const SPORT_COLORS = {f1:'#e879a0',motogp:'#f97316',tdf:'#fbbf24',giro:'#f87171',ucl:'#4f8ef7',seriea:'#34d399',bundesliga:'#fb923c',snooker:'#a78bfa',n24h:'#2dd4bf',wec:'#60a5fa',cycling:'#fbbf24',football:'#4f8ef7',soccer:'#4f8ef7',romania:'#f87171'};
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ─── STATE ───────────────────────────────────────────────
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

const DFLT = {
  weekOffset:0, dayOffset:0, ftKey:'', tgToken:'', tgChatId:'', tgMorningHour:'08',
  wxLat:45.689, wxLon:21.903, wxLocName:'Lugoj, RO',
  apiFootballKey:'', footballDataKey:'', highlightlyKey:'', tsdbKey:'123', follows:{teams:[],competitions:[]},
  wx:null, // filled in by loadWeather() on boot — null shows a loading state, never fake data
  tasks:[], sportEvents:[],
  groups:[
    {id:'g_pers',name:'Personal',color:'#a78bfa'},
    {id:'g_home',name:'Home',color:'#4f8ef7'},
    {id:'g_car',name:'Car',color:'#94a3b8'},
    {id:'g_work',name:'Work',color:'#34d399'},
    {id:'g_sport',name:'Sport',color:'#f97316'},
  ]
};

// ── SERVER-BACKED STATE ──────────────────────────────────
let S = {...DFLT}; // will be overwritten from server on boot
let _saveTimer = null;

function saveState(){
  // Debounce saves — wait 500ms after last change
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    fetch('/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        tasks: S.tasks,
        // Auto-synced fixtures are managed exclusively by the server's
        // follow-sync job — never echo them back or we can clobber a
        // fresher sync with a stale client copy. Only manual entries save.
        sportEvents: (S.sportEvents||[]).filter(e=>e.source!=='auto'),
        groups: S.groups,
        settings:{
          tgToken: S.tgToken||'',
          tgChatId: S.tgChatId||'',
          tgMorningHour: S.tgMorningHour||'08',
          tgMorningMin: S.tgMorningMin||'00',

        }

}

// ─── HELPERS ─────────────────────────────────────────────
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function getGroup(id){return S.groups.find(g=>g.id===id)||{name:'?',color:'#888'}}
function parseD(s){return new Date(s+'T00:00:00')}
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtShort(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function fmtTime(t){if(!t)return'00:00';const p=String(t);return p.includes(':')?p:p.padStart(2,'0')+':00'}
function fmtLong(d){return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function sportColor(sp,ev){return(ev&&ev.color)||SPORT_COLORS[sp]||'#94a3b8'}
function currentDay(){const d=parseD(TODAY);d.setDate(d.getDate()+S.dayOffset);return d}

function matchesDate(ev,ds){
  if(!ev.date)return false;
  const freq=ev.freq||'none';
  if(freq==='none')return ev.date===ds;
  const base=parseD(ev.date),tgt=parseD(ds);
  if(tgt<base)return false;
  if(freq==='daily')return true;
  if(freq==='weekly')return base.getDay()===tgt.getDay();
  if(freq==='monthly')return base.getDate()===tgt.getDate();
  if(freq==='yearly')return base.getMonth()===tgt.getMonth()&&base.getDate()===tgt.getDate();
  return false;
}

// Converts "HH:MM" (or "H") to minutes-since-midnight for correct chronological sorting.
function timeToMinutes(t){
  if(!t) return 0;
  const s=fmtTime(t); // normalizes to "HH:MM"
  const [h,m]=s.split(':').map(Number);
  return (h||0)*60+(m||0);
}

// Groups same-day sport fixtures: a fixture involving a followed TEAM always
// gets its own slot with real team names (e.g. "Borussia Dortmund vs X").
// Everything else that only belongs to a followed COMPETITION is shown
// generically as the competition (badge + name), never spelling out team
// names for matches you didn't specifically follow — even when there's
// only one such fixture that day, per user preference. Multiple at once
// (e.g. a full Champions League group-stage night) collapse into a single
// tappable "(N matches)" slot.
function collapseSportEvents(sportEvs){
  const followedTeamIds = new Set((S.follows&&S.follows.teams||[]).map(t=>String(t.providerId)));
  const isTeamMatch = e => e.followType==='team' || (e.home && e.away && (followedTeamIds.has(String(e.home.id)) || followedTeamIds.has(String(e.away.id))));
  const teamSlots = sportEvs.filter(isTeamMatch).map(e=>({...e,_display:'single'}));
  const rest = sportEvs.filter(e=>!isTeamMatch(e));
  // Manually-added events (no competitionId, not auto-synced) always show
  // as themselves — only auto-synced "competition only" fixtures collapse.
  const manual = rest.filter(e=>e.source!=='auto');
  const autoRest = rest.filter(e=>e.source==='auto');
  const groups = {};
  autoRest.forEach(e=>{
    const key = e.competitionId || ('single_'+e.id);
    (groups[key] = groups[key]||[]).push(e);
  });
  const restSlots = Object.values(groups).map(g=>{
    const sorted=[...g].sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
    // Always the generic competition-badge display, even for a single fixture.
    return {
      _type:'sport', _display:'collapsed', id:'collapsed_'+(sorted[0].competitionId||sorted[0].id)+'_'+sorted[0].date,
      time: sorted[0].time, name: sorted[0].competitionName || 'Competition',
      competitionLogo: sorted[0].competitionLogo, sport: sorted[0].sport,
      count: sorted.length, fixtures: sorted, color: sorted[0].color
    };
  });
  return [...teamSlots, ...manual.map(e=>({...e,_display:'single'})), ...restSlots];
}

function eventsOnDay(ds){
  const tasks = S.tasks.map(t=>({...t,_type:'task'})).filter(ev=>matchesDate(ev,ds));
  const sportsRaw = (S.sportEvents||[]).map(e=>({...e,_type:'sport',_color:e.color||SPORT_COLORS[e.sport]||'#94a3b8'})).filter(ev=>matchesDate(ev,ds));
  const sports = collapseSportEvents(sportsRaw);
  return [...tasks, ...sports].sort((a,b)=>{
    const dt=timeToMinutes(a.time)-timeToMinutes(b.time);
    if(dt!==0) return dt;
    // Same time: tasks (personal items) come before sport fixtures.
    if(a._type!==b._type) return a._type==='task'?-1:1;
    return 0; // same type & time: keep original order
  });
}

// Fine-grained grouping for the day-agenda view specifically: a fresh
// "Competition name" header appears at every distinct kickoff time that
// competition has fixtures at, with same-time same-competition matches
// bundled directly beneath it — rather than one header covering the whole
// day. E.g. Premier League can appear three separate times in one day if
// it has matches at 13:45, 17:00, and 22:00. Team-follow and manual
// fixtures stay standalone (unchanged from the coarse grouping).
function collapseSportEventsFine(sportEvs){
  const followedTeamIds = new Set((S.follows&&S.follows.teams||[]).map(t=>String(t.providerId)));
  const isTeamMatch = e => e.followType==='team' || (e.home && e.away && (followedTeamIds.has(String(e.home.id)) || followedTeamIds.has(String(e.away.id))));
  const standalone = sportEvs.filter(e=>isTeamMatch(e) || e.source!=='auto').map(e=>({...e,_display:'single'}));
  const groupable = sportEvs.filter(e=>!isTeamMatch(e) && e.source==='auto');
  const cells = {};
  groupable.forEach(e=>{
    const key = e.time+'|'+(e.competitionId||e.id);
    (cells[key] = cells[key]||[]).push(e);
  });
  const cellSlots = Object.values(cells).map(g=>{
    const sorted=[...g].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    return {
      _type:'sport', _display:'cell',
      id:'cell_'+sorted[0].time+'_'+(sorted[0].competitionId||sorted[0].id)+'_'+sorted[0].date,
      time: sorted[0].time, name: sorted[0].competitionName || 'Competition',
      competitionLogo: sorted[0].competitionLogo, sport: sorted[0].sport,
      count: sorted.length, fixtures: sorted, color: sorted[0].color
    };
  });
  return [...standalone, ...cellSlots];
}

function agendaEventsOnDay(ds){
  const tasks = S.tasks.map(t=>({...t,_type:'task'})).filter(ev=>matchesDate(ev,ds));
  const sportsRaw = (S.sportEvents||[]).map(e=>({...e,_type:'sport',_color:e.color||SPORT_COLORS[e.sport]||'#94a3b8'})).filter(ev=>matchesDate(ev,ds));
  const sports = collapseSportEventsFine(sportsRaw);
  return [...tasks, ...sports].sort((a,b)=>{
    const dt=timeToMinutes(a.time)-timeToMinutes(b.time);
    if(dt!==0) return dt;
    if(a._type!==b._type) return a._type==='task'?-1:1;
    // Same time, both sport: alphabetical by competition/event name.
    if(a._type==='sport' && b._type==='sport') return (a.name||'').localeCompare(b.name||'');
    return 0;
  });
}

function renderWx(){
  const wx=S.wx;
  const ic=document.getElementById('wxi');
  document.getElementById('wxLoc').textContent=S.wxLocName||'—';
  const windyLink=document.getElementById('wxWindyLink');
  if(windyLink) windyLink.href='https://www.windy.com/'+S.wxLat+'/'+S.wxLon+'?'+S.wxLat+','+S.wxLon+',10';

  if(!wx){
    // Loading or failed state — never show fake numbers
    ic.className='ti ti-loader-2';
    ic.style.color='#94a3b8';
    document.getElementById('wxT').textContent='—';
    document.getElementById('wxMM').textContent='';
    document.getElementById('wxC').textContent=S._wxError?'Unavailable':'Loading…';
    document.getElementById('wxDays').innerHTML='';
    return;
  }
  ic.className='ti '+(WXI[wx.cond]||'ti-cloud');
  ic.style.color=WXC[wx.cond]||'#94a3b8';
  document.getElementById('wxT').textContent=wx.tempC+'°C';
  document.getElementById('wxMM').textContent='↑ '+wx.high+'° · ↓ '+wx.low+'°';
  document.getElementById('wxC').textContent=wx.text;
  document.getElementById('wxDays').innerHTML=wx.forecast.map(d=>
    '<div class="wx-day">'+
    '<div class="wx-day-n">'+d.dow+'</div>'+
    '<div class="wx-day-i"><i class="ti '+(WXI[d.cond]||'ti-cloud')+'" style="color:'+(WXC[d.cond]||'#888')+'"></i></div>'+
    '<div class="wx-day-h">'+d.high+'°</div>'+
    '<div class="wx-day-l">'+d.low+'°</div>'+
    (d.rain>0?'<div class="wx-day-r">💧'+d.rain+'%</div>':'')+
    '</div>'
  ).join('');
}

// Fetches real weather from our backend (which calls Open-Meteo).
// Pass {q:'Timisoara'} to look up a place name, or nothing to use S.wxLat/wxLon.
async function loadWeather(opts){
  opts=opts||{};
  try{
    S._wxError=false;
    renderWx(); // show loading state immediately
    const params=new URLSearchParams();
    if(opts.q) params.set('q',opts.q);
    else { params.set('lat',S.wxLat); params.set('lon',S.wxLon); }
    const r=await fetch('/api/weather?'+params.toString());
    if(!r.ok){ throw new Error('Weather lookup failed ('+r.status+')'); }
    const d=await r.json();
    S.wx=d;
    S.wxLat=d.lat; S.wxLon=d.lon;
    if(d.locName) S.wxLocName=d.locName;
    renderWx();
    saveState(); // persist chosen location + coords
  }catch(e){
    console.log('Weather error:',e.message);
    S._wxError=true;
    renderWx();
  }
}

function toggleWx(e){document.getElementById('wxDrop').classList.toggle('open')}
function closeWx(e){e.stopPropagation();document.getElementById('wxDrop').classList.remove('open')}
function changeWxLoc(){
  const v=document.getElementById('wxLI').value.trim();
  if(!v)return;
  loadWeather({q:v});
}

// ─── LEFT PANEL ──────────────────────────────────────────
function renderLP(){
  const d=currentDay();
  const ds=fmtD(d);
  const isToday=ds===TODAY;
  document.getElementById('lpTitle').textContent=isToday?'Today':fmtShort(d);
  document.getElementById('lpLabel').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const evs=agendaEventsOnDay(ds);
  cacheEvents(evs);
  const el=document.getElementById('lpBody');
  if(!evs.length){
    el.innerHTML='<div style="padding:20px;text-align:center;color:var(--txt3);font-size:12px"><i class="ti ti-calendar-off" style="font-size:24px;display:block;margin:0 auto 8px;opacity:.3"></i>No events</div>';
    return;
  }
  el.innerHTML=evs.map(ev=>renderCard(ev)).join('');
}

function renderCard(ev){
  const isTask=ev._type==='task';
  if(!isTask) return renderSportCard(ev);
  const col=getGroup(ev.group).color;
  const gName=getGroup(ev.group).name;
  const pri=ev.priority||'normal';
  let meta='<span style="color:'+col+';font-size:9px">'+gName+'</span>';
  meta+='<span style="color:var(--txt3)">'+fmtTime(ev.time)+'</span>';
  if(ev.freq&&ev.freq!=='none')meta+='<span style="color:var(--txt3)"><i class="ti ti-repeat" style="font-size:9px"></i>'+ev.freq+'</span>';
  meta+='<span class="plabel '+pri+'">'+(pri==='very'?'URGENT':pri)+'</span>';
  if(ev.reminder)meta+=reminderBadge(ev.reminder);
  let acts='';
  acts+='<button class="ea grn" onclick="markDone(\''+ev.id+'\')"><i class="ti ti-check"></i>'+(ev.done?'Undo':'Done')+'</button>';
  acts+='<button class="ea ylw" onclick="postpone(\''+ev.id+'\')"><i class="ti ti-clock-hour-4"></i>+1d</button>';
  acts+='<button class="ea" onclick="editTask(\''+ev.id+'\')"><i class="ti ti-edit"></i>Edit</button>';
  acts+='<button class="ea red" onclick="delTask(\''+ev.id+'\')"><i class="ti ti-trash"></i>Delete</button>';
  return '<div class="ecard'+(ev.done?' done':'')+'">'+
    '<div class="ec-top"><div class="ec-bar" style="background:'+col+'"></div>'+
    '<div class="ec-body"><div class="ec-title">'+escHtml(ev.name)+'</div>'+
    '<div class="ec-meta">'+meta+'</div>'+
    (ev.notes?'<div class="ec-notes">'+escHtml(ev.notes)+'</div>':'')+
    '</div></div>'+
    '<div class="ec-actions">'+acts+'</div>'+
    '</div>';
}

// Small badge <img>, falls back to a colored dot if no logo URL.
function badgeImg(url,alt,col,size){
  size=size||20;
  if(url) return '<img src="'+escHtml(url)+'" alt="'+escHtml(alt||'')+'" style="width:'+size+'px;height:'+size+'px;object-fit:contain;border-radius:3px;background:#fff1;flex-shrink:0">';
  return '<span style="width:'+Math.round(size/2)+'px;height:'+Math.round(size/2)+'px;border-radius:50%;background:'+(col||'#94a3b8')+';flex-shrink:0;display:inline-block"></span>';
}

// Detects whether a fixture's status text indicates it's currently in
// progress (Highlightly's state.description is free text like "1st Half",
// "Half Time", "Not Started", "Full Time" — anything that isn't clearly
// pre/post-match counts as live).
function isLiveStatus(status){
  if(!status) return false;
  return !/not started|scheduled|full[\s-]?time|finished|postponed|cancelled|suspended/i.test(status);
}
function liveBadge(ev){
  if(!isLiveStatus(ev.status)) return '';
  return '<span style="display:inline-flex;align-items:center;gap:3px;background:#ef444422;color:#ef4444;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:6px"><span style="width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.5s infinite"></span>LIVE'+(ev.liveClock?' '+escHtml(ev.liveClock):'')+'</span>';
}

function renderSportCard(ev){
  const col=ev._color||sportColor(ev.sport,ev);
  const gName=ev.sport||'sport';
  let meta='<span style="color:'+col+';font-size:9px">'+gName+'</span><span style="color:var(--txt3)">'+fmtTime(ev.time)+'</span>';

  if(ev._display==='collapsed'){
    // Generic competition slot — matches not involving a followed team never
    // spell out team names. Multiple at once show a count; a single fixture just shows the competition.
    let title=escHtml(ev.name)+(ev.count>1?' <span style="color:var(--txt3);font-weight:400;font-size:11px">('+ev.count+' matches)</span>':'');
    return '<div class="ecard" onclick="showFixtureList(\''+ev.id.replace(/'/g,'')+'\')" style="cursor:pointer">'+
      '<div class="ec-top"><div class="ec-bar" style="background:'+col+'"></div>'+
      '<div style="display:flex;align-items:center;gap:8px;flex:1">'+badgeImg(ev.competitionLogo,ev.name,col)+
      '<div class="ec-body" style="padding-left:0"><div class="ec-title">'+title+'</div><div class="ec-meta">'+meta+'</div></div></div></div>'+
      '<div class="ec-actions"><button class="ea" onclick="event.stopPropagation();showFixtureList(\''+ev.id+'\')"><i class="ti ti-list"></i>'+(ev.count>1?'See all':'Details')+'</button></div>'+
      '</div>';
  }

  if(ev._display==='cell'){
    // Fine-grained: one header per (competition, exact kickoff time), with
    // every match at that time bundled directly beneath it — always visible,
    // no tap needed to see what's on. Each row still taps through to full detail.
    const rows=ev.fixtures.map(f=>{
      const scoreTxt = f.score && f.score.home!=null ? (f.score.home+' - '+f.score.away) : '';
      const nameHtml = (f.home && f.away)
        ? badgeImg(f.home.logo,f.home.name,col,14)+' <span>'+escHtml(f.home.name)+'</span> <span style="color:var(--txt3)">vs</span> '+badgeImg(f.away.logo,f.away.name,col,14)+' <span>'+escHtml(f.away.name)+'</span>'
        : escHtml(f.name);
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0 5px 30px;font-size:11px;cursor:pointer" onclick="event.stopPropagation();showSportDetail(\''+f.id+'\')">'+
        '<span style="color:var(--txt2);display:flex;align-items:center;gap:4px;flex-wrap:wrap">'+nameHtml+liveBadge(f)+'</span>'+
        '<span style="color:var(--txt3);white-space:nowrap">'+(scoreTxt||fmtTime(f.time))+'</span></div>';
    }).join('');
    return '<div class="ecard">'+
      '<div class="ec-top"><div class="ec-bar" style="background:'+col+'"></div>'+
      '<div style="display:flex;align-items:center;gap:8px;flex:1">'+badgeImg(ev.competitionLogo,ev.name,col)+
      '<div class="ec-body" style="padding-left:0"><div class="ec-title">'+escHtml(ev.name)+'</div><div class="ec-meta">'+meta+'</div></div></div></div>'+
      rows+
      '</div>';
  }

  // Single fixture (team-follow match or a lone competition fixture)
  const hasTeams = ev.home && ev.away;
  const scoreTxt = ev.score && (ev.score.home!=null) ? (ev.score.home+' - '+ev.score.away) : '';
  // A real followed-team match (has home/away team data) gets a visually
  // bigger, more prominent card than everything else — this is the match
  // the user specifically follows, so it should stand out.
  if(hasTeams){
    let acts='<button class="ea" onclick="showSportDetail(\''+ev.id+'\')"><i class="ti ti-info-circle"></i>Details</button>';
    if(ev.source!=='auto') acts+='<button class="ea red" onclick="delSport(\''+ev.id+'\')"><i class="ti ti-trash"></i>Delete</button>';
    return '<div class="ecard" onclick="showSportDetail(\''+ev.id+'\')" style="cursor:pointer;padding:14px;border:1px solid '+col+'55;background:linear-gradient(135deg,'+col+'14,var(--bg2))">'+
      '<div class="ec-top"><div class="ec-bar" style="background:'+col+';width:4px"></div>'+
      '<div class="ec-body" style="padding-left:0">'+
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:700">'+
        badgeImg(ev.home.logo,ev.home.name,col)+'<span>'+escHtml(ev.home.name)+'</span>'+
        '<span style="color:var(--txt3);font-weight:400;font-size:12px">vs</span>'+
        badgeImg(ev.away.logo,ev.away.name,col)+'<span>'+escHtml(ev.away.name)+'</span>'+
        (scoreTxt?'<span style="color:var(--txt2);margin-left:4px">'+scoreTxt+'</span>':'')+liveBadge(ev)+
      '</div>'+
      (ev.competitionName?'<div style="font-size:11px;color:var(--txt3);margin-top:3px">'+escHtml(ev.competitionName)+'</div>':'')+
      '<div class="ec-meta" style="margin-top:5px">'+meta+'</div>'+
      '</div></div>'+
      '<div class="ec-actions" onclick="event.stopPropagation()">'+acts+'</div>'+
      '</div>';
  }
  const badges = badgeImg(ev.competitionLogo,ev.name,col);
  let acts='<button class="ea" onclick="showSportDetail(\''+ev.id+'\')"><i class="ti ti-info-circle"></i>Details</button>';
  if(ev.source!=='auto') acts+='<button class="ea red" onclick="delSport(\''+ev.id+'\')"><i class="ti ti-trash"></i>Delete</button>';
  return '<div class="ecard" onclick="showSportDetail(\''+ev.id+'\')" style="cursor:pointer">'+
    '<div class="ec-top"><div class="ec-bar" style="background:'+col+'"></div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex:1">'+badges+
    '<div class="ec-body" style="padding-left:0"><div class="ec-title">'+escHtml(ev.name)+(scoreTxt?' <span style="color:var(--txt2);font-weight:700">'+scoreTxt+'</span>':'')+'</div>'+
    (ev.competitionName?'<div style="font-size:10px;color:var(--txt3)">'+escHtml(ev.competitionName)+'</div>':'')+
    '<div class="ec-meta">'+meta+'</div></div></div></div>'+
    '<div class="ec-actions" onclick="event.stopPropagation()">'+acts+'</div>'+
    '</div>';
}

function shiftDay(n){S.dayOffset+=n;renderLP()}
function markDone(id){const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;saveState();renderAll()}}
function postpone(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const d=parseD(t.date);d.setDate(d.getDate()+1);t.date=fmtD(d);saveState();renderAll()}

function delTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  showModal('Delete task',
    '<div style="font-size:13px;margin-bottom:8px">Delete <b>'+escHtml(t.name)+'</b>?</div><div style="font-size:11px;color:var(--txt2)">This cannot be undone.</div>',
    '<button class="btn red" onclick="confirmDelTask(\''+id+'\')"><i class="ti ti-trash"></i> Delete</button><span class="msp"></span><button class="btn" onclick="closeModal()">Cancel</button>');
}
function confirmDelTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);saveState();closeModal();renderAll()}

function delSport(id){
  const ev=(S.sportEvents||[]).find(x=>x.id===id);if(!ev)return;
  showModal('Delete event',

// ─── CALENDAR ────────────────────────────────────────────
let _selDay=TODAY;

function renderCal(){
  const ms=new Date(parseD(TODAY).getFullYear(),parseD(TODAY).getMonth()+S.weekOffset,1);
  const year=ms.getFullYear(),month=ms.getMonth();
  document.getElementById('calLabel').textContent=MONTHS_LONG[month]+' '+year;
  let startDow=(ms.getDay()+6)%7; // Mon=0
  const dim=new Date(year,month+1,0).getDate();
  const prev=new Date(year,month,0).getDate();
  let cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({d:prev-i,m:month-1,y:year,other:true});
  for(let d=1;d<=dim;d++)cells.push({d,m:month,y:year,other:false});
  let nd=1;while(cells.length%7!==0)cells.push({d:nd++,m:month+1,y:year,other:true});
  const DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html='<div class="month-dow-row">'+DOWS.map(d=>'<div class="month-dow">'+d+'</div>').join('')+'</div>';
  for(let w=0;w<cells.length;w+=7){
    html+='<div class="month-week">';
    for(let i=0;i<7;i++){
      const c=cells[w+i];
      const dt=new Date(c.y,c.m,c.d);
      const ds=fmtD(dt);
      const isToday=ds===TODAY,isSel=ds===_selDay;
      const evs=c.other?[]:eventsOnDay(ds);
      cacheEvents(evs);
      let chips=evs.slice(0,3).map(ev=>{
        const col=ev._type==='task'?getGroup(ev.group).color:(ev._color||sportColor(ev.sport,ev));
        const isSport=ev._type==='sport';
        const badgeUrl=isSport?(ev._display==='collapsed'?ev.competitionLogo:(ev.home&&ev.home.logo)||ev.competitionLogo):null;
        const icon=badgeUrl?'<img src="'+escHtml(badgeUrl)+'" style="width:12px;height:12px;object-fit:contain;border-radius:2px;flex-shrink:0;vertical-align:-2px;margin-right:3px">':'';
        return '<div class="chip" style="background:'+col+'28;color:'+col+';border-color:'+col+'50" title="'+escHtml(ev.name)+'">'+icon+escHtml(ev.name)+'</div>';
      }).join('');
      if(evs.length>3)chips+='<div class="mday-more">+'+(evs.length-3)+' more…</div>';
      html+='<div class="month-day'+(c.other?' other-month':'')+(isToday?' today':'')+(isSel&&!isToday?' selected':'')+(evs.length?' has-events':'')+'" onclick="selectDay(\''+ds+'\')">';
      html+='<div class="mday-num">'+c.d+'</div><div class="mday-chips">'+chips+'</div></div>';
    }
    html+='</div>';
  }
  document.getElementById('cgrid').innerHTML=html;
}

function selectDay(ds){
  _selDay=ds;
  const base=parseD(TODAY),sel=parseD(ds);
  S.dayOffset=Math.round((sel-base)/86400000);

// ─── NOTIFICATIONS / REMINDERS ────────────────────────────
function requestNotifPermission(cb){
  if(!('Notification' in window)){cb&&cb(false);return;}
  if(Notification.permission==='granted'){cb&&cb(true);return;}
  Notification.requestPermission().then(p=>cb&&cb(p==='granted'));
}

// Store active timer IDs so we can cancel on reload
const _timers={};

function scheduleReminder(ev){
  if(!ev.reminder||!ev.date||!ev.time)return;
  const minBefore=parseInt(ev.reminder);
  if(isNaN(minBefore)||minBefore<=0)return;
  // Build event datetime
  const [hh,mm]=(ev.time||'00:00').split(':');
  const evMs=new Date(ev.date+'T'+hh.padStart(2,'0')+':'+(mm||'00').padStart(2,'0')+':00').getTime();
  const fireMs=evMs-(minBefore*60000);
  const nowMs=Date.now();
  const delay=fireMs-nowMs;
  if(delay<=0)return; // already past
  // Cancel previous timer for this event if any
  if(_timers[ev.id])clearTimeout(_timers[ev.id]);
  _timers[ev.id]=setTimeout(()=>{
    requestNotifPermission(ok=>{
      if(ok){
        const label=minBefore>=60?(minBefore/60)+'h':''+minBefore+' min';
        new Notification('⏰ '+ev.name,{
          body:'Starting in '+label+' — '+ev.date+' at '+ev.time,
          icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="28" font-size="28">📅</text></svg>',
          tag:ev.id
        });
      }
    });
  },delay);
}

function scheduleAllReminders(){
  const all=[...S.tasks,...(S.sportEvents||[])];
  all.forEach(ev=>{if(ev.reminder)scheduleReminder(ev)});
}

}

// Auto-synced fixture (from a followed team/competition). Fetches full
// detail from the backend — lineups/stats/standings for football via
// Highlightly, best-available info for everything else via TheSportsDB.
async function showAutoFixtureDetail(ev){
  if(_fxRefreshTimer){ clearInterval(_fxRefreshTimer); _fxRefreshTimer=null; }
  const col=ev.color||sportColor(ev.sport,ev);
  const d=parseD(ev.date);
  const headerBadges=ev.home&&ev.away
    ? '<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px">'+
        '<div style="text-align:center">'+badgeImgLg(ev.home.logo,ev.home.name)+'<div style="font-size:11px;margin-top:4px">'+escHtml(ev.home.name)+'</div></div>'+
        '<div style="font-size:13px;color:var(--txt3)">vs</div>'+
        '<div style="text-align:center">'+badgeImgLg(ev.away.logo,ev.away.name)+'<div style="font-size:11px;margin-top:4px">'+escHtml(ev.away.name)+'</div></div>'+
      '</div>' : '';
  showModal(ev.name,
    headerBadges+'<div style="text-align:center;font-size:11px;color:var(--txt2);margin-bottom:10px">'+fmtLong(d)+' · '+fmtTime(ev.time)+' Bucharest'+(ev.competitionName?' · '+escHtml(ev.competitionName):'')+'</div>'+
    '<div id="fxDetailBody" style="font-size:12px;color:var(--txt2);text-align:center;padding:20px 0"><i class="ti ti-loader-2"></i> Loading details…</div>',
    '<span class="msp"></span><button class="btn acc" onclick="closeModal()">Close</button>');

  const load = async ()=>{
    try{
      const r=await fetch('/api/fixture/'+ev.provider+'/'+ev.providerId+'?sport='+encodeURIComponent(ev.sport||''));
      const d2=await r.json();
      const el=document.getElementById('fxDetailBody');
      if(!el){ if(_fxRefreshTimer){clearInterval(_fxRefreshTimer);_fxRefreshTimer=null;} return; } // modal closed
      if(d2.error){ el.innerHTML='<div style="color:var(--red)">Could not load details: '+escHtml(d2.error)+'</div>'; return; }
      el.innerHTML=renderFixtureDetailBody(ev,d2);
      // If the match is live, keep polling for fresh score/events every 60s
      // while this modal stays open — stop once it's no longer live.
      const liveNow = d2.fixture && isLiveStatus((d2.fixture.state&&d2.fixture.state.description)||ev.status);
      if(liveNow && !_fxRefreshTimer){
        _fxRefreshTimer=setInterval(load, 60000);
      } else if(!liveNow && _fxRefreshTimer){
        clearInterval(_fxRefreshTimer); _fxRefreshTimer=null;
      }
    }catch(e){
      const el=document.getElementById('fxDetailBody');
      if(el) el.innerHTML='<div style="color:var(--red)">Network error loading details.</div>';
    }
  };
  await load();
}
function badgeImgLg(url,alt){ return url?'<img src="'+escHtml(url)+'" alt="'+escHtml(alt||'')+'" style="width:40px;height:40px;object-fit:contain">':'<div style="width:40px;height:40px;border-radius:50%;background:var(--bg3);margin:0 auto"></div>'; }

function renderFixtureDetailBody(ev,d){
  if(ev.provider==='thesportsdb'){
    const f=d.fixture;
    if(!f) return '<div style="text-align:center;color:var(--txt3)">No further detail available for this event.</div>';
    let html='<div class="sd-grid">'+sdItem('Status',f.strStatus||'Scheduled')+sdItem('Venue',f.strVenue||'—');
    if(f.intHomeScore!=null) html+=sdItem('Score',f.intHomeScore+' - '+f.intAwayScore,true);
    html+='</div>';
    return html;
  }
  if(ev.provider==='motogp'){
    const f=d.fixture;
    if(!f || f.error) return '<div style="text-align:center;color:var(--txt3)">No further detail available for this event.</div>';
    let html='<div class="sd-grid">'+
      sdItem('Circuit',(f.circuit&&f.circuit.name)||ev.circuit||'—')+
      sdItem('Country',(f.circuit&&f.circuit.country)||ev.country||'—')+
      sdItem('Status',f.status||ev.status||'Scheduled')+'</div>';
    if(f.broadcasts && f.broadcasts.length){
      html+='<div class="slabel" style="margin-top:14px">Weekend schedule</div>';
      html+='<div style="font-size:11px">'+f.broadcasts.filter(b=>b.category&&b.category.name==='MotoGP').map(b=>
        '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)"><span>'+escHtml(b.name||b.shortname)+'</span><span style="color:var(--txt3)">'+new Date(b.date_start).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})+'</span></div>'
      ).join('')+'</div>';
    }
    return html;
  }
  if(ev.provider==='highlightly'){
    const fx=d.fixture;
    if(!fx) return '<div style="text-align:center;color:var(--txt3)">No further detail available for this event.</div>';
    let html='<div class="sd-grid">'+
      sdItem('Status',(fx.state&&fx.state.description)||'Scheduled')+
      sdItem('Venue',(fx.venue&&fx.venue.name)||'—');
    if(fx.state&&fx.state.score&&fx.state.score.current) html+=sdItem('Score',fx.state.score.current,true);
    html+='</div>';
    if(fx.events && fx.events.length){
      const notable=fx.events.filter(e=>['Goal','Own Goal','Penalty','Red Card'].includes(e.type));
      if(notable.length){
        html+='<div class="slabel" style="margin-top:14px">Key events</div><div style="font-size:11px">'+
          notable.map(e=>'<div style="display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)"><span style="color:var(--txt3);width:34px">'+escHtml(e.time||'')+'\'</span><span>'+(e.type==='Goal'||e.type==='Penalty'?'⚽':e.type==='Own Goal'?'⚽(OG)':'🟥')+' '+escHtml(e.player||'')+'</span></div>').join('')+
          '</div>';
      }
    }
    if(d.lineups && d.lineups.homeTeam && d.lineups.awayTeam){
      html+='<div class="slabel" style="margin-top:14px">Lineups</div><div style="display:flex;gap:10px">';
      [d.lineups.homeTeam, d.lineups.awayTeam].forEach(side=>{
        html+='<div style="flex:1;font-size:11px"><div style="font-weight:700;margin-bottom:4px">'+escHtml(side.name)+' <span style="color:var(--txt3);font-weight:400">('+escHtml(side.formation||'')+')</span></div>';
        (side.initialLineup||[]).flat().forEach(p=>{ html+='<div style="padding:2px 0;color:var(--txt2)">'+(p.number||'')+' · '+escHtml(p.name)+' <span style="color:var(--txt3)">'+(p.position||'')+'</span></div>'; });
        html+='</div>';
      });
      html+='</div>';
    }
    if(fx.statistics && fx.statistics.length===2){
      const [home,away]=fx.statistics;
      html+='<div class="slabel" style="margin-top:14px">Statistics</div>';
      (home.statistics||[]).forEach((s,i)=>{
        const b=(away.statistics[i]&&away.statistics[i].value) ?? '—';
        html+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)"><span>'+s.value+'</span><span style="color:var(--txt3)">'+escHtml(s.displayName)+'</span><span>'+b+'</span></div>';
      });
    }
    if(d.standings && d.standings.length){
      html+='<div class="slabel" style="margin-top:14px">Standings</div><div style="font-size:11px">'+d.standings.slice(0,10).map(t=>
        '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)">'+
        '<span style="width:16px;color:var(--txt3)">'+t.position+'</span>'+badgeImg(t.team.logo,t.team.name)+
        '<span style="flex:1">'+escHtml(t.team.name)+'</span><span style="color:var(--txt3)">'+t.total.games+'p</span><span style="color:var(--txt2);font-weight:700">'+t.points+' pts</span></div>'
      ).join('')+'</div>';
    }
    if(fx.predictions && fx.predictions.prematch && fx.predictions.prematch[0]){
      const p=fx.predictions.prematch[0].probabilities;
      html+='<div class="slabel" style="margin-top:14px">Prediction</div><div style="font-size:11px;display:flex;justify-content:space-between"><span>Home '+p.home+'</span><span>Draw '+p.draw+'</span><span>Away '+p.away+'</span></div>';
    }
    return html;
  }
  return '<div style="text-align:center;color:var(--txt3)">No further detail available yet — check back closer to kickoff.</div>';
}

async function fmSyncNow(){
  const el=document.getElementById('fmSyncStatus');
  el.style.color='var(--txt3)'; el.innerHTML='<i class="ti ti-loader-2"></i> Syncing…';
  try{
    const r=await fetch('/api/sports/sync-now',{method:'POST'});
    const d=await r.json();
    if(d.error){ el.style.color='var(--red)'; el.textContent='Sync failed: '+d.error; return; }
    const lines=(d.log||[]).map(x=>{
      if(!x.ok) return '<div style="color:var(--red)">✗ '+escHtml(x.name)+': '+escHtml(x.error)+'</div>';
      return '<div style="color:var(--txt2)">✓ '+escHtml(x.name)+': '+x.count+' fixture'+(x.count===1?'':'s')+(x.note?' <span style="color:var(--txt3)">('+escHtml(x.note)+')</span>':'')+'</div>';
    }).join('');
    el.style.color='var(--green)'; el.style.textAlign='left';
    el.innerHTML='<div style="text-align:center;margin-bottom:4px">✅ Synced '+d.synced+' total fixtures.</div>'+lines;
    await loadFromServer(); renderAll();
  }catch(e){ el.style.color='var(--red)'; el.textContent='Sync failed: '+e.message; }
}

function buildDailyMsg(dateStr){
  const d=parseD(dateStr);
  const evs=eventsOnDay(dateStr);
  const dow=d.toLocaleDateString('en-GB',{weekday:'long'});
  const dateDisp=d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  let msg='📅 <b>Daily briefing — '+dow+', '+dateDisp+'</b>\n\n';
  if(!evs.length){
    msg+='✨ No events scheduled today. Enjoy your day!';
  } else {
    msg+='<b>'+evs.length+' event'+(evs.length>1?'s':'')+' today:</b>\n\n';
    evs.forEach(ev=>{
      const icon=ev._type==='task'?'📋':'🏆';
      msg+=icon+' <b>'+ev.name+'</b>\n';
      msg+='   🕐 '+fmtTime(ev.time);
      if(ev._type==='task'){
        const g=getGroup(ev.group);
        msg+=' · '+g.name;
        if(ev.priority&&ev.priority!=='normal') msg+=' · ⚠️ '+ev.priority;
      } else {
        msg+=' · '+(ev.sport||'sport');
      }
      if(ev.notes) msg+='\n   📝 '+ev.notes;
      if(ev.reminder) msg+='\n   🔔 Reminder: '+reminderBadgeTxt(ev.reminder)+' before';
      msg+='\n\n';
    });
  }
  msg+='—\n🗂 Personal Organizer';
  return msg;
}

function reminderBadgeTxt(r){
  const m=parseInt(r);
  if(m>=1440)return'1 day';
  if(m>=120)return(m/60)+' hours';
  if(m===60)return'1 hour';
  return m+' min';
}

function buildWeeklyMsg(){
  // 7 days starting from today
  let msg='📆 <b>Weekly summary</b> — week of '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'\n\n';
  const totalTasks=S.tasks.filter(t=>!t.done).length;
  const totalSport=(S.sportEvents||[]).length;
  msg+='📋 <b>'+totalTasks+'</b> active tasks · 🏆 <b>'+totalSport+'</b> sport events\n\n';
  // Active tasks by priority
  const urgent=S.tasks.filter(t=>!t.done&&t.priority==='very');
  const high=S.tasks.filter(t=>!t.done&&t.priority==='high');
  if(urgent.length){
    msg+='🚨 <b>URGENT:</b>\n';
    urgent.forEach(t=>msg+='• '+t.name+' ('+t.date+')\n');
    msg+='\n';
  }
  if(high.length){
    msg+='⚠️ <b>High priority:</b>\n';
    high.forEach(t=>msg+='• '+t.name+' ('+t.date+')\n');
    msg+='\n';
  }
  // This week's events day by day
  msg+='<b>This week\'s schedule:</b>\n';
  for(let i=0;i<7;i++){
    const d=parseD(TODAY);d.setDate(d.getDate()+i);
    const ds=fmtD(d);
    const evs=eventsOnDay(ds);
    if(evs.length){
      const dow=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      msg+='\n<b>'+dow+'</b>\n';
      evs.forEach(ev=>{
        const icon=ev._type==='task'?'📋':'🏆';
        msg+=icon+' '+ev.name+' ('+fmtTime(ev.time)+')\n';
      });
    }
  }
  // Upcoming sport events
  const upcoming=(S.sportEvents||[]).filter(e=>e.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(upcoming.length){
    msg+='\n🏆 <b>Next sport events:</b>\n';
    upcoming.forEach(e=>{
      const d=parseD(e.date);
      msg+='• '+e.name+' — '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' at '+fmtTime(e.time)+'\n';
    });
  }
  msg+='\n—\n🗂 Personal Organizer';
  return msg;
}

// Auto-schedule daily and weekly messages
const _tgTimers={daily:null,weekly:null};
function scheduleTgMessages(){
  if(!S.tgToken||!S.tgChatId)return;
  // Clear old timers
  if(_tgTimers.daily)clearTimeout(_tgTimers.daily);
  if(_tgTimers.weekly)clearTimeout(_tgTimers.weekly);

  const now=new Date();
  const morningH=parseInt(S.tgMorningHour||'08');

  // Daily: fire at morning hour, then every 24h
  const nextDaily=new Date();
  nextDaily.setHours(morningH,0,0,0);
  if(nextDaily<=now)nextDaily.setDate(nextDaily.getDate()+1);
  const dailyDelay=nextDaily-now;
  _tgTimers.daily=setTimeout(async function tick(){
    await tgSend(buildDailyMsg(fmtD(new Date())));
    _tgTimers.daily=setTimeout(tick,86400000); // repeat every 24h
  },dailyDelay);

  // Weekly: fire next Monday at morning hour
  const nextMonday=new Date();
  const daysUntilMon=(8-nextMonday.getDay())%7||7; // days until next Monday
  nextMonday.setDate(nextMonday.getDate()+daysUntilMon);
  nextMonday.setHours(morningH,0,0,0);
  const weeklyDelay=nextMonday-now;
  _tgTimers.weekly=setTimeout(async function tickW(){
    await tgSend(buildWeeklyMsg());
    _tgTimers.weekly=setTimeout(tickW,7*86400000); // repeat every 7 days
  },weeklyDelay);
}

function fmtDLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return fmtDLocal(d)}

function parseNLDate(str){
  if(!str)return null;
  const s=str.toLowerCase().trim();
  const fmt=d=>fmtDLocal(d);
  const base=parseD(TODAY);
  const add=n=>{const d=new Date(base);d.setDate(d.getDate()+n);return fmt(d)};
  if(s==='today'||s==='azi')return TODAY;
  if(s==='tomorrow'||s==='maine')return add(1);
  if(s==='yesterday')return add(-1);
  const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const dm=s.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
  if(dm){const di=DAYS.indexOf(dm[1]);const cur=base.getDay();let diff=di-cur;if(diff<=0)diff+=7;return add(diff)}
  const inm=s.match(/in\s+(\d+)\s+days?/);if(inm)return add(parseInt(inm[1]));
  const iso=s.match(/(\d{4}-\d{2}-\d{2})/);if(iso)return iso[1];
  const MNAMES=['january','february','march','april','may','june','july','august','september','october','november','december'];
  for(let i=0;i<MNAMES.length;i++){
    const m=s.match(new RegExp('(\\d{1,2})\\s+'+MNAMES[i]+'|'+MNAMES[i]+'\\s+(\\d{1,2})'));
    if(m){const day=parseInt(m[1]||m[2]);return base.getFullYear()+'-'+String(i+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
  }
  const dmy=s.match(/(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{4}))?/);
  if(dmy)return(dmy[3]||String(base.getFullYear()))+'-'+dmy[2].padStart(2,'0')+'-'+dmy[1].padStart(2,'0');
  return null;
}

function parseNLTime(str){
  if(!str)return'09';
  const m=str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);if(!m)return'09';
  let h=parseInt(m[1]);
  if((m[3]||'').toLowerCase()==='pm'&&h<12)h+=12;
  if((m[3]||'').toLowerCase()==='am'&&h===12)h=0;
  const mm=m[2]||'00';
  return String(h).padStart(2,'0')+':'+mm.padStart(2,'0');
}

function findTask(q){const ql=q.toLowerCase();return S.tasks.find(t=>t.name.toLowerCase().includes(ql))}
function findSport(q){const ql=q.toLowerCase();return(S.sportEvents||[]).find(e=>e.name.toLowerCase().includes(ql))}
async function fetchRealSportEvent(query){
  // Map common sport names to TheSportsDB league IDs
  const SPORT_IDS={
    'motogp':'motogp',f1:'4370',motogp:'4558',
    'formula 1':'4370','formula1':'4370',
    'champions league':'4480','ucl':'4480',
    'serie a':'4331','bundesliga':'4332',
    'tour de france':'4479','tdf':'4479',
  };
  const q=query.toLowerCase();
  let leagueId=null;
  for(const[k,v] of Object.entries(SPORT_IDS)){
    if(q.includes(k)){leagueId=v;break;}
  }
  if(!leagueId)return null;
  try{
    const r=await fetch('/api/sports/next/'+leagueId);
    const d=await r.json();
    const evs=d.events||d.event||[];
    if(!evs.length)return null;
    const ev=evs[0];
    return{
      name: ev.strEvent||ev.strLeague,
      date: ev.dateEvent,
      time: (ev.strTime||'14:00').slice(0,5),
      notes: (ev.strVenue||'')+(ev.strCountry?' · '+ev.strCountry:''),
      sport: leagueId==='4370'?'f1':leagueId==='4558'?'motogp':leagueId==='4480'?'ucl':leagueId==='4331'?'seriea':leagueId==='4332'?'bundesliga':'other'
    };
  }catch(e){return null;}
}

function guessGroup(t){const s=t.toLowerCase();if(/car|vehicle|tire|insurance|fuel/.test(s))return'g_car';if(/work|meeting|deadline|office|project|client/.test(s))return'g_work';if(/bill|invoice|electric|water|gas|internet|rent|payment/.test(s))return'g_home';if(/gym|run|sport|race|match|training/.test(s))return'g_sport';return'g_pers'}
function guessPriority(t){const s=t.toLowerCase();if(/urgent|asap|critical/.test(s))return'very';if(/important|high/.test(s))return'high';if(/low|minor/.test(s))return'low';return'normal'}
function guessSport(t){const s=t.toLowerCase();if(/f1|formula|grand.?prix|\bgp\b/.test(s))return'f1';if(/motogp|moto.?gp/.test(s))return'motogp';if(/tour.de.france|tdf/.test(s))return'tdf';if(/giro/.test(s))return'giro';if(/champions|ucl/.test(s))return'ucl';if(/serie.?a|milan|inter|juve/.test(s))return'seriea';if(/bundesliga/.test(s))return'bundesliga';if(/wec|endurance|le.?mans/.test(s))return'wec';if(/snooker/.test(s))return'snooker';if(/romania/.test(s))return'romania';return'other'}

function processChat(raw){
  // Strip polite filler at the start in any language
  let clean=raw.trim().replace(/^(?:please|can you|could you|would you|te rog|va rog|poti|i want you to|i'd like you to|i would like you to)\s+/i,'');
  const txt=clean.toLowerCase();

  // ── CLEAR ALL ──
  if(/(?:remove|delete|clear)\s+all\s+tasks?/.test(txt)){const n=S.tasks.length;S.tasks=[];saveState();renderAll();return'🗑️ Removed all '+n+' tasks.'}
  if(/(?:remove|delete|clear)\s+all\s+(?:sport|event|competition)/.test(txt)){const n=(S.sportEvents||[]).length;S.sportEvents=[];saveState();renderAll();return'🗑️ Removed all '+n+' sport events.'}

  // ── DELETE ──
  const delM=txt.match(/^(?:delete|remove|sterge|elimina)\s+(?:task\s+|event\s+)?["']?(.+?)["']?\s*$/);
  if(delM&&!/\ball\b/.test(txt)){
    const t=findTask(delM[1]);if(t){S.tasks=S.tasks.filter(x=>x.id!==t.id);saveState();renderAll();return'🗑️ Deleted: <b>'+escHtml(t.name)+'</b>'}
    const se=findSport(delM[1]);if(se){S.sportEvents=(S.sportEvents||[]).filter(x=>x.id!==se.id);saveState();renderAll();return'🗑️ Deleted: <b>'+escHtml(se.name)+'</b>'}
    return'❌ Could not find "'+escHtml(delM[1])+'"'
  }

  // ── MARK DONE ──
  const doneM=txt.match(/^(?:mark\s+)?(?:done|completed?|gata|rezolvat)\s+["']?(.+?)["']?\s*$/);
  if(doneM){const t=findTask(doneM[1]);if(t){t.done=!t.done;saveState();renderAll();return'✅ Marked <b>'+escHtml(t.name)+'</b> as '+(t.done?'done':'not done')}return'❌ Could not find that task.'}

  // ── POSTPONE ──
  const postM=txt.match(/^postpone\s+["']?(.+?)["']?(?:\s+by\s+(\d+)\s+days?)?\s*$/);
  if(postM){const t=findTask(postM[1]);if(t){const n=parseInt(postM[2])||1;t.date=addDays(t.date,n);saveState();renderAll();return'⏩ Postponed <b>'+escHtml(t.name)+'</b> by '+n+' day(s) → '+t.date}return'❌ Could not find that task.'}

  // ── QUERY ──
  if(/what.*(?:today|schedule)|show.*today|today.*event|list.*task|ce am azi/.test(txt)){const evs=eventsOnDay(TODAY);if(!evs.length)return'📅 Nothing today ('+TODAY+').';return'📅 Today:<br>'+evs.map(e=>'• '+fmtTime(e.time)+' <b>'+escHtml(e.name)+'</b>').join('<br>')}
  if(/how many|cate/.test(txt))return'📋 '+S.tasks.filter(t=>!t.done).length+' active tasks · '+(S.sportEvents||[]).length+' sport events.';

  // ── HELP ──
  if(/^help/.test(txt))return'What I can do:<br>• <em>add task dentist tomorrow at 10am</em><br>• <em>please add an event on 06.08.2026 at 19:00 named "Joi - cantare"</em><br>• <em>add sport F1 Belgian GP on July 26 at 16:00</em><br>• <em>delete dentist</em><br>• <em>mark done dentist</em><br>• <em>postpone dentist by 2 days</em><br>• <em>remove all tasks</em><br>• <em>what do I have today?</em>';

  // ── DETECT ADD INTENT ──
  const isAddI=/^(?:add|new|create|schedule|set|adauga|pune|creeaza)\b/i.test(clean);
  const isSportI=/\b(?:f1|formula|grand.?prix|\bgp\b|motogp|tour.de.france|giro|champions.league|ucl|serie.?a|bundesliga|wec|snooker|roubaix|nurburgring)\b/i.test(raw);

  if(!isAddI&&!isSportI)return'❓ I didn\'t understand that. Type <em>help</em> to see what I can do, or use the <b>+ Add event</b> button.';

  // ── EXTRACT NAME from "named X" or "called X" or quoted string ──
  let forcedName=null;
  const namedM=clean.match(/\bnamed?\s+[""]([^"""]+)[""]|\bcalled?\s+[""]([^"""]+)[""]|[""]([^"""]+)[""]/);
  if(namedM){
    forcedName=(namedM[1]||namedM[2]||namedM[3]).trim();
    // Remove the named/called + quoted part from clean so it doesn't pollute date/time parsing
    clean=clean.replace(namedM[0],'').trim();
  }
  // Also handle straight quotes
  const sqM=!forcedName&&clean.match(/\bnamed?\s+"([^"]+)"|\bcalled?\s+"([^"]+)"|"([^"]+)"/);
  if(sqM){
    forcedName=(sqM[1]||sqM[2]||sqM[3]).trim();
    clean=clean.replace(sqM[0],'').trim();
  }

  // ── EXTRACT TIME ──
  const tmM=clean.match(/\bat\s+(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)\b/i)
         ||clean.match(/\bora\s+(\d{1,2}(?::\d{2})?)\b/i);
  const time=tmM?parseNLTime(tmM[1]):(isSportI?'14':'09');
  if(tmM)clean=clean.replace(tmM[0],'').trim();

  // ── EXTRACT DATE ──
  // Order matters: most specific first
  let date=TODAY;
  const yr=parseD(TODAY).getFullYear();
  const datePatterns=[
    // ISO: 2026-08-06
    {r:/\b(\d{4})-(\d{2})-(\d{2})\b/,       f:m=>m[1]+'-'+m[2]+'-'+m[3]},
    // DD.MM.YYYY or DD/MM/YYYY or DD-MM-YYYY
    {r:/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})\b/, f:m=>m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')},
    // DD.MM (no year)
    {r:/\b(\d{1,2})[.\/-](\d{1,2})\b/,       f:m=>yr+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')},
    // tomorrow / maine
    {r:/\b(?:tomorrow|maine)\b/i,              f:()=>addDays(TODAY,1)},
    // today / azi
    {r:/\b(?:today|azi)\b/i,                   f:()=>TODAY},
    // next Monday / weekday name
    {r:/\b(?:next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday|luni|marti|miercuri|joi|vineri|sambata|duminica)\b/i,
      f:m=>{const DAYS={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,duminica:0,luni:1,marti:2,miercuri:3,joi:4,vineri:5,sambata:6};
            const di=DAYS[m[1].toLowerCase()];const base=parseD(TODAY);
            let diff=di-base.getDay();if(diff<=0)diff+=7;return addDays(TODAY,diff)}},
    // July 26 / 26 July
    {r:/\b(?:on\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|ianuarie|februarie|martie|aprilie|mai|iunie|iulie|august|septembrie|octombrie|noiembrie|decembrie)\s+(\d{1,2})\b/i,
      f:m=>{const MI={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,ianuarie:1,februarie:2,martie:3,aprilie:4,mai:5,iunie:6,iulie:7,august:8,septembrie:9,octombrie:10,noiembrie:11,decembrie:12};
            const mo=MI[m[1].toLowerCase()];return yr+'-'+String(mo).padStart(2,'0')+'-'+String(parseInt(m[2])).padStart(2,'0')}},
    {r:/\b(\d{1,2})\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/i,
      f:m=>{const MI={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
            const mo=MI[m[2].toLowerCase()];return yr+'-'+String(mo).padStart(2,'0')+'-'+String(parseInt(m[1])).padStart(2,'0')}},
    // in N days
    {r:/\bin\s+(\d+)\s+days?\b/i,             f:m=>addDays(TODAY,parseInt(m[1]))},
  ];
  for(const p of datePatterns){
    const m=clean.match(p.r);
    if(m){date=p.f(m);clean=clean.replace(m[0],'').trim();break;}
  }

  // ── CLEAN UP REMAINING TEXT TO GET THE NAME ──
  let name=forcedName;
  if(!name){
    // Strip trigger words and filler
    clean=clean
      .replace(/^(?:please|add|new|create|schedule|set|a|an|the|event|task|reminder|appointment|sport|adauga|pune|eveniment|sarcina|memento)\s+/gi,'')
      .replace(/\b(?:on|for|at|named?|called?)\b/gi,'')
      .replace(/[-–,;:]+$/,'').replace(/^[-–,;:]+/,'')
      .replace(/\s+/g,' ').trim();
    name=clean;
  }

  if(!name)return'❓ What should I call this event? Try: <em>add task dentist tomorrow at 10am</em>';

  // ── SAVE ──
  if(isSportI&&!(/^(?:add|new|create)\s+task/i.test(raw))){
    if(!S.sportEvents)S.sportEvents=[];
    const sport=guessSport(raw);
    S.sportEvents.push({id:uid(),name,date,time,sport,notes:'',color:SPORT_COLORS[sport]||'#94a3b8'});
    saveState();renderAll();
    return'✅ Sport event added: <b>'+escHtml(name)+'</b><br>📅 '+date+' at '+time+':00';
  } else {
    S.tasks.push({id:uid(),name,date,time,freq:'none',priority:guessPriority(raw),group:guessGroup(name),notes:'',done:false});
    saveState();renderAll();
    return'✅ Task added: <b>'+escHtml(name)+'</b><br>📅 '+(date===TODAY?'today':date)+' at '+time+':00';
  }
}

function sendChat(){
  const inp=document.getElementById('chatIn');
  const text=(inp.value||'').trim();if(!text)return;
  inp.value='';inp.style.height='auto';
  addChatMsg(text,'u');
  setTimeout(()=>addChatMsg(processChat(text),'b'),100);
}

// ─── RENDER ALL ───────────────────────────────────────────
function renderAll(){renderLP();renderCal();}

// ─── BOOT ────────────────────────────────────────────────
renderWx(); // shows loading state until real data arrives
// Load data from server then render
loadFromServer().then(()=>{
  renderAll();
  loadWeather(); // fetch real weather for the saved/default location
  scheduleAllReminders(); // local browser notifications
});

// Weather auto-refresh: re-fetch every 30 minutes so the widget doesn't go
// stale if the app is left open, plus immediately whenever the tab/app
// becomes visible again after being backgrounded (mobile especially).
let _lastWxRefresh = Date.now();
setInterval(()=>{ if(!document.hidden){ loadWeather(); _lastWxRefresh = Date.now(); } }, 30*60*1000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && Date.now()-_lastWxRefresh > 5*60*1000){
    _lastWxRefresh = Date.now();
    loadWeather();
  }
});

// Request notification permission on load and schedule all reminders
requestNotifPermission(function(granted){
  if(granted) scheduleAllReminders();
});
// If permission already granted, schedule immediately
if(typeof Notification!=='undefined' && Notification.permission==='granted'){
  scheduleAllReminders();
}
