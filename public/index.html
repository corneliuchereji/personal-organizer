// ─── WORSHIP SCHEDULE ────────────────────────────────────
// Upload the monthly worship-team image; it is read on this device (text
// recognition in the browser, nothing uploaded), turned into a list to
// check, then added to the calendar. Rules:
//   dd.mm without am/pm = Thursday, 19:00
//   dd.mm am = Sunday morning: 09:00 on the month's first Sunday, else 10:00
//   dd.mm pm = Sunday evening, 18:00
//   any other weekday (or a time that can't be worked out) asks for the time
// Coloured team names are matched to the legend's colours (red = Cină).
const WS_CDN = {
  lib:    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  lang:   'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'
};
const RO_MONTHS=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const RO_FIX={ cina:'Cină', duminica:'Duminică', ziuam:'Ziua M' };
let _ws=null, _wsLib=null, _wsLast=null;
function wsOpts(){ return Object.assign({ group:'', prefix:'Worship', rem:'' }, S.wsOpts||{}); }
function wsNorm(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function wsFixRo(t){ const k=wsNorm(t); return RO_FIX[k] || t; }
function wsLoadLib(){
  if(window.Tesseract) return Promise.resolve();
  if(_wsLib) return _wsLib;
  _wsLib=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=WS_CDN.lib; sc.onload=()=>res(); sc.onerror=()=>{ _wsLib=null; rej(new Error('Couldn’t load the text reader — check the internet connection.')); }; document.head.appendChild(sc); });
  return _wsLib;
}
// ── Pure parsing (no DOM) ──
// words: [{t,x0,y0,x1,y1}]; colorOf(box) -> [r,g,b] average ink colour or null
function wsParse(words, colorOf, now){
  now = now || new Date();
  const W = words.map(w=>({ ...w, t:String(w.t||'').trim(), h:Math.max(1,w.y1-w.y0), yc:(w.y0+w.y1)/2 })).filter(w=>w.t);
  // A dropped dot ("410 am") is fixed when am/pm follows.
  const isAmPm = t => /^(a|p)\.?m\.?$/i.test(t);
  // Lines by vertical position.
  W.sort((a,b)=>a.yc-b.yc);
  const lines=[];
  for(const w of W){
    const L=lines.find(l=>Math.abs(l.yc-w.yc) < Math.max(l.h,w.h)*0.6);
    if(L){ L.w.push(w); L.yc=(L.yc*(L.w.length-1)+w.yc)/L.w.length; L.h=Math.max(L.h,w.h); } else lines.push({ yc:w.yc, h:w.h, w:[w] });
  }
  lines.forEach(l=>l.w.sort((a,b)=>a.x0-b.x0));
  let month=null;
  for(const w of W){ const i=RO_MONTHS.indexOf(wsNorm(w.t)); if(i>=0){ month=i+1; w.used=true; break; } }
  const DATE_RE=/^(\d{1,2})[.,](\d{1,2})[.,]?$/;
  const entries=[];
  for(const l of lines){
    const ws=l.w;
    for(let i=0;i<ws.length;i++){
      let t=ws[i].t;
      if(/^\d{3,4}$/.test(t) && ws[i+1] && isAmPm(ws[i+1].t)) t=t.slice(0,-2)+'.'+t.slice(-2);
      const m=t.match(DATE_RE); if(!m) continue;
      const e={ d:+m[1], m:+m[2], ampm:'', time:'', words:[], box:null };
      ws[i].used=true;
      let j=i+1, prev=ws[i];
      if(ws[j] && isAmPm(ws[j].t)){ e.ampm=ws[j].t[0].toLowerCase()==='a'?'am':'pm'; ws[j].used=true; prev=ws[j]; j++; }
      if(ws[j] && /^\d{1,2}:\d{2}$/.test(ws[j].t)){ e.time=ws[j].t.padStart(5,'0'); ws[j].used=true; prev=ws[j]; j++; }
      while(ws[j] && !DATE_RE.test(ws[j].t) && (ws[j].x0-prev.x1) < Math.max(prev.h,ws[j].h)*1.6){
        if(!e.time && /^\d{1,2}:\d{2}$/.test(ws[j].t)) e.time=ws[j].t.padStart(5,'0'); else e.words.push(ws[j]);
        ws[j].used=true; prev=ws[j]; j++;
      }
      i=j-1;
      if(e.words.length){ const b=e.words; e.box={x0:Math.min(...b.map(x=>x.x0)),y0:Math.min(...b.map(x=>x.y0)),x1:Math.max(...b.map(x=>x.x1)),y1:Math.max(...b.map(x=>x.y1))}; }
      e.name=wsFixRo(e.words.map(x=>x.t).join(' ').replace(/[|_~]+/g,'').trim());
      entries.push(e);
    }
  }
  // Legend: coloured phrases that aren't part of a schedule row.
  const sat = c => c && (Math.max(...c)-Math.min(...c)) > 50;
  const legend=[];
  for(const l of lines){
    let run=[];
    const flush=()=>{ if(!run.length) return; const txt=run.map(x=>x.t).join(' ');
      if(/[a-z]/i.test(txt) && !/^week$/i.test(txt)){ const box={x0:Math.min(...run.map(x=>x.x0)),y0:Math.min(...run.map(x=>x.y0)),x1:Math.max(...run.map(x=>x.x1)),y1:Math.max(...run.map(x=>x.y1))};
        const c=colorOf?colorOf(box):null; if(sat(c)) legend.push({ label:wsFixRo(txt), c }); }
      run=[]; };
    for(const w of l.w){ if(w.used || /^\d+$/.test(w.t) || /^week$/i.test(w.t)){ flush(); continue; } run.push(w); }
    flush();
  }
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
  for(const e of entries){
    const c = e.box && colorOf ? colorOf(e.box) : null;
    e.tag='';
    if(sat(c)){
      let best=null; for(const g of legend){ const dd=dist(c,g.c); if(dd<75 && (!best||dd<best.d)) best={d:dd,g}; }
      if(best && wsNorm(best.g.label)!==wsNorm(e.name)) e.tag=best.g.label;
    }
  }
  // Year: this year, or the next one when the plan is for early next year.
  const cy=now.getFullYear(), cm=now.getMonth()+1;
  const yearFor = m => (m < cm - 6) ? cy+1 : cy;
  const out=[];
  for(const e of entries){
    if(e.m<1||e.m>12||e.d<1) continue;
    const y=yearFor(e.m);
    const dt=new Date(y, e.m-1, e.d);
    if(dt.getMonth()!==e.m-1) continue;                 // 31.11 and the like
    const wd=dt.getDay();
    let kind='special', time=e.time, ask=false;
    if(!time){
      if(wd===4 && !e.ampm){ kind='thu'; time='19:00'; }
      else if(wd===0 && e.ampm==='am'){ kind='sunam'; time = e.d<=7 ? '09:00' : '10:00'; }
      else if(wd===0 && e.ampm==='pm'){ kind='sunpm'; time='18:00'; }
      else ask=true;
    } else { kind = wd===4?'thu':(wd===0?(e.ampm==='pm'?'sunpm':'sunam'):'special'); }
    if(ask) kind = wd===0 ? 'sun' : 'special';
    out.push({ ds: y+'-'+String(e.m).padStart(2,'0')+'-'+String(e.d).padStart(2,'0'), wd, ampm:e.ampm, name:e.name||'', tag:e.tag, kind, time:time||'', ask });
  }
  out.sort((a,b)=>(a.ds+(a.time||'99')).localeCompare(b.ds+(b.time||'99')));
  // Same date + same service twice (OCR echo) → keep one.
  const seen=new Set(); const uniq=out.filter(x=>{ const k=x.ds+'|'+x.ampm+'|'+wsNorm(x.name); if(seen.has(k)) return false; seen.add(k); return true; });
  const mm = month || (uniq.length ? +uniq[0].ds.slice(5,7) : null);
  return { month:mm, year: mm ? yearFor(mm) : cy, entries:uniq, legend };
}
const WS_KIND = { thu:'Thursday', sunam:'Sunday morning', sunpm:'Sunday evening', sun:'Sunday', special:'Special' };

// ── Image → words ──
function wsLoadImg(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>res({ im, url:fr.result }); im.onerror=()=>rej(new Error('That file doesn’t look like an image.')); im.src=fr.result; };
    fr.onerror=()=>rej(new Error('Couldn’t read the file.'));
    fr.readAsDataURL(file);
  });
}
async function wsRecognize(im, onProgress){
  // Scale small screenshots up so the text is big enough to read well.
  const scale=Math.max(1, Math.min(4, 1900/im.naturalWidth));
  const w=Math.round(im.naturalWidth*scale), h=Math.round(im.naturalHeight*scale);
  const src=document.createElement('canvas'); src.width=w; src.height=h;
  const sx=src.getContext('2d',{willReadFrequently:true}); sx.drawImage(im,0,0,w,h);
  const orig=sx.getImageData(0,0,w,h);
  // Black text on white: light cell colours (yellow, blue, grey) drop out.
  const bin=document.createElement('canvas'); bin.width=w; bin.height=h;
  const bx=bin.getContext('2d'); const out=bx.createImageData(w,h);
  for(let i=0;i<orig.data.length;i+=4){
    const l=0.299*orig.data[i]+0.587*orig.data[i+1]+0.114*orig.data[i+2];
    const v=l<185?0:255; out.data[i]=out.data[i+1]=out.data[i+2]=v; out.data[i+3]=255;
  }
  bx.putImageData(out,0,0);
  const colorOf=box=>{
    let r=0,g=0,b=0,n=0;
    const x0=Math.max(0,Math.floor(box.x0)), x1=Math.min(w,Math.ceil(box.x1)), y0=Math.max(0,Math.floor(box.y0)), y1=Math.min(h,Math.ceil(box.y1));
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){ const i=(y*w+x)*4, R=orig.data[i],G=orig.data[i+1],B=orig.data[i+2];
      if(0.299*R+0.587*G+0.114*B < 170){ r+=R; g+=G; b+=B; n++; } }
    return n>20 ? [r/n,g/n,b/n] : null;
  };
  await wsLoadLib();
  const worker = await Tesseract.createWorker('eng', 1, {
    workerPath: WS_CDN.worker, corePath: WS_CDN.core, langPath: WS_CDN.lang,
    logger: m => { if(onProgress) onProgress(m); }
  });
  try{
    await worker.setParameters({ tessedit_pageseg_mode: '6' });
    const { data } = await worker.recognize(bin, {}, { blocks:true, text:true });
    const words=[];
    (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(x=>
      words.push({ t:x.text, x0:x.bbox.x0, y0:x.bbox.y0, x1:x.bbox.x1, y1:x.bbox.y1, conf:x.confidence })))));
    return { words, colorOf };
  } finally { try{ await worker.terminate(); }catch(e){} }
}

function wsTitle(e){ const o=wsOpts(); return (o.prefix||'Worship')+' · '+(e.name||'?')+(e.tag?' · '+e.tag:''); }
function wsMarkExisting(){

    const have=same.find(t=>t.name===wsTitle(e));
    if(have){ e.state='have'; e.on=false; used.add(have.id); continue; }

    // happened would only show up as "overdue". Unticked; can be ticked.
    if(e.ds<TODAY){ e.state='past'; if(!e._touched) e.on=false; continue; }

  // longer has: cancelled, or moved to another time. Past ones are history
  // and are never touched. Ticked for removal unless the user unticks them.

    .filter(t=>t.src==='worship' && !used.has(t.id) && t.date>=TODAY && t.date>=days[0] && t.date<=days[days.length-1])

// Full-screen notes behind a PIN or Face ID / fingerprint (passkey). The
// notes token lives only in memory; the screen locks itself after a few
// idle minutes or when the app has been in the background for a minute.
// Lines written "- [ ] milk" / "- [x] milk" become tick-boxes on the card.
let _nt={ tok:null, notes:[], st:null, view:'list', cur:null, q:'', saveT:null, saving:false, dirty:false, idleT:null, hiddenAt:0, bin:false, pin:'', pin1:null, bioCh:null, menu:false };
const NT_COLORS={ '':'#2a3358', yellow:'#4a4220', green:'#1f3d2c', blue:'#1d3352', purple:'#33264f', pink:'#4a2238', orange:'#4a2f1c' };
const NT_DOT={ '':'#94a3b8', yellow:'#facc15', green:'#4ade80', blue:'#60a5fa', purple:'#c084fc', pink:'#f472b6', orange:'#fb923c' };
const NT_BIO_KEY='org:notesBioId', NT_IDLE_KEY='org:notesIdleMin';
function ntIdleMin(){ try{ const v=+localStorage.getItem(NT_IDLE_KEY); return [1,5,15].includes(v)?v:5; }catch(e){ return 5; } }
function ntBioId(){ try{ return localStorage.getItem(NT_BIO_KEY)||''; }catch(e){ return ''; } }
function ntB64u(buf){ let s=''; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function ntUnb64u(str){ const s=atob(String(str).replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((String(str).length+3)%4)); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
async function ntBioAvailable(){ try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } }
async function ntApi(url, body){
  const r=await fetch(url, body===undefined?{ headers:{'X-Notes-Token':_nt.tok||''} }:{ method:'POST', headers:{'Content-Type':'application/json','X-Notes-Token':_nt.tok||''}, body:JSON.stringify(body) });
  let d={}; try{ d=await r.json(); }catch(e){}
  if(r.status===401 && d.locked){ ntLock('Locked — please unlock again.'); throw new Error('locked'); }
  if(!r.ok && !d.error) d.error='Request failed ('+r.status+')';
  return d;
}

// ── Lock screen ──
async function ntShowLock(msg){

      '<div class="nt-dots" id="ntDots"></div>'+
      ntPad('ntPinKey')+

    '</div></div>';

function ntPad(fn){

function ntDots(n){ const d=document.getElementById('ntDots'); if(!d) return; const len=_nt.pin.length; d.innerHTML=Array.from({length:Math.max(4,len)},(_,i)=>'<span class="'+(i<len?'on':'')+'"></span>').join('')+(len>=4?'<button class="nt-ok" onclick="'+(n||'ntPinSubmit')+'()">OK</button>':''); }
function ntPinKey(k){
  if(_nt.checking) return;
  if(k==='⌫') _nt.pin=_nt.pin.slice(0,-1); else if(_nt.pin.length<8) _nt.pin+=k;
  ntDots();
  if(navigator.vibrate) navigator.vibrate(6);
  // Checked as soon as the last digit is in, like a phone's lock screen.
  const len=(_nt.st||{}).pinLen;
  if(len && _nt.pin.length===len){ _nt.checking=true; setTimeout(async()=>{ try{ await ntPinSubmit(); } finally { _nt.checking=false; } }, 140); }
}
document.addEventListener('keydown', e=>{
  if(!document.getElementById('ntWrap') || !document.querySelector('.nt-pad')) return;
  if(/^\d$/.test(e.key)){ (document.getElementById('ntSetupDots')?ntSetupKey:ntPinKey)(e.key); e.preventDefault(); }
  else if(e.key==='Backspace'){ (document.getElementById('ntSetupDots')?ntSetupKey:ntPinKey)('⌫'); e.preventDefault(); }
  else if(e.key==='Enter'){ (document.getElementById('ntSetupDots')?ntSetupNext:ntPinSubmit)(); e.preventDefault(); }
});
async function ntPinSubmit(){
  if(_nt.pin.length<4) return;
  const msg=document.getElementById('ntLockMsg');
  let d; try{ d=await (await fetch('/api/notes/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:_nt.pin})})).json(); }catch(e){ d={error:'Couldn’t reach the server.'}; }
  _nt.pin=''; ntDots();
  if(!d.token){
    if(msg) msg.innerHTML='<span style="color:#fca5a5">'+escHtml(d.error||'Wrong PIN.')+(d.triesLeft!=null&&d.triesLeft<5&&d.triesLeft>0?' '+d.triesLeft+' tries left.':'')+'</span>';
    const dots=document.getElementById('ntDots'); if(dots){ dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }

}
async function ntBioUnlock(){
  const msg=document.getElementById('ntLockMsg');
  try{
    const ch=_nt.bioCh; _nt.bioCh=null;
    if(!ch || !ch.challenge) throw new Error(ch&&ch.error||'Try again.');
    const cred=await navigator.credentials.get({ publicKey:{ challenge:ntUnb64u(ch.challenge), rpId:location.hostname, timeout:60000, userVerification:'required',
      allowCredentials:[{ type:'public-key', id:ntUnb64u(ntBioId()) }] } });
    const r=cred.response;
    const d=await (await fetch('/api/notes/bio/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      id:cred.id, clientDataJSON:ntB64u(r.clientDataJSON), authenticatorData:ntB64u(r.authenticatorData), signature:ntB64u(r.signature) })})).json();
    if(!d.token) throw new Error(d.error||'Not accepted.');
    await ntUnlocked(d.token);
  }catch(e){
    if(msg) msg.innerHTML='<span style="color:#fca5a5">'+escHtml(e.name==='NotAllowedError'?'Cancelled — use your PIN or try again.':(e.message||'Didn’t work.'))+'</span>';
    try{ _nt.bioCh=await (await fetch('/api/notes/bio/begin',{method:'POST'})).json(); }catch(err){}
  }
}
async function ntUnlocked(tok){
  _nt.tok=tok; ntTouch();

  try{ _nt.st=await (await fetch('/api/notes/status',{headers:{'X-Notes-Token':tok}})).json(); }catch(e){}
  await ntLoad();
  ntShowList();
  // Offer Face ID / fingerprint on this device once.
  const st=_nt.st||{};
  if(!ntBioId() && await ntBioAvailable()){
    let asked=false; try{ asked=localStorage.getItem('org:notesBioAsked')==='1'; }catch(e){}
    if(!asked){ const b=document.getElementById('ntBanner'); if(b) b.innerHTML='<div class="nt-banner"><i class="ti ti-fingerprint"></i><span>Unlock next time with Face ID / fingerprint?</span><button class="btn sm acc" onclick="ntBioRegister()">Turn on</button><button class="btn sm" onclick="ntBioNo()">Not now</button></div>'; }
  }
}
function ntBioNo(){ try{ localStorage.setItem('org:notesBioAsked','1'); }catch(e){} const b=document.getElementById('ntBanner'); if(b) b.innerHTML=''; }
async function ntBioRegister(){
  const say=t=>{ const b=document.getElementById('ntBanner'); if(b) b.innerHTML='<div class="nt-banner">'+t+'</div>'; };
  try{
    const beg=await ntApi('/api/notes/bio/register-begin',{});
    if(beg.error) throw new Error(beg.error);
    const label=(navigator.userAgent.match(/(iPhone|iPad|Android|Windows|Macintosh)/)||['Device'])[0];
    const cred=await navigator.credentials.create({ publicKey:{
      challenge:ntUnb64u(beg.challenge), rp:{ name:'Personal Organizer', id:location.hostname },
      user:{ id:ntUnb64u(beg.userId), name:'notes', displayName:'Organizer notes' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257},{type:'public-key',alg:-8}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      excludeCredentials:(beg.exclude||[]).map(id=>({type:'public-key', id:ntUnb64u(id)})), timeout:60000, attestation:'none' } });
    const r=cred.response;
    if(typeof r.getPublicKey!=='function' || !r.getPublicKey()) throw new Error('This browser can’t set it up — please update it.');
    const d=await ntApi('/api/notes/bio/register-finish',{ id:cred.id, clientDataJSON:ntB64u(r.clientDataJSON), publicKey:ntB64u(r.getPublicKey()), alg:r.getPublicKeyAlgorithm(), label });
    if(d.error) throw new Error(d.error);
    try{ localStorage.setItem(NT_BIO_KEY, cred.id); localStorage.setItem('org:notesBioAsked','1'); }catch(e){}
    _nt.st=await (await fetch('/api/notes/status',{headers:{'X-Notes-Token':_nt.tok}})).json();
    say('<i class="ti ti-circle-check" style="color:var(--green)"></i><span>Done — next time unlock with Face ID / fingerprint.</span>');
    setTimeout(()=>say(''),4000);
  }catch(e){ if(e.message!=='locked') say('<i class="ti ti-alert-triangle" style="color:#fca5a5"></i><span>'+escHtml(e.name==='NotAllowedError'?'Cancelled.':(e.message||'Didn’t work.'))+'</span><button class="btn sm" onclick="ntBioNo()">Close</button>'); }

function ntRel(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; const d=new Date(ts);

function ntNorm(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,''); }

// ── Formatted notes ──
// Notes are stored as simple HTML made by the editor. Anything coming from
// the server or the clipboard is cleaned first: only formatting tags stay,
// and pictures are referenced by id (<img data-nimg>), their address added
// here with the notes token.
const NT_FONTS={ sans:'-apple-system, Segoe UI, Roboto, sans-serif', serif:'Georgia, Times New Roman, serif', mono:'ui-monospace, Menlo, Consolas, monospace', hand:'Bradley Hand, Segoe Print, Comic Sans MS, cursive' };
const NT_TEXTCOL=['#e8ecf8','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6','#fb923c','#f87171','#94a3b8'];
const NT_TAGS=new Set(['DIV','P','BR','B','STRONG','I','EM','U','S','STRIKE','FONT','SPAN','UL','OL','LI','H1','H2','H3','BLOCKQUOTE','A','IMG']);
function ntSanitize(html){
  const doc=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
  const root=doc.body.firstChild;
  const clean=node=>{
    for(const ch of [...node.childNodes]){
      if(ch.nodeType===3) continue;
      if(ch.nodeType!==1){ ch.remove(); continue; }
      if(!NT_TAGS.has(ch.tagName)){
        if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|NOSCRIPT|TITLE|HEAD|META|LINK)$/.test(ch.tagName)){ ch.remove(); continue; }
        clean(ch); ch.replaceWith(...ch.childNodes); continue;                  // unknown tag: keep its text
      }
      for(const at of [...ch.attributes]){
        const n=at.name.toLowerCase(), v=at.value;
        let ok=false;
        if(n==='class') ok=true;
        else if(n==='face' && ch.tagName==='FONT') ok=/^[\w ,\-]+$/.test(v);
        else if(n==='color' && ch.tagName==='FONT') ok=/^(#[0-9a-f]{3,8}|rgb\([\d, ]+\))$/i.test(v);
        else if(n==='size' && ch.tagName==='FONT') ok=/^[1-7]$/.test(v);
        else if(n==='href' && ch.tagName==='A') ok=/^(https?:|mailto:|tel:)/i.test(v);
        else if(n==='data-nimg' && ch.tagName==='IMG') ok=/^i[0-9a-f]{18}$/.test(v);
        else if(n==='style'){ const keep=String(v).split(';').map(x=>x.trim()).filter(x=>/^(color|font-weight|font-style|text-decoration(-line)?|font-family|font-size)\s*:\s*[#\w\s,.%()\-"']+$/i.test(x) && !/url|expression/i.test(x)); if(keep.length){ ch.setAttribute('style',keep.join(';')); } else ch.removeAttribute('style'); continue; }
        if(!ok) ch.removeAttribute(at.name);
      }
      if(ch.hasAttribute('class')){ const c=ch.getAttribute('class').split(/\s+/).filter(x=>x==='ck'||x==='on'); if(c.length) ch.setAttribute('class',c.join(' ')); else ch.removeAttribute('class'); }
      if(ch.tagName==='IMG' && !ch.getAttribute('data-nimg')){ ch.remove(); continue; }
      if(ch.tagName==='A'){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener'); }
      clean(ch);
    }
  };
  clean(root);
  return root.innerHTML;
}
// Plain-text notes from before formatting: "- [ ] x" lines become tick-boxes.
function ntTextToHtml(t){
  const L=String(t||'').split('\n'); let out='', ul=false;
  for(const line of L){
    const ck=line.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/), bl=line.match(/^\s*[•*-] (.*)$/);
    if(bl && !ck){ if(!ul){ out+='<ul>'; ul=true; } out+='<li>'+escHtml(bl[1])+'</li>'; continue; }
    if(ul){ out+='</ul>'; ul=false; }
    if(ck) out+='<div class="ck'+(ck[1]!==' '?' on':'')+'">'+(escHtml(ck[2])||'<br>')+'</div>';
    else out+='<div>'+(line.trim()?escHtml(line):'<br>')+'</div>';
  }
  if(ul) out+='</ul>';
  return out;
}
function ntImgSrc(id){ return '/api/notes/img/'+id+'?t='+encodeURIComponent(_nt.tok||''); }
function ntWithImgs(html){ return String(html||'').replace(/<img data-nimg="(i[0-9a-f]{18})">/g,(m,id)=>'<img data-nimg="'+id+'" src="'+ntImgSrc(id)+'" alt="" loading="lazy">'); }
function ntPlain(n){ return String(n.body||'').replace(/<(br|\/div|\/p|\/li|\/h\d)[^>]*>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); }
// Links in card previews become tappable.
function ntLinkifyEl(el){
  const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const hits=[];
  while(w.nextNode()){ const t=w.currentNode; if(t.parentElement.closest('a')) continue; if(/https?:\/\/\S/.test(t.nodeValue)) hits.push(t); }
  hits.forEach(t=>{ const span=document.createElement('span'); span.innerHTML=ntLink(escHtml(t.nodeValue)); t.replaceWith(...span.childNodes); });
}
function ntPreview(n){
  return '<div class="nt-prev nt-rich" data-id="'+n.id+'">'+ntWithImgs(n.body)+'</div>';
}
// Ticking a box straight from the card.
function ntPrevTap(e){
  const ck=e.target.closest('.nt-prev .ck'); if(!ck) return false;
  const r=ck.getBoundingClientRect(); if(e.clientX - r.left > 34) return false;
  e.preventDefault(); e.stopPropagation();
  const prev=ck.closest('.nt-prev'), idx=[...prev.querySelectorAll('.ck')].indexOf(ck);
  ntToggleTick(prev.dataset.id, idx); return true;
}
async function ntToggleTick(id, idx){
  const n=_nt.notes.find(x=>x.id===id); if(!n) return;
  const box=document.createElement('div'); box.innerHTML=n.body;
  const ck=box.querySelectorAll('.ck')[idx]; if(!ck) return;
  ck.classList.toggle('on');
  n.body=box.innerHTML; const base=n.updated; n.updated=Date.now();
  ntRenderCards();
  if(navigator.vibrate) navigator.vibrate(6);
  try{ const d=await ntApi('/api/notes/save',{ note:{ id:n.id, title:n.title, body:n.body, fmt:'html', color:n.color, pinned:n.pinned, base } }); if(d.note){ if(d.conflict){ await ntLoad(); ntRenderCards(); } else { n.updated=d.note.updated; } } }catch(e){}
}
// ── Editor ──
function ntNew(){ _nt.cur={ id:null, title:'', body:'', color:'', pinned:false, updated:Date.now(), base:0 }; ntShowEdit(true); }
function ntOpen(id){ const n=_nt.notes.find(x=>x.id===id); if(!n) return; _nt.cur={ ...n, base:n.updated }; ntShowEdit(false); }
const NT_TB=[
  ['bold','ti-bold','Bold'],['italic','ti-italic','Italic'],['underline','ti-underline','Underline'],['strikeThrough','ti-strikethrough','Strikethrough'],
  ['|'],['@font','ti-typography','Font'],['@size','ti-text-size','Text size'],['@color','ti-palette','Text colour'],
  ['|'],['@check','ti-checkbox','Tick-box'],['insertUnorderedList','ti-list','Bullet list'],['insertOrderedList','ti-list-numbers','Numbered list'],
  ['|'],['@img','ti-photo','Picture'],['@date','ti-calendar','Date'],['removeFormat','ti-clear-formatting','Clear formatting']
];
function ntShowEdit(isNew){

    '</div>'+
    '<div class="nt-pop" id="ntPop" hidden></div>'+
    '<div class="nt-tools" id="ntTools">'+NT_TB.map(b=>b[0]==='|'?'<span class="nt-sep"></span>':'<button data-cmd="'+b[0]+'" aria-label="'+b[2]+'" title="'+b[2]+'"><i class="ti '+b[1]+'"></i></button>').join('')+'</div>'+

function ntMarkEmpty(){ const b=document.getElementById('ntBody'); if(b) b.classList.toggle('empty', !b.textContent.trim() && !b.querySelector('img,.ck,li')); }
let _ntSel=null;
function ntSaveSel(){ const s=getSelection(); const b=document.getElementById('ntBody'); if(s.rangeCount && b && b.contains(s.anchorNode)) _ntSel=s.getRangeAt(0).cloneRange(); }
function ntRestoreSel(){ const b=document.getElementById('ntBody'); if(!b) return;
  // Already typing in the note: leave the cursor alone (re-setting it would drop a just-chosen style).
  if(document.activeElement===b && getSelection().rangeCount && b.contains(getSelection().anchorNode)) return;
  b.focus({preventScroll:true}); if(_ntSel){ const s=getSelection(); s.removeAllRanges(); s.addRange(_ntSel); } }
function ntSelChanged(){
  const b=document.getElementById('ntBody'); if(!b){ document.removeEventListener('selectionchange', ntSelChanged); return; }
  ntSaveSel();
  // Light up the buttons whose style is on at the cursor.
  const t=document.getElementById('ntTools'); if(!t || !b.contains(getSelection().anchorNode)) return;
  ['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList'].forEach(c=>{ const x=t.querySelector('[data-cmd="'+c+'"]'); if(x) x.classList.toggle('on', document.queryCommandState(c)); });
  const blk=ntBlock(); const x=t.querySelector('[data-cmd="@check"]'); if(x) x.classList.toggle('on', !!(blk && blk.classList.contains('ck')));
}
// The block (line) the cursor is in.
function ntBlock(){
  const b=document.getElementById('ntBody'), s=getSelection(); if(!b || !s.rangeCount) return null;
  let n=s.anchorNode; if(!b.contains(n)) return null;
  while(n && n.parentNode!==b){ n=n.parentNode; }
  return n && n.nodeType===1 ? n : null;
}
function ntTool(cmd, btn){
  const pop=document.getElementById('ntPop');
  if(cmd[0]!=='@' || cmd==='@check' || cmd==='@date') pop.hidden=true;
  ntRestoreSel();
  if(cmd[0]!=='@'){ document.execCommand(cmd, false, null); ntAfterEdit(); return; }
  if(cmd==='@check') return ntCheckLine();
  if(cmd==='@date'){ document.execCommand('insertText', false, new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' '); return ntAfterEdit(); }
  if(cmd==='@img'){ ntSaveSel(); document.getElementById('ntFile').click(); return; }
  // Small pop-overs: font, size, colour.
  if(!pop.hidden && pop.dataset.kind===cmd){ pop.hidden=true; return; }
  pop.dataset.kind=cmd; pop.hidden=false;
  if(cmd==='@font') pop.innerHTML=[['sans','Sans'],['serif','Serif'],['mono','Mono'],['hand','Hand']].map(f=>'<button style="font-family:'+NT_FONTS[f[0]]+'" data-v="'+f[0]+'">'+f[1]+'</button>').join('');
  if(cmd==='@size') pop.innerHTML=[['2','Small','13px'],['3','Normal','16px'],['5','Large','21px'],['6','Huge','27px']].map(f=>'<button data-v="'+f[0]+'" style="font-size:'+f[2]+'">'+f[1]+'</button>').join('');
  if(cmd==='@color') pop.innerHTML=NT_TEXTCOL.map(c=>'<button class="nt-swatch" data-v="'+c+'" style="background:'+c+'" aria-label="Colour '+c+'"></button>').join('');
  pop.onmousedown=e=>e.preventDefault();
  pop.onclick=e=>{ const x=e.target.closest('button'); if(!x) return; ntRestoreSel();
    if(cmd==='@font') document.execCommand('fontName', false, NT_FONTS[x.dataset.v]);
    if(cmd==='@size') document.execCommand('fontSize', false, x.dataset.v);
    if(cmd==='@color') document.execCommand('foreColor', false, x.dataset.v);
    pop.hidden=true; ntAfterEdit(); };
}
function ntAfterEdit(){ ntMarkEmpty(); ntChanged(); ntSelChanged(); }
// Turns the current line(s) into tick-boxes, or back to plain lines.
function ntCheckLine(){
  const b=document.getElementById('ntBody');
  let blk=ntBlock();
  if(!blk || blk.tagName==='BR' || !/^(DIV|P|H1|H2|H3)$/.test(blk.tagName)){ document.execCommand('formatBlock', false, 'div'); blk=ntBlock(); }
  if(!blk){ b.insertAdjacentHTML('beforeend','<div class="ck"><br></div>'); blk=b.lastChild; const r=document.createRange(); r.setStart(blk,0); r.collapse(true); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  else if(blk.classList.contains('ck')){ blk.classList.remove('ck','on'); }
  else blk.classList.add('ck');
  ntAfterEdit();
}
function ntCkHit(pt, target){
  const ck=(target||pt.target)?.closest && (target||pt.target).closest('#ntBody .ck'); if(!ck) return false;
  const r=ck.getBoundingClientRect(); return pt.clientX - r.left <= 32 ? ck : false;
}
let _ntCkTouchAt=0;
function ntCkToggleAt(pt, target){ const ck=ntCkHit(pt, target); if(!ck) return; ck.classList.toggle('on'); if(navigator.vibrate) navigator.vibrate(6); ntChanged(true); }
function ntEdClick(e){
  if(ntCkHit(e)){ if(Date.now()-_ntCkTouchAt > 700) ntCkToggleAt(e); return; }   // a tap already toggled it in touchstart
  const img=e.target.closest('#ntBody img');
  document.querySelectorAll('#ntBody img.sel').forEach(x=>{ if(x!==img) x.classList.remove('sel'); });
  if(img){ img.classList.toggle('sel'); ntImgBar(img.classList.contains('sel')?img:null); } else ntImgBar(null);
}
// A tapped picture gets a small bar to remove it.
function ntImgBar(img){
  const pop=document.getElementById('ntPop'); if(!pop) return;
  if(!img){ if(pop.dataset.kind==='@imgsel') pop.hidden=true; return; }
  pop.dataset.kind='@imgsel'; pop.hidden=false;
  pop.innerHTML='<button class="red" id="ntImgDel"><i class="ti ti-trash"></i> Remove picture</button>';
  pop.onclick=e=>{ if(e.target.closest('#ntImgDel')){ img.remove(); pop.hidden=true; ntAfterEdit(); } };
}
function ntEdKey(e){
  if(e.key==='Enter' && !e.shiftKey){
    const blk=ntBlock();
    if(blk && blk.classList.contains('ck')){
      if(!blk.textContent.trim()){ e.preventDefault(); blk.classList.remove('ck','on'); ntAfterEdit(); return; }   // empty tick-box ends the list
      // The new line copies the old one: make sure it starts unticked.
      setTimeout(()=>{ const nb=ntBlock(); if(nb && nb!==blk) nb.classList.remove('on'); ntCaretIntoView(); ntChanged(); }, 0);
    }
    setTimeout(ntCaretIntoView, 30);
  }
  if((e.metaKey||e.ctrlKey) && /^[biu]$/i.test(e.key)){ e.preventDefault(); document.execCommand({b:'bold',i:'italic',u:'underline'}[e.key.toLowerCase()]); ntAfterEdit(); }
}
// Keep the line being typed visible above the keyboard.
function ntCaretIntoView(){
  const sc=document.getElementById('ntScrollEd'), s=getSelection(); if(!sc || !s.rangeCount) return;
  const r=s.getRangeAt(0).cloneRange(); let rect=r.getBoundingClientRect();
  if(!rect || (!rect.height && !rect.top)){ const blk=ntBlock(); if(!blk) return; rect=blk.getBoundingClientRect(); }
  const box=sc.getBoundingClientRect();
  const bottom=box.bottom-24, top=box.top+8;
  if(rect.bottom > bottom) sc.scrollTop += rect.bottom-bottom;
  else if(rect.top < top) sc.scrollTop -= top-rect.top;
}
// Pasting keeps the words, not the other app's styling; pasted pictures are added as pictures.
function ntPaste(e){
  const cd=e.clipboardData; if(!cd) return;
  const file=[...(cd.files||[])].find(f=>/^image\//.test(f.type));
  e.preventDefault();
  if(file){ ntSaveSel(); ntAddImage(file); return; }
  const t=cd.getData('text/plain'); if(t) document.execCommand('insertText', false, t);
  ntAfterEdit();
}
function ntPickedImage(e){ const f=e.target.files && e.target.files[0]; e.target.value=''; if(f) ntAddImage(f); }
// Pictures are shrunk on the phone first (longest side 1600 px, JPEG) so
// they upload quickly and stay small on the server.
async function ntAddImage(file){
  ntSavedLabel('Adding picture…');
  try{
    let bmp; try{ bmp=await createImageBitmap(file, { imageOrientation:'from-image' }); }catch(e){ bmp=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=URL.createObjectURL(file); }); }
    const W=bmp.width, H=bmp.height; let sc=Math.min(1, 1600/Math.max(W,H));
    let data='';
    for(let q=0.82, k=0; k<5; k++){
      const c=document.createElement('canvas'); c.width=Math.round(W*sc); c.height=Math.round(H*sc);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      data=c.toDataURL('image/jpeg', q);
      if(data.length < 1100000) break;
      q-=0.12; sc*=0.85;
    }
    const d=await ntApi('/api/notes/img',{ data });
    if(!d.id) throw new Error(d.error||'Upload failed');
    ntRestoreSel();
    document.execCommand('insertHTML', false, '<img data-nimg="'+d.id+'" src="'+ntImgSrc(d.id)+'" alt=""><div><br></div>');
    ntAfterEdit(); setTimeout(ntCaretIntoView, 300);
  }catch(e){ if(e.message!=='locked') ntSavedLabel('Picture not added — '+(e.message||'try again')); }
}
// The editor's HTML as stored: picture addresses (which carry the token) removed.
function ntEditorHtml(){
  const b=document.getElementById('ntBody'); if(!b) return _nt.cur ? _nt.cur.body : '';
  const c=b.cloneNode(true);
  c.querySelectorAll('img').forEach(i=>{ i.removeAttribute('src'); i.removeAttribute('alt'); i.removeAttribute('loading'); i.classList.remove('sel'); if(!i.className) i.removeAttribute('class'); });
  let h=ntSanitize(c.innerHTML);
  if(!c.textContent.trim() && !c.querySelector('img,.ck')) h='';

// Splits text into lines that fit the width; the text's own line breaks are kept.
function bwWrapPara(ctx, words, maxW){
  const out=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width<=maxW || !line) line=t; else { out.push(line); line=w; } }
  if(line) out.push(line);
  return out;
}
// Lines are balanced (no single word left alone on the last line): the
// narrowest width that needs no extra line is used.
function bwWrap(ctx, text, maxW){
  const out=[];
  for(const para of String(text||'').split('\n')){
    const words=para.trim().split(/\s+/).filter(Boolean); if(!words.length) continue;
    const n=bwWrapPara(ctx, words, maxW).length;
    let lo=maxW*0.45, hi=maxW;
    if(n>1) for(let i=0;i<14;i++){ const mid=(lo+hi)/2; if(bwWrapPara(ctx, words, mid).length<=n) hi=mid; else lo=mid; }
    out.push(...bwWrapPara(ctx, words, n>1?hi:maxW));
  }
  return out;
}
function bwDraw(now){

function bwPaint(cv){
  if(!cv) return;
  const S=BW_SIZES.find(s=>s.id===_bw.size)||BW_SIZES[0];
  cv.width=S.w; cv.height=S.h;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,S.w,S.h);
  const portrait=S.h>S.w;
  const minSide=Math.min(S.w,S.h);
  const marginX=portrait?S.w*0.07:S.w*0.03, marginB=S.h*(portrait?0.14:0.12), marginT=S.h*(portrait?0.24:0.12);
  const maxW=portrait?S.w*0.86:(S.w/S.h>2?S.w*0.40:S.w*0.48);
  // Blocks to draw, in order.
  const blocks=[];
  if(_bw.mode==='verse'){
    ['en','he','ro'].forEach(k=>{ if(_bw.show[k] && String(_bw[k]).trim()) blocks.push({ k, text:_bw[k] }); });
    if(String(_bw.label).trim()) blocks.push({ k:'ref', text:'—  '+_bw.label.trim()+'  —' });
  } else {
    if(String(_bw.quote).trim()) blocks.push({ k:'q', text:_bw.quote.trim() });
    if(String(_bw.author).trim()) blocks.push({ k:'ref', text:'—  '+_bw.author.trim()+'  —' });
  }
  const dim=document.getElementById('bwDim'); if(dim) dim.textContent=S.w+' × '+S.h;
  if(!blocks.length){ ctx.fillStyle='#333'; ctx.font='italic '+Math.round(minSide*0.03)+'px Georgia'; ctx.textAlign='center'; ctx.fillText(_bw.mode==='verse'?'Type a reference, e.g. Prov 12:9':'Type your quote', S.w/2, S.h/2); return; }
  // Fit: start from the chosen size and shrink until the whole text fits.
  let base=minSide*0.0325*_bw.scale, lay;
  for(let tries=0; tries<12; tries++){
    lay=[]; let total=0;
    blocks.forEach((b,i)=>{
      const st=BW_STYLE[b.k], px=base*st.scale;
      ctx.font=st.style+' '+st.weight+' '+px+'px '+st.font;
      const lines=bwWrap(ctx, b.text, maxW);
      const lh=px*(b.k==='ref'?1.4:1.3);
      const gap=i===0?0:(b.k==='ref'?base*0.95:base*1.15);
      lay.push({ ...b, st, px, lines, lh, gap }); total+=gap+lines.length*lh;
    });
    lay.total=total;
    if(total <= S.h-(marginT+marginB)*(_bw.pos==='c'?0.6:1)) break;
    base*=0.92;
  }
  const right=_bw.pos==='br'||_bw.pos==='tr', centre=_bw.pos==='c';
  ctx.textAlign=centre?'center':right?'right':'left';
  ctx.textBaseline='alphabetic';
  const x=centre?S.w/2:right?S.w-marginX:marginX;
  let y=_bw.pos==='c'?(S.h-lay.total)/2:_bw.pos==='tr'?marginT*0.6:S.h-marginB-lay.total;
  for(const b of lay){
    y+=b.gap;
    ctx.font=b.st.style+' '+b.st.weight+' '+b.px+'px '+b.st.font; ctx.fillStyle=b.st.color;
    if('letterSpacing' in ctx) ctx.letterSpacing=b.k==='ref'?(b.px*0.06)+'px':'0px';
    for(const ln of b.lines){ y+=b.lh; ctx.fillText(ln, x, y-b.lh*0.24); }
  }
  if('letterSpacing' in ctx) ctx.letterSpacing='0px';
}

  // Minutes this zone is ahead of UTC right now.
  try{
    const d=new Date(); const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(d);
    const g=t=>parseInt(parts.find(p=>p.type===t).value);
    const asUTC=Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'));
    return Math.round((asUTC-d.getTime())/60000);
  }catch(e){ return 0; }
}
function clockDiff(tz){
  const diff=tzOffsetMin(tz)-tzOffsetMin('Europe/Bucharest');
  if(!diff) return 'same time';
  const h=Math.trunc(diff/60), m=Math.abs(diff%60);
  return (diff>0?'+':'−')+Math.abs(h)+(m?':'+String(m).padStart(2,'0'):'')+' h';
}
function wxEmoji(code, day){
  if(code==null) return '';
  if(code===0) return day?'☀️':'🌙';
  if(code<=2) return day?'🌤️':'☁️';
  if(code===3) return '☁️';
  if(code===45||code===48) return '🌫️';
  if(code>=95) return '⛈️';
  if((code>=71&&code<=77)||code===85||code===86) return '❄️';
  if(code>=80) return '🌦️';
  return '🌧️';
}

// ─── PUBLIC HOLIDAYS ─────────────────────────────────────
// Nager.Date (free, no key) through the server; Romania's legal holidays are

let _holYear=null, _holNext='';
const HOL_COUNTRIES=[['RO','Romania'],['HU','Hungary'],['AT','Austria'],['DE','Germany'],['IT','Italy'],['GB','United Kingdom'],['CA','Canada'],['US','United States']];
async function openHolidays(){
  _holYear=_holYear||parseInt(TODAY.slice(0,4));
  const y0=parseInt(TODAY.slice(0,4));
  showModal('Public holidays',
    '<div class="hol-bar">'+
      '<div class="hol-years">'+[y0,y0+1].map(y=>'<button class="hol-yr'+(y===_holYear?' on':'')+'" onclick="_holYear='+y+';openHolidays()">'+y+'</button>').join('')+'</div>'+
      '<select id="holCc" onchange="S.holCountry=this.value;saveState();openHolidays()">'+

  const list=d.holidays||[];
  _holList={ list, cc, year:_holYear };
  const nextIdx=list.findIndex(h=>h.date>=TODAY);
  if(nextIdx>=0 && _holYear===y0){
    const n=list[nextIdx], days=Math.round((parseD(n.date)-parseD(TODAY))/86400000);
    _holNext=n.name+' · '+(days===0?'today':days===1?'tomorrow':'in '+days+' days');
  }
  // This year: what's ahead comes first; the ones already gone fold away.
  const pastN = (_holYear===y0) ? list.filter(h=>h.date<TODAY).length : 0;
  el.innerHTML=holAllBar()+(pastN ? '<button class="hol-more" onclick="this.parentNode.classList.toggle(\'show-past\');this.textContent=this.parentNode.classList.contains(\'show-past\')?\'Hide earlier holidays\':\'Show '+pastN+' earlier this year\'">Show '+pastN+' earlier this year</button>' : '')+
  list.map((h,i)=>{
    const dt=parseD(h.date), days=Math.round((dt-parseD(TODAY))/86400000);
    const when=days===0?'Today':days===1?'Tomorrow':days>0?'in '+days+' days':Math.abs(days)+' days ago';
    const evs=agendaEventsOnDay(h.date).length;
    return '<div class="hol-row'+(days<0?' past':'')+(i===nextIdx?' next':'')+'">'+
      '<div class="hol-date"><b>'+dt.getDate()+'</b><span>'+dt.toLocaleDateString('en-GB',{month:'short'})+'</span></div>'+
      '<div class="hol-main"><div class="hol-name">'+escHtml(h.localName||h.name)+'</div>'+
        '<div class="hol-sub">'+(h.localName&&h.localName!==h.name?escHtml(h.name)+' · ':'')+dt.toLocaleDateString('en-GB',{weekday:'long'})+' · '+when+
        (evs?' · <span class="hol-busy">'+evs+' scheduled</span>':'')+'</div></div>'+
      '<div class="hol-acts">'+(days>=0?holBtn(i):'')+
        '<button class="btn sm hol-see" onclick="holGo(\''+h.date+'\')" aria-label="See in calendar"><i class="ti ti-calendar"></i></button></div>'+
    '</div>';
  }).join('')+
  '<div class="cc-foot">'+(d.source==='local'?'Romanian legal holidays, worked out on this server (Orthodox Easter included).':'Source: Nager.Date public holidays.')+'</div>';
}
// ── Add holidays to the calendar ──
// A holiday becomes an all-day calendar entry in a "Holidays" group. It
// never goes overdue, and tapping again takes it back out.
let _holList=null;
function holTask(h){ return S.tasks.find(t=>t.src==='holiday' && t.date===h.date); }
function holBtn(i){
  const h=_holList.list[i];
  return holTask(h)
    ? '<button class="btn sm hol-in" id="holB'+i+'" onclick="holToggle('+i+')" aria-label="Remove from calendar"><i class="ti ti-check"></i> In calendar</button>'
    : '<button class="btn sm hol-add" id="holB'+i+'" onclick="holToggle('+i+')"><i class="ti ti-calendar-plus"></i> Add</button>';
}
function holUpcoming(){ return _holList ? _holList.list.map((h,i)=>({h,i})).filter(x=>x.h.date>=TODAY) : []; }
function holAllBar(){
  const up=holUpcoming(); if(!up.length) return '';
  const missing=up.filter(x=>!holTask(x.h)).length;
  return '<div class="hol-all" id="holAll">'+(missing
    ? '<span>'+up.length+' coming up · '+(up.length-missing)+' in your calendar</span><button class="btn sm acc" onclick="holAddAll()"><i class="ti ti-calendar-plus"></i> Add all '+missing+'</button>'
    : '<span><i class="ti ti-circle-check" style="color:var(--green)"></i> All '+up.length+' upcoming holidays are in your calendar</span>')+'</div>';
}
function holGroup(){
  if(!S.groups.some(g=>g.id==='g_holidays')) S.groups.push({ id:'g_holidays', name:'Holidays', color:'#fb7185' });
  return 'g_holidays';
}
function holMake(h){
  return { id:uid(), name:CC_FLAG(_holList.cc)+' '+(h.localName||h.name), date:h.date, time:'', freq:'none', priority:'normal', group:holGroup(),
    notes:(h.localName&&h.localName!==h.name?h.name+' · ':'')+'Public holiday', done:false, reminders:[], reminder:'', src:'holiday' };
}
function holRefreshUi(){
  const up=holUpcoming();
  up.forEach(({i})=>{ const b=document.getElementById('holB'+i); if(b) b.outerHTML=holBtn(i); });
  const a=document.getElementById('holAll'); if(a) a.outerHTML=holAllBar();
}
function holToggle(i){
  const h=_holList.list[i], t=holTask(h);
  if(t) S.tasks=S.tasks.filter(x=>x.id!==t.id);
  else S.tasks.push(holMake(h));
  saveState(); renderAll(); holRefreshUi();
  if(navigator.vibrate) navigator.vibrate(8);
}
function holAddAll(){
  const add=holUpcoming().filter(x=>!holTask(x.h));
  add.forEach(x=>S.tasks.push(holMake(x.h)));
  saveState(); renderAll(); holRefreshUi();
  if(add.length) showToast('<i class="ti ti-calendar-plus"></i> '+add.length+' holiday'+(add.length>1?'s':'')+' added to the calendar');
}
function holGo(ds){
  closeModal();
  openOnDate(ds);
  const lp=document.getElementById('lp');
  if(lp) lp.scrollIntoView({behavior:'smooth', block:'start'});
}

let _cc = null;
const CC_FLAG = cc => (cc && cc.length===2) ? String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : '';
async function openConcerts(){

async function ccLoad(msg){
  try{ _cc = await (await fetch('/api/concerts')).json(); }catch(e){ _cc = { error:'Couldn’t reach the server.' }; }

function ccAgo(iso){
  if(!iso) return 'not checked yet';
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if(m < 2) return 'checked just now';
  if(m < 60) return 'checked '+m+' min ago';
  const h = Math.round(m/60);
  return h < 24 ? 'checked '+h+' h ago' : 'checked '+new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function ccRender(msg){
  const el = document.getElementById('ccBody'); if(!el || !_cc) return;

  const c = _cc;
  let h = '';
  if(!c.hasKey){

        escHtml(a.name)+'<button onclick="ccUnfollow(\''+escHtml(a.id)+'\',\''+escHtml(a.name).replace(/'/g,'')+'\')" aria-label="Stop following '+escHtml(a.name)+'"><i class="ti ti-x"></i></button></span>').join('')+'</div>'
    : '<div class="cc-empty">No artists yet — search above.</div>';
  // Dates
  const evs = c.events || [];
  h += '<div class="slabel" style="margin-top:14px"><i class="ti ti-calendar-event"></i> Upcoming in Europe <span class="cc-sub">'+ccAgo(c.lastSync)+'</span></div>';

      lastMonth = mk;
      const day = new Date(e.date+'T12:00:00');
      const when = e.timeTbc ? 'time TBC' : (e.localTime||e.time)+' local'+(e.time && e.localTime && e.time!==e.localTime ? ' · '+e.time+' RO' : '');
      return head+'<div class="cc-row'+(e.inCalendar?' in':'')+'">'+
        '<div class="cc-date"><b>'+day.getDate()+'</b><span>'+day.toLocaleDateString('en-GB',{weekday:'short'})+'</span></div>'+

          '<div class="cc-where">'+CC_FLAG(e.countryCode)+' '+escHtml([e.city, e.venue].filter(Boolean).join(' · '))+'</div>'+

          '<div class="cc-acts">'+

              : '<button class="btn sm acc" onclick="ccAdd(\''+escHtml(e.id)+'\')"><i class="ti ti-calendar-plus"></i> Add to calendar</button>')+
            (e.url ? '<a class="btn sm" href="'+escHtml(e.url)+'" target="_blank" rel="noopener"><i class="ti ti-ticket"></i> Tickets</a>' : '')+

}
async function ccSearch(){

// Network/server problems get a real explanation instead of a bare "Failed."
async function ccPost(url, body){
  try{
    const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    let d = {}; try{ d = await r.json(); }catch(e){}
    if(!r.ok && !d.error) d.error = 'The server answered with an error ('+r.status+'). Try again in a moment.';
    return d;
  }catch(e){ return { error:'No answer from the server — check your connection and try again.' }; }
}
async function ccFollow(btn, id){
  btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i>';
  const r = await ccPost('/api/concerts/follow', { id, name: btn.dataset.name, image: btn.dataset.img });
  const sy = r.sync || {};
  await ccLoad(r.error ? '<span style="color:var(--red)">'+escHtml(r.error)+'</span>'
    : sy.error ? '<span style="color:var(--yellow)">Following <b>'+escHtml(btn.dataset.name)+'</b>, but their dates couldn’t be checked yet: '+escHtml(sy.error)+'</span>'
    : '✅ Following <b>'+escHtml(btn.dataset.name)+'</b>. New European dates will send you a notification.');
}

// "Check now" runs on the server in the background (with many artists it
// takes a little while); the widget waits for the new check to land.
async function ccRefresh(btn){
  const reset = () => { if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-refresh"></i> Check now'; } };
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Checking…'; }
  const before = (_cc && _cc.events || []).length;
  const r = await ccPost('/api/concerts/sync');
  if(r.error){ reset(); return ccLoad('<span style="color:var(--yellow)">'+escHtml(r.error)+'</span>'); }
  ccRender('<i class="ti ti-loader-2"></i> Checking '+(r.artists||'all')+' artists on Ticketmaster — about '+Math.max(5, Math.ceil((r.artists||10)*0.5))+' seconds…');
  const t0 = Date.now();
  while(Date.now()-t0 < 120000){
    await new Promise(z=>setTimeout(z, 3000));
    if(!document.getElementById('ccBody')){ reset(); return; }
    let d; try{ d = await (await fetch('/api/concerts')).json(); }catch(e){ continue; }
    if(d.lastSync && d.lastSync !== r.before){

      const diff = (d.events||[]).length - before;
      return ccRender(d.lastError ? '<span style="color:var(--yellow)">Checked, with a problem: '+escHtml(d.lastError)+'</span>'
        : diff > 0 ? '🎉 '+diff+' new date'+(diff===1?'':'s')+' found.' : '✅ Up to date.');
    }
  }
  reset();
  ccLoad('Still checking in the background — reopen Concerts in a minute.');
}

// ─── ROUTE MAP ───────────────────────────────────────────
// A map of the journey behind a "leave by" warning: start, destination and
// the route the time was worked out from. Leaflet (open-source) loads only
// the first time a map is opened; tiles are OpenStreetMap data via CARTO.
let _leafletP = null, _rmap = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(_leafletP) return _leafletP;
  _leafletP = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => resolve();
    js.onerror = () => { _leafletP = null; reject(new Error('The map could not load — check your connection.')); };
    document.head.appendChild(js);
  });
  return _leafletP;
}
function mapBtnHtml(){
  return ' <button type="button" class="btn sm map-inline" onclick="mapFromForm()"><i class="ti ti-map-2"></i> Map</button>';
}
function mapFromForm(){
  const v = id => ((document.getElementById(id)||{}).value||'').trim();
  openRouteMap({ to:v('floc'), from:v('ffrom'), name:v('fn'), time:v('ft'),

function openRouteMapFor(id){

  if(!ev || !ev.location) return;

function _mapEsc(e){ if(e.key === 'Escape'){ e.stopPropagation(); closeRouteMap(); } }
async function openRouteMap(o){

  // With a CARTO key (Settings \u2192 Private): CARTO's dark map, which suits the

  const osmAttr = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
  if(d.tileKey){
    L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key='+encodeURIComponent(d.tileKey), {

    }).addTo(map);
  } else {

  const pts = [];

  const mins = cfg.manual ? o.mins : d.mins;
  const leave = (o.time && mins) ? leaveTimeFor(o.time, mins) : null;
  document.getElementById('rinfo').innerHTML =

      (d.estimated ? ' Route unavailable — times are an estimate.' : '')+

    '</div>';
  const gm = { drive:'driving', taxi:'driving', walk:'walking', bike:'bicycling', transit:'transit', custom:'driving' }[o.mode] || 'driving';
  const gUrl = 'https://www.google.com/maps/dir/?api=1'+(from?'&origin='+from.join(','):'')+'&destination='+to.join(',')+'&travelmode='+gm;
  const wUrl = 'https://waze.com/ul?ll='+to.join(',')+'&navigate=yes';
  document.getElementById('racts').innerHTML =

    ((o.mode==='drive'||o.mode==='taxi') ? '<a class="btn sm" href="'+wUrl+'" target="_blank" rel="noopener"><i class="ti ti-navigation"></i> Waze</a>' : '')+

}
function reminderLabelTxt(m){
  m=parseInt(m);
  if(m>=60) return Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'');
  return m+' min';
}
// Departure time = start − drive − the slack you configured.
function leaveTimeFor(hhmm, driveMins){
  if(!hhmm||driveMins==null) return null;
  const buf=parseInt(S.leaveBuffer!=null?S.leaveBuffer:10)||0;
  const [h,m]=hhmm.split(':').map(Number);
  const d=new Date(); d.setHours(h,m,0,0);
  d.setMinutes(d.getMinutes()-driveMins-buf);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function leaveChip(ev){
  if(S.leaveBy===false || !ev.location) return '';
  const mode=ev.travelMode||'drive';
  const cfg=TRAVEL_MODES[mode]||TRAVEL_MODES.drive;
  let mins=parseInt(ev.travelMins)||null, tip='';
  if(!mins){
    const evFrom=String(ev.travelFrom||'').trim().toLowerCase();
    const hit=Object.values(S.travelCache||{}).find(x=>x && x.place &&
      x.place.toLowerCase()===String(ev.location).toLowerCase() && (x.mode||'drive')===mode &&
      String(x.fromPlace||'').trim().toLowerCase()===evFrom);
    if(!hit||hit.mins==null) return '';
    mins=hit.mins;
    tip=(hit.toName||ev.location)+(hit.estimated?' (estimated)':'')+(hit.precise===false?' (town centre)':'');
  } else {
    tip=ev.location+' (your estimate)';
  }
  const lv=leaveTimeFor(ev.time, mins);
  if(!lv) return '';
  return '<span style="font-size:9px;background:#f59e0b18;color:#f59e0b;border:1px solid #f59e0b45;border-radius:10px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px" title="'+escHtml(tip)+' \u00b7 '+mins+' min by '+escHtml(cfg.label.toLowerCase())+'">'+cfg.emoji+' leave '+lv+'</span>';
}

// ─── TIME WHEEL ──────────────────────────────────────────
// Replaces the browser's native time input with two snapping columns, so
// setting a time is a flick rather than a fiddle — and it looks the same on
// every device instead of whatever each browser decides to render.
const TP_ITEM_H = 44;
const TP_MIN_STEP = 5;
function tpFill(col, values, current){
  col.innerHTML = values.map(v=>'<div class="titem" role="option" data-v="'+v+'">'+v+'</div>').join('');
  const idx = Math.max(0, values.indexOf(current));
  col.scrollTop = idx * TP_ITEM_H;
  tpMark(col);
}
function tpMark(col){
  const idx = Math.round(col.scrollTop / TP_ITEM_H);
  [...col.children].forEach((el,i)=>{
    const sel = i===idx;
    el.classList.toggle('sel', sel);
    el.setAttribute('aria-selected', sel ? 'true' : 'false');
  });
  return idx;
}
function tpValue(col){
  const el = col.children[Math.round(col.scrollTop / TP_ITEM_H)];
  return el ? el.dataset.v : null;
}
// Writes one column's chosen value straight into the field, without
// waiting for the scroll animation to settle.
function tpCommit(col, value){
  const inp=document.getElementById('ft'); if(!inp) return;
  const [hh,mm]=(inp.value||'09:00').split(':');
  inp.value = (col.id==='tpH' ? value : hh) + ':' + (col.id==='tpM' ? value : mm);
}

function tpSync(){
  const h=document.getElementById('tpH'), m=document.getElementById('tpM');
  const inp=document.getElementById('ft');
  if(!h||!m||!inp) return;
  inp.value = (tpValue(h)||'09') + ':' + (tpValue(m)||'00');
}
function tpScrollTo(col, value){
  const i = [...col.children].findIndex(el=>el.dataset.v===value);
  if(i<0) return;
  // Mark the scroll as ours. The settle handler below interrupts an
  // in-flight smooth scroll if it isn't told to stand back, which committed
  // whichever row happened to be passing instead of the one chosen.
  col._prog = (col._prog||0) + 1;
  clearTimeout(col._progT);
  col._progT = setTimeout(()=>{ col._prog = 0; tpSync(); }, 500);
  col.scrollTo({ top: i*TP_ITEM_H, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function tpSet(hhmm){
  const [hh,mm]=hhmm.split(':');
  const h=document.getElementById('tpH'), m=document.getElementById('tpM');
  if(!h||!m) return;
  tpEnsureMinute(mm);
  // Set the value immediately rather than reading it back after a smooth
  // scroll — mid-animation the wheel reports whichever row it's passing,
  // which produced times nobody chose.
  const inp=document.getElementById('ft');
  if(inp) inp.value = hh+':'+mm;
  tpScrollTo(h,hh); tpScrollTo(m,mm);
}
function tpSetNow(){
  const d=new Date();
  // Snap to the nearest step so it lands on a value the wheel actually has.
  const mins = Math.round(d.getMinutes()/TP_MIN_STEP)*TP_MIN_STEP;
  const d2 = new Date(d.getTime()); d2.setMinutes(mins, 0, 0);
  tpSet(String(d2.getHours()).padStart(2,'0')+':'+String(d2.getMinutes()).padStart(2,'0'));
}
// Existing events may sit on a minute the 5-step wheel doesn't list
// (a synced fixture at 20:45 is fine, but 19:47 would be lost) — so add it.
function tpEnsureMinute(mm){
  const m=document.getElementById('tpM');
  if(!m || [...m.children].some(el=>el.dataset.v===mm)) return;
  const vals=[...m.children].map(el=>el.dataset.v).concat(mm).sort();
  tpFill(m, vals, mm);
}
function initTimePicker(){
  const h=document.getElementById('tpH'), m=document.getElementById('tpM'), inp=document.getElementById('ft');
  if(!h||!m||!inp||h.dataset.init) return;
  h.dataset.init='1';
  const [ch,cm]=(inp.value||'09:00').split(':');
  const hours=[...Array(24)].map((_,i)=>String(i).padStart(2,'0'));
  let mins=[...Array(60/TP_MIN_STEP)].map((_,i)=>String(i*TP_MIN_STEP).padStart(2,'0'));
  if(!mins.includes(cm)) mins=[...mins, cm].sort();
  tpFill(h, hours, ch);
  tpFill(m, mins, cm);
  [h,m].forEach(col=>{
    let t;
    col.addEventListener('scroll', ()=>{
      tpMark(col);
      if(col._prog) return;   // our own animation — leave it alone
      clearTimeout(t); t=setTimeout(()=>{ col.scrollTop = Math.round(col.scrollTop/TP_ITEM_H)*TP_ITEM_H; tpSync(); }, 90);
    }, {passive:true});
    col.addEventListener('click', e=>{
      const it=e.target.closest('.titem'); if(!it) return;
      tpScrollTo(col, it.dataset.v);
      tpCommit(col, it.dataset.v);
    });
    col.addEventListener('keydown', e=>{
      if(e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
      e.preventDefault();
      const i=Math.round(col.scrollTop/TP_ITEM_H) + (e.key==='ArrowDown'?1:-1);
      const el=col.children[Math.max(0,Math.min(col.children.length-1,i))];
      if(el){ tpScrollTo(col, el.dataset.v); tpCommit(col, el.dataset.v); }
    });
  });
  tpSync();
}

// ─── SWIPE NAVIGATION ─────────────────────────────────────
// Swipe left/right on the month grid to change month, and on the day
// agenda to change day. Only a clearly horizontal gesture counts, so
// normal vertical scrolling is never hijacked.
function attachSwipe(el, onLeft, onRight){
  if(!el) return;
  let x0=null, y0=null, t0=0;
  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    x0=null;
    // Horizontal, long enough, quick enough, and clearly not a scroll.
    if(Math.abs(dx) < 50) return;
    if(Math.abs(dx) < Math.abs(dy)*1.5) return;
    if(dt > 700) return;
    const target = el;
    target.classList.remove('swipe-l','swipe-r');
    void target.offsetWidth; // restart the animation
    if(dx < 0){ target.classList.add('swipe-l'); onLeft(); }
    else      { target.classList.add('swipe-r'); onRight(); }
  }, {passive:true});
}
window.addEventListener('load', ()=>{
  attachSwipe(document.getElementById('cgrid'),  ()=>shiftMonth(1), ()=>shiftMonth(-1));
  attachSwipe(document.getElementById('lpBody'), ()=>shiftDay(1),   ()=>shiftDay(-1));
});

// ─── VERSION / FORCE UPDATE ───────────────────────────────
// Browsers (phones especially) cache the app shell and keep running an old
// build after a deploy. This shows what's actually running and provides a
// reliable way to drop the cache and pick up the newest version.
const APP_BUILD='2026-10-26-wallpaper-alerts';
// ─── OPENING FROM A NOTIFICATION ─────────────────────────
// A reminder can be for tomorrow (or later), so tapping it has to move the
// view to THAT day — opening on today showed a different day's events and
// left you guessing what the reminder was about.
function openOnDate(ds, evId){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds||'')) return;
  const today=parseD(TODAY), target=parseD(ds);
  const diff=Math.round((target-today)/86400000);
  S.dayOffset=diff;
  _selDay=ds;
  // Move the month view too, so the calendar shows the same day.
  S.weekOffset=(target.getFullYear()-today.getFullYear())*12 + (target.getMonth()-today.getMonth());
  renderAll();
  if(evId) setTimeout(()=>flashEvent(evId), 120);
}
function flashEvent(evId){
  const card=document.querySelector('.ecard[data-ev="'+(window.CSS&&CSS.escape?CSS.escape(evId):evId)+'"]');
  if(!card) return;

// ─── BACKUP TO A PC FOLDER ───────────────────────────────
// Replaces the backups that used to be sent to Telegram. The browser can
// only write to a folder you pick, and only while the app is open, so this
// is desktop Chrome/Edge; elsewhere the Download button still works.
const FS_DB='org-fs', FS_KEY='backupDir';
function fsIdb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(FS_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore('h');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function fsSaveHandle(h){ const db=await fsIdb(); return new Promise(r=>{ const t=db.transaction('h','readwrite'); t.objectStore('h').put(h,FS_KEY); t.oncomplete=r; }); }
async function fsGetHandle(){ const db=await fsIdb(); return new Promise(r=>{ const t=db.transaction('h','readonly'); const q=t.objectStore('h').get(FS_KEY); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }

function fsSupported(){ return typeof window.showDirectoryPicker === 'function'; }

async function refreshFsInfo(){
  const el=document.getElementById('fsInfo'); if(!el) return;
  if(!fsSupported()){
    el.innerHTML='<span style="color:var(--txt3)">This browser can\u2019t write to a folder. Use <b>Download</b> above, or open the app in Chrome or Edge on a computer.</span>';
    return;
  }
  const h=await fsGetHandle();
  const last=lsGet('org:fsLast');
  el.innerHTML = h
    ? '\u2705 Saving to <b>'+escHtml(h.name)+'</b>'+(last?' \u00b7 last backup '+escHtml(last.slice(0,10)):'')
    : 'No folder chosen yet.';
}
async function pickBackupFolder(){
  const el=document.getElementById('fsInfo');
  if(!fsSupported()){ refreshFsInfo(); return; }
  try{
    const h=await window.showDirectoryPicker({ id:'organizer-backup', mode:'readwrite' });
    await fsSaveHandle(h);
    el.innerHTML='\u2705 Folder set \u2014 backing up\u2026';
    await backupToFolder(true);
  }catch(e){ if(e && e.name!=='AbortError') el.innerHTML='<span style="color:var(--red)">Could not use that folder.</span>'; }
}
async function backupToFolder(force){
  const el=document.getElementById('fsInfo');
  if(!fsSupported()) return;
  const h=await fsGetHandle();
  if(!h){ if(force && el) el.textContent='Choose a folder first.'; return; }
  // Once a day is plenty; the data changes slowly.
  const last=lsGet('org:fsLast');
  if(!force && last && (Date.now()-new Date(last).getTime()) < 20*3600*1000) return;
  try{
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      const ask=await h.requestPermission({mode:'readwrite'});
      if(ask!=='granted'){ if(el) el.innerHTML='<span style="color:var(--yellow)">Permission to that folder was declined.</span>'; return; }
    }
    const data=await (await fetch('/api/backup')).text();
    const name='organizer-backup-'+new Date().toISOString().slice(0,10)+'.json';
    const fh=await h.getFileHandle(name,{create:true});
    const w=await fh.createWritable(); await w.write(data); await w.close();
    lsSet('org:fsLast', new Date().toISOString());
    if(el) el.innerHTML='\u2705 Saved <b>'+escHtml(name)+'</b> to <b>'+escHtml(h.name)+'</b>';
  }catch(e){ if(el) el.innerHTML='<span style="color:var(--red)">Backup failed: '+escHtml(e.message)+'</span>'; }
}

  try{

    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        try{ await reg.update(); }catch(e){}

        // every tab is closed — tell it to take control now.
        if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});

    if(window.caches){

    if(el) el.innerHTML='<i class="ti ti-loader-2"></i> Reloading\u2026';

    setTimeout(()=>{ location.replace(location.pathname+'?v='+Date.now()); }, 400);

    if(el) el.innerHTML='<span style="color:var(--red)">Update failed: '+escHtml(e.message)+'</span>';

// ─── WEB PUSH ─────────────────────────────────────────────
// Notifications that arrive with the app closed. Requires a service worker
// and, on iPhone, the app must have been added to the Home Screen.
// Compares an existing subscription's server key against the current one.
// A subscription created with an older VAPID key is silently rejected by
// Apple/Google ("VapidPkHashMismatch"), and simply re-registering it never
// fixes that — it has to be torn down and recreated.
function subKeyMatches(sub, key){
  try{
    const raw = sub && sub.options && sub.options.applicationServerKey;
    if(!raw) return false;
    const b64 = btoa(String.fromCharCode(...new Uint8Array(raw)))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return b64 === String(key).replace(/=+$/,'');
  }catch(e){ return false; }
}

function urlBase64ToUint8Array(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b64=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

// iOS in particular drops push subscriptions without warning — the app
// kept showing "enabled" while the server had zero devices, so reminders
// silently went nowhere. On every launch we re-assert the subscription and
// re-register it with the server, which is idempotent.
async function ensurePushSubscription(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if(Notification.permission !== 'granted') return;   // never prompt unasked
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch('/api/push/key')).json();
    if(!key) return;
    let sub = await reg.pushManager.getSubscription();
    if(sub && !subKeyMatches(sub, key)){
      try{ await sub.unsubscribe(); }catch(e){}
      sub = null;
      console.log('Push subscription used an old VAPID key — rebuilding.');
    }
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(key)
      });
      console.log('Push subscription recreated.');
    }
    const label=(navigator.userAgent.match(/(iPhone|iPad|Android|Windows|Macintosh|Linux)/)||['device'])[0];
    await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subscription:sub.toJSON(), label})});
  }catch(e){ console.log('Push re-subscribe failed:', e.message); }
}

function alDayLabel(ds){ if(ds===TODAY) return 'Today'; const t=new Date(parseD(TODAY)); t.setDate(t.getDate()+1); const tm=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); return ds===tm?'Tomorrow':fmtShort(parseD(ds)); }
function alClock(ms){ return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function alGroups(list){

function alRemLabel(a){

function alCard(g, focus){

      (!sport && ev && !isDoneOn(ev, a.date) ? '<button class="ea" onclick="alDone(\''+k+'\')" title="Marks the task itself as done"><i class="ti ti-check"></i>Task done</button>' : '')+
    '</div>'+

async function refreshPushStatus(){

  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    el.textContent='⚠️ This browser doesn\u2019t support push notifications.'; return;
  }
  if(Notification.permission==='denied'){
    el.innerHTML='<span style="color:var(--red)">Blocked in browser settings \u2014 you\u2019ll need to re-allow notifications for this site.</span>'; return;
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    el.innerHTML = sub
      ? '<span style="color:var(--green)">\u2705 Enabled on this device.</span>'
      : 'Not enabled on this device yet.';
  }catch(e){ el.textContent='Status unknown: '+e.message; }
}

async function enablePush(){
  const el=document.getElementById('pushStatus');
  el.style.color='var(--txt3)'; el.innerHTML='<i class="ti ti-loader-2"></i> Enabling\u2026';
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window))
      throw new Error('This browser doesn\u2019t support push.');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ el.innerHTML='<span style="color:var(--red)">Permission denied.</span>'; return; }
    const reg=await navigator.serviceWorker.ready;
    const { key }=await (await fetch('/api/push/key')).json();
    if(!key) throw new Error('Server did not return a push key.');
    let sub=await reg.pushManager.getSubscription();
    if(sub && !subKeyMatches(sub, key)){
      // Stale subscription from an earlier VAPID key — discard it, or the
      // push service will keep rejecting every message sent to it.
      try{ await sub.unsubscribe(); }catch(e){}
      sub = null;
      console.log('Discarded a push subscription made with an old VAPID key.');
    }
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(key)
      });
    }
    const label=(navigator.userAgent.match(/(iPhone|iPad|Android|Windows|Macintosh|Linux)/)||['device'])[0];
    const r=await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subscription:sub.toJSON(), label})});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    el.innerHTML='<span style="color:var(--green)">\u2705 Enabled. '+d.devices+' device(s) registered.</span>';
  }catch(e){ el.innerHTML='<span style="color:var(--red)">Failed: '+escHtml(e.message)+'</span>'; }
}

    if(sub){
      await fetch('/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({endpoint:sub.endpoint})});

    }

  }catch(e){ el.innerHTML='<span style="color:var(--red)">Failed: '+escHtml(e.message)+'</span>'; }
}

    const line=(label,r)=> (r.ok?'\u2705 ':'\u274c ')+label+(r.ok?'':' \u2014 '+escHtml(r.error||'failed'));

    // means the token belongs to a different bot than the chat you have open.
    el.innerHTML=
                 '<div>'+line('Push'+(d.push.devices!=null?' ('+d.push.devices+' device)':''),d.push)+'</div>'+
                 '<div style="margin-top:4px;color:var(--txt2)">'+escHtml(d.summary)+'</div>';
  }catch(e){ el.innerHTML='<span style="color:var(--red)">Failed: '+escHtml(e.message)+'</span>'; }
}

async function testPush(){
  const el=document.getElementById('pushStatus');
  el.style.color='var(--txt3)'; el.innerHTML='<i class="ti ti-loader-2"></i> Sending\u2026';
  try{
    const d=await (await fetch('/api/push/test',{method:'POST'})).json();
    if(d.error) throw new Error(d.error);
    if(!d.devices || !d.devices.length){
      el.innerHTML='<span style="color:var(--red)">No devices registered \u2014 tap Enable first.</span>';
      return;
    }
    // Report per device: a rejection used to be hidden, which made a key
    // mismatch look identical to having no devices at all.
    el.style.textAlign='left';
    el.innerHTML = d.devices.map(x=>
      (x.ok ? '\u2705 ' : '\u274c ') + escHtml(x.label) + ' (' + escHtml(x.host) + ')' +
      (x.ok ? '' : ' \u2014 ' + escHtml(x.meaning || x.error || ('HTTP '+x.status)))
    ).join('<br>') + '<div style="margin-top:4px;color:var(--txt2)">Delivered to '+d.sent+' of '+d.devices.length+'.</div>';
  }catch(e){ el.innerHTML='<span style="color:var(--red)">Failed: '+escHtml(e.message)+'</span>'; }
}

// ─── PWA INSTALL ──────────────────────────────────────────
// Registering a service worker is what makes Android Chrome and desktop
// browsers offer "Install". Failure here must never break the app, so it's
// entirely wrapped and non-blocking.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(()=>console.log('Service worker registered.'))
      .catch(e=>console.log('Service worker registration failed:',e.message));
  });
}

// Chrome fires this instead of showing its own prompt; stash it so the
// button in Settings can trigger installation on demand.
let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  _installPrompt = e;
  const b = document.getElementById('installBtnWrap');
  if(b) b.style.display='block';
});
window.addEventListener('appinstalled', ()=>{
  _installPrompt = null;
  const b = document.getElementById('installBtnWrap');
  if(b) b.style.display='none';
});
async function installApp(){
  const el=document.getElementById('installHint');
  if(!_installPrompt){
    if(el) el.textContent='Your browser didn\u2019t offer an install prompt. Use the browser menu \u2192 “Install app” / “Add to Home screen”.';
    return;
  }
  _installPrompt.prompt();
  const { outcome } = await _installPrompt.userChoice;
  _installPrompt = null;
  if(el) el.textContent = outcome==='accepted' ? '\u2705 Installed.' : 'Installation dismissed.';
}

// ─── RENDER ALL ───────────────────────────────────────────
function renderAll(){renderLP();renderCal();syncAppBadge();}

// ─── BOOT ────────────────────────────────────────────────
renderWx(); // shows loading state until real data arrives
// Load data from server then render
loadFromServer().then(()=>{
  renderAll();
  handleOpenParams();     // opened from a reminder? jump to that day
  loadWeather(); // fetch real weather for the saved/default location
  scheduleAllReminders(); // local browser notifications
});

// Weather auto-refresh: re-fetch every 30 minutes so the widget doesn't go
// stale if the app is left open, plus immediately whenever the tab/app
// becomes visible again after being backgrounded (mobile especially).
// Weather auto-refresh must never disturb an open dialog. Refreshing
// re-renders (and can trigger a save), which is disruptive if you're
// mid-way through typing or pasting into Settings — e.g. tabbing away to
// copy an API key and coming back would fire the visibility refresh.
let _lastWxRefresh = Date.now();
function modalIsOpen(){
  const m = document.getElementById('modal');
  return !!(m && m.classList.contains('open'));
}
setInterval(()=>{ if(!document.hidden && !modalIsOpen()){ loadWeather(); _lastWxRefresh = Date.now(); } }, 30*60*1000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !modalIsOpen() && Date.now()-_lastWxRefresh > 5*60*1000){
    _lastWxRefresh = Date.now();
    loadWeather();
  }
});

// Pull fresh data when the tab becomes visible again. Without this a tab
// left open for hours keeps showing (and saving from) a stale view, which
// is how changes made on another device appeared to vanish.
document.addEventListener('visibilitychange', async ()=>{
  if(document.hidden || modalIsOpen()) return;
  try{
    const r = await fetch('/api/data');
    const d = await r.json();
    if(d && d._rev && d._rev !== S._rev){
      await loadFromServer();
      renderAll();
      console.log('Refreshed: data had changed elsewhere.');
    }
  }catch(e){}
});

// The day list is drawn once, so a task whose time passes while the app
// stays open (or sits in the background) kept its earlier look until the
// next redraw. Check every 20 s and on return: redraw when any card on the
// shown day crosses its time, and reload after midnight so "Today" moves on.
let _odSig='';
function overdueSig(){
  try{ return agendaEventsOnDay(fmtD(currentDay())).map(ev=>(ev.id||'')+(isPastEvent(ev)?'1':'0')).join(','); }catch(e){ return ''; }
}
function overdueTick(){
  if(document.hidden || modalIsOpen()) return;
  const n=new Date();
  const today=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  if(today!==TODAY){ location.reload(); return; }
  const sig=overdueSig();
  if(_odSig && sig!==_odSig){ renderLP(); renderCal(); syncAppBadge(); }
  _odSig=sig;
}
window.addEventListener('load', ()=>{ _odSig=overdueSig(); });
setInterval(overdueTick, 20000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ _odSig=_odSig||overdueSig(); overdueTick(); } });

// Keep the push subscription alive whenever the app is opened or brought
// to the front, and re-check the badge (only tasks still not Done keep it).
window.addEventListener('load', ()=>{ ensurePushSubscription(); syncAppBadge(); });
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ ensurePushSubscription(); syncAppBadge(); }
});

// Request notification permission on load and schedule all reminders
requestNotifPermission(function(granted){
  if(granted) scheduleAllReminders();
});
// If permission already granted, schedule immediately
if(typeof Notification!=='undefined' && Notification.permission==='granted'){
  scheduleAllReminders();
}
</script>
